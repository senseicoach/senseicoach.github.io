scene": "Coffee with a mentor. Lucas meets Isabelle, a mentor from a newcomer program, to talk about his career.", "F": "Giving advice, the subjunctive", "V": "la réflexion (thinking, reflection); confier (to entrust); bénévolement (as a volunteer, for free); avoir du sens (to be meaningful); l'assurance collective (group benefits); une crainte (a fear); il vaudrait mieux que (it would be better if); à ton tour (in turn)", "t": [[1.99, 5.88], [6.1, 10.1], [10.75, 12.62], [12.84, 18.84], [19.06, 21.46], [22.1, 23.98], [24.62, 28.2], [28.42, 33.94], [34.15, 36.89], [37.1, 41.69], [42.34, 44.71], [44.93, 48.89], [49.1, 52.37], [53.02, 55.37], [55.58, 59.16], [59.38, 63.74], [64.39, 66.65], [67.3, 69.17], [69.38, 71.98], [72.19, 75.98], [76.2, 79.68], [80.33, 82.73], [82.94, 87.43], [87.65, 93.6], [94.25, 96.38], [97.03, 104.42], [104.64, 108.74], [109.39, 111.72], [111.94, 114.62], [115.27, 118.54], [118.75, 121.73], [121.94, 126.86], [127.08, 130.15], [130.8, 133.34], [133.56, 138.05], [138.7, 140.88], [141.1, 145.34]], "R": []}, {"num": 77, "title": "Au bureau du professeur", "lines": [["P", "Entrez, Camila. Asseyez-vous. Vous vouliez me voir à propos de l'examen ?", "Professeure Dubois"], ["S", "Oui, merci de me recevoir. J'ai eu soixante-huit pour cent, et je suis un peu déçue. J'aimerais comprendre mes erreurs, surtout à la question douze.", "Camila"], ["P", "Bien sûr. Regardons-la ensemble. La question demandait d'expliquer les interventions prioritaires pour un patient en insuffisance cardiaque. Votre réponse est correcte sur le plan clinique. Mais vous avez répondu en une liste de mots, sans justifier vos choix.", "Professeure Dubois"], ["S", "Je pensais que l'essentiel, c'était de donner les bonnes interventions.", "Camila"], ["P", "C'est une partie de la réponse. Mais dans ce cours, on évalue aussi votre raisonnement clinique. Pourquoi cette intervention en premier ? Qu'est-ce que vous surveillez ensuite ? C'est ce raisonnement qui valait la moitié des points.", "Professeure Dubois"], ["S", "Je comprends mieux. Au Brésil, les examens étaient surtout à choix multiples. Je n'ai pas l'habitude de rédiger de longues réponses, surtout en français.", "Camila"], ["P", "C'est une difficulté que beaucoup d'infirmières formées à l'étranger rencontrent. Et je vois que vous connaissez très bien la matière. Le problème est dans la forme, pas dans le fond.", "Professeure Dubois"], ["S", "Est-ce qu'il est possible de réviser ma note ?", "Camila"], ["P", "Pour cet examen, non. Les critères étaient les mêmes pour tout le monde, et je dois être équitable. Par contre, je peux vous aider à réussir le prochain.", "Professeure Dubois"], ["S", "Je comprends. Qu'est-ce que vous me conseillez ?", "Camila"], ["P", "Utilisez une structure simple pour chaque réponse : d'abord l'intervention, ensuite la raison, et enfin ce que vous allez évaluer. Entraînez-vous avec les questions des années précédentes. Elles sont sur le portail. Si vous m'envoyez deux réponses par semaine, je vous donnerai des commentaires.", "Professeure Dubois"], ["S", "C'est très généreux de votre part. Merci beaucoup.", "Camila"], ["P", "Je vous en prie. Et il y a aussi le centre d'aide en français du cégep. Ils peuvent vous aider avec la rédaction. Vous avez tout ce qu'il faut pour réussir, Camila.", "Professeure Dubois"]], "words": 299, "kind": "story", "scene": "Office hours. During her program, Camila goes to see Professeure Dubois about a grade.", "F": "Explaining, justifying, asking respectfully", "V": "à propos de (about); déçu (disappointed); l'insuffisance cardiaque (heart failure); justifier (to justify); le raisonnement (reasoning); à choix multiples (multiple-choice); la forme, le fond (form, substance); équitable (fair); s'entraîner (to practise)", "t": [[1.99, 4.15], [4.37, 6.24], [6.46, 9.29], [9.94, 12.02], [12.24, 15.29], [15.5, 18.94], [19.58, 21.46], [21.67, 23.95], [24.17, 30.05], [30.26, 33.67], [33.89, 38.35], [39.0, 42.89], [43.54, 45.96], [46.18, 50.3], [50.52, 53.3], [53.52, 56.02], [56.23, 59.33], [59.98, 61.85], [62.06, 65.42], [65.64, 69.5], [70.15, 74.52], [74.74, 77.86], [78.07, 81.24], [81.89, 84.24], [84.89, 87.29], [87.5, 91.92], [92.14, 95.78], [96.43, 98.3], [98.52, 100.39], [101.04, 108.86], [109.08, 112.56], [112.78, 114.94], [115.15, 119.71], [120.36, 122.38], [122.59, 124.46], [125.11, 126.98], [127.2, 130.54], [130.75, 133.61], [133.82, 137.35]], "R": []}, {"num": 78, "title": "Le stage", "lines": [["P", "Bonjour, Camila. Je m'appelle Patrick, je serai ton superviseur de stage pour les six prochaines semaines. On se tutoie ici, ça te va ?", "Patrick"], ["S", "Oui, parfait. Enchantée, Patrick.", "Camila"], ["P", "Avant de commencer, je veux être clair sur mes attentes, pour qu'il n'y ait pas de surprise. D'accord ?", "Patrick"], ["S", "D'accord, je t'écoute.", "Camila"], ["P", "Premièrement, la ponctualité. Le quart commence à sept heures quinze, avec le rapport de l'équipe de nuit. Si tu arrives après, tu manques des informations essentielles sur tes patients. Arrive à sept heures.", "Patrick"], ["S", "Compris.", "Camila"], ["P", "Deuxièmement, pendant les deux premières semaines, tu vas t'occuper de deux patients. Ensuite, si tout va bien, on passera à quatre. Tu ne donnes aucun médicament sans que je vérifie avec toi. Aucun. Même si tu l'as fait mille fois au Brésil.", "Patrick"], ["S", "Je comprends. Ici, les protocoles sont différents.", "Camila"], ["P", "Exactement. Ce n'est pas une question de confiance, c'est une question de sécurité. Troisièmement, si tu ne sais pas quelque chose, dis-le. Je préfère cent fois une question à une erreur.", "Patrick"], ["S", "Parfait. Est-ce que je peux te poser une question tout de suite ?", "Camila"], ["P", "Bien sûr.", "Patrick"], ["S", "Pour les notes au dossier, est-ce que je les écris pendant le quart, ou à la fin ?", "Camila"], ["P", "Pendant le quart, idéalement après chaque soin important. Si tu attends la fin, tu vas oublier des détails. Et je vais relire tes notes chaque jour avant que tu partes, au moins la première semaine.", "Patrick"], ["S", "Ça me rassure, honnêtement. C'est la partie qui m'inquiète le plus.", "Camila"], ["P", "Ne t'inquiète pas. Ton évaluation est à la mi-stage, à la fin de la troisième semaine, et à la fin. On en parlera chaque vendredi, pour que tu saches toujours où tu en es. Bon, tu es prête ? On va rencontrer ton premier patient.", "Patrick"]], "words": 283, "kind": "story", "scene": "The internship. On the first day of her hospital placement, Camila's supervisor explains what he expects.", "F": "Responsibilities, conditions, asking for clarification", "V": "le superviseur (the supervisor); les attentes (expectations); la ponctualité (punctuality); le rapport (the shift report); les protocoles (protocols); Je préfère cent fois… (I'd much rather…); rassurer (to reassure); où tu en es (how you're doing, where you stand)", "t": [[1.99, 4.68], [4.9, 11.26], [11.47, 14.23], [14.88, 16.75], [16.97, 18.98], [19.63, 26.38], [26.59, 28.46], [29.11, 30.98], [31.63, 34.7], [34.92, 39.98], [40.2, 45.74], [45.96, 48.29], [48.94, 50.81], [51.46, 57.38], [57.6, 62.04], [62.26, 66.77], [66.98, 68.86], [69.07, 72.77], [73.42, 75.29], [75.5, 78.12], [78.77, 80.64], [80.86, 86.04], [86.26, 90.89], [91.1, 95.02], [95.66, 96.48], [96.7, 99.12], [99.77, 101.74], [102.38, 106.32], [106.97, 111.67], [111.89, 116.09], [116.3, 122.3], [122.95, 125.02], [125.23, 127.42], [128.06, 130.06], [130.27, 136.51], [136.73, 142.13], [142.34, 144.38], [144.6, 147.77]], "R": []}, {"num": 79, "title": "Acheter ou louer ?", "lines": [["P", "Catherine, j'ai une question pour toi. Je pense à acheter un condo. Tout le monde me dit que louer, c'est jeter son argent par les fenêtres.", "Lucas"], ["S", "Ben, c'est pas toujours vrai, ça. Ça dépend de ta situation. T'as combien pour la mise de fonds ?", "Catherine"], ["P", "J'ai économisé environ quarante mille dollars. Le condo que j'ai vu coûte quatre cent vingt mille.", "Lucas"], ["S", "Donc, t'aurais un peu moins de dix pour cent. C'est possible, mais si t'as moins de vingt pour cent, il faut payer une assurance prêt hypothécaire. Ça ajoute plusieurs milliers de dollars à ton hypothèque.", "Catherine"], ["P", "Je savais pas. Mais au moins, chaque mois, je paierais pour quelque chose qui m'appartient.", "Lucas"], ["S", "Oui, c'est l'argument principal. Mais pense à tous les autres frais. Les frais de condo, les taxes municipales, l'assurance, les réparations. Pis la taxe de bienvenue.", "Catherine"], ["P", "La taxe de bienvenue ? C'est une blague ? On te souhaite la bienvenue avec une taxe ?", "Lucas"], ["S", "C'est le surnom qu'on donne aux droits de mutation. Tu la paies une fois, quand t'achètes. Pour un condo à ce prix-là, à Montréal, ça peut faire autour de cinq ou six mille dollars.", "Catherine"], ["P", "Ouf. Faque, si je calcule tout, ça me coûterait combien par mois ?", "Lucas"], ["S", "Probablement plus que ton loyer actuel. Mais d'un autre côté, ton loyer augmente chaque année, et le paiement de ton hypothèque, lui, reste stable pendant la durée de ton terme.", "Catherine"], ["P", "C'est vrai. Et si je veux déménager dans trois ans ? Si, par exemple, Camila et moi, on décide de vivre ensemble ?", "Lucas"], ["S", "Ah, ça, c'est la vraie question ! Si tu penses déménager dans moins de cinq ans, acheter, c'est souvent pas rentable. Les frais d'achat et de vente vont manger ton profit.", "Catherine"], ["P", "Hum. T'aurais fait quoi, toi, à ma place ?", "Lucas"], ["S", "Moi, je continuerais à louer encore un an ou deux, pis je mettrais de l'argent de côté. Si t'avais vingt pour cent de mise de fonds, tu serais dans une bien meilleure position. Mais va voir un conseiller financier. Je suis pas une experte.", "Catherine"], ["P", "Merci. T'as raison, je vais pas me précipiter.", "Lucas"]], "words": 338, "kind": "story", "scene": "Buy or rent?. Lucas is thinking about buying a condo, and Catherine plays devil's advocate.", "F": "Opinions, money, hypotheses with si", "V": "jeter son argent par les fenêtres (to throw money away); la mise de fonds (the down payment); l'hypothèque (the mortgage); appartenir à (to belong to); la taxe de bienvenue (the land transfer tax (Québec nickname)); le terme (the mortgage term); rentable (profitable, worth it); se précipiter (to rush)", "t": [[1.99, 4.92], [5.14, 7.63], [7.85, 12.02], [12.67, 15.77], [15.98, 18.5], [18.72, 21.22], [21.86, 25.18], [25.39, 28.92], [29.57, 32.95], [33.17, 39.24], [39.46, 43.2], [43.85, 45.72], [45.94, 50.59], [51.24, 54.22], [54.43, 56.9], [57.12, 62.71], [62.93, 65.23], [65.88, 67.9], [68.11, 69.98], [70.2, 73.03], [73.68, 76.87], [77.09, 79.99], [80.21, 85.73], [86.38, 88.25], [88.46, 92.54], [93.19, 96.48], [96.7, 105.12], [105.77, 107.64], [107.86, 110.64], [110.86, 115.61], [116.26, 119.18], [119.4, 124.49], [124.7, 128.14], [128.78, 130.66], [130.87, 133.85], [134.5, 140.02], [140.23, 145.27], [145.49, 148.34], [148.56, 150.94], [151.58, 153.46], [153.67, 156.7]], "R": []}, {"num": 80, "title": "La réparation imprévue", "lines": [["P", "Bonjour, monsieur Oliveira. Votre auto est prête. Voici la facture.", "Le garagiste"], ["S", "Merci. Attendez, il doit y avoir une erreur. Sept cent quarante-huit dollars ? Hier, au téléphone, vous m'avez dit que les freins coûteraient environ quatre cents dollars.", "Lucas"], ["P", "Oui, mais en faisant les freins, le mécanicien a vu que les disques étaient usés aussi. Alors, il les a changés. C'était plus sécuritaire.", "Le garagiste"], ["S", "Je comprends que c'est peut-être nécessaire. Mais personne ne m'a appelé pour me demander mon accord. J'étais disponible toute la journée.", "Lucas"], ["P", "C'est vrai que normalement, on appelle le client. Le mécanicien était pressé, je pense.", "Le garagiste"], ["S", "Écoutez, je ne veux pas être désagréable. Mais j'ai vérifié sur le site de l'Office de la protection du consommateur. Un garage ne peut pas dépasser l'évaluation sans le consentement du client.", "Lucas"], ["P", "Vous êtes bien informé. Mais il faut quand même payer les pièces. Les disques sont déjà installés.", "Le garagiste"], ["S", "Je propose qu'on trouve une solution juste. Je paie les quatre cents dollars qui avaient été convenus. Pour les disques, je suis prêt à payer les pièces, mais pas la main-d'œuvre supplémentaire, puisque je n'ai pas donné mon accord.", "Lucas"], ["P", "Hum. Les pièces, c'est cent quatre-vingts dollars. Donc, vous me paieriez cinq cent quatre-vingts dollars, plus les taxes ?", "Le garagiste"], ["S", "Exactement. Et j'aimerais que la facture le précise, avec les anciennes pièces mentionnées. D'ailleurs, est-ce que je peux voir les anciens disques ?", "Lucas"], ["P", "Bien sûr, on les a gardés. Regardez, vous voyez l'usure, ici ? Ils étaient vraiment finis.", "Le garagiste"], ["S", "Effectivement. Alors, je pense que mon offre est raisonnable pour nous deux.", "Lucas"], ["P", "Bon, d'accord. Vous êtes un bon client, et on a fait une erreur. Je vais refaire la facture. Mais la prochaine fois, demandez une évaluation écrite, ça évite les malentendus.", "Le garagiste"], ["S", "Promis. Et merci d'avoir été compréhensif.", "Lucas"], ["P", "Pas de problème. Et votre auto freine comme une neuve, maintenant !", "Le garagiste"]], "words": 297, "kind": "story", "scene": "The surprise repair. Lucas picks up his car and finds a bill much higher than the estimate.", "F": "Complaints, consumer rights, staying firm and polite", "V": "une auto (a car (Québec)); les freins (the brakes); usé, l'usure (worn, wear); sécuritaire (safe (Québec)); l'accord, le consentement (agreement, consent); dépasser l'évaluation (to go over the estimate); convenu (agreed); la main-d'œuvre (labour); un malentendu (a misunderstanding)", "t": [[1.99, 4.85], [5.06, 7.32], [7.54, 9.74], [10.39, 12.26], [12.48, 15.67], [15.89, 18.24], [18.46, 23.9], [24.55, 29.76], [29.98, 32.54], [32.76, 35.18], [35.83, 38.88], [39.1, 42.67], [42.89, 45.6], [46.25, 49.66], [49.87, 53.35], [54.0, 57.41], [57.62, 62.06], [62.28, 66.77], [67.42, 69.62], [69.84, 72.77], [72.98, 75.65], [76.3, 79.42], [79.63, 83.09], [83.3, 90.19], [90.84, 92.71], [92.93, 96.24], [96.46, 101.16], [101.81, 103.68], [103.9, 108.41], [108.62, 112.01], [112.66, 115.37], [115.58, 118.99], [119.21, 121.51], [122.16, 124.03], [124.25, 128.26], [128.9, 130.97], [131.18, 134.76], [134.98, 137.47], [137.69, 143.42], [144.07, 145.94], [146.16, 149.04], [149.69, 151.63], [151.85, 155.33]], "R": []}, {"num": 81, "title": "Info-Santé 811", "lines": [["P", "Info-Santé, bonjour. Je suis Nancy, infirmière. Avant de commencer, est-ce que votre vie est en danger, ou celle d'une autre personne ?", "L'infirmière"], ["S", "Non, non. Je me suis blessé à la cheville, et je voudrais savoir si je dois aller à l'urgence.", "Lucas"], ["P", "D'accord. Votre nom et votre date de naissance, s'il vous plaît ?", "L'infirmière"], ["S", "Lucas Oliveira, le douze mars mille neuf cent quatre-vingt-quatorze.", "Lucas"], ["P", "Merci. Racontez-moi ce qui s'est passé.", "L'infirmière"], ["S", "Il y a environ une heure, j'ai glissé sur la glace devant chez moi. Mon pied a tourné vers l'intérieur, et je suis tombé. Maintenant, ma cheville est enflée, et elle commence à devenir bleue.", "Lucas"], ["P", "Est-ce que vous êtes capable de mettre du poids sur votre pied ? Est-ce que vous pouvez faire quatre pas ?", "L'infirmière"], ["S", "Oui, je peux marcher, mais ça fait mal. Je boite un peu.", "Lucas"], ["P", "Sur une échelle de zéro à dix, à combien évaluez-vous votre douleur ?", "L'infirmière"], ["S", "Environ six.", "Lucas"], ["P", "Est-ce que vous avez mal quand vous appuyez sur l'os, juste ici, sur le côté de la cheville ?", "L'infirmière"], ["S", "Attendez. Non, l'os, ça va. C'est surtout autour, sur le côté.", "Lucas"], ["P", "D'après ce que vous me décrivez, il s'agit probablement d'une entorse. Comme vous pouvez marcher et que l'os n'est pas douloureux, vous n'avez pas besoin d'aller à l'urgence ce soir.", "L'infirmière"], ["S", "Qu'est-ce que je dois faire, alors ?", "Lucas"], ["P", "Mettez de la glace vingt minutes, plusieurs fois par jour, jamais directement sur la peau. Gardez votre pied surélevé, et reposez-vous pendant deux ou trois jours. Par contre, si la douleur augmente, si vous ne pouvez plus marcher ou si votre pied devient froid ou engourdi, consultez rapidement.", "L'infirmière"], ["S", "D'accord. Et si ça ne va pas mieux dans quelques jours ?", "Lucas"], ["P", "Si ça ne s'améliore pas d'ici cinq à sept jours, consultez un médecin dans une clinique. N'hésitez pas à nous rappeler, le 811 est ouvert vingt-quatre heures sur vingt-quatre.", "L'infirmière"]], "words": 299, "kind": "story", "scene": "The 811 health line. After slipping on ice, Lucas calls the 811 health line about his ankle.", "F": "Describing symptoms, following instructions", "V": "se blesser (to hurt yourself); la cheville (the ankle); enflé (swollen); mettre du poids (to put weight on); boiter (to limp); une échelle (a scale); une entorse (a sprain); surélevé (raised); engourdi (numb)", "t": [[1.99, 4.7], [4.92, 7.87], [8.09, 13.34], [13.99, 15.96], [16.18, 21.34], [21.98, 23.86], [24.07, 27.79], [28.44, 33.12], [33.77, 35.64], [35.86, 38.5], [39.14, 43.61], [43.82, 47.59], [47.81, 52.32], [52.97, 56.66], [56.88, 59.45], [60.1, 63.41], [63.62, 65.5], [66.14, 70.94], [71.59, 73.51], [74.16, 80.04], [80.69, 82.56], [82.78, 85.42], [85.63, 88.54], [89.18, 93.79], [94.01, 99.94], [100.58, 103.22], [103.87, 109.54], [109.75, 114.67], [114.89, 122.59], [123.24, 125.11], [125.33, 128.16], [128.81, 134.47], [134.69, 139.94]], "R": []}, {"num": 82, "title": "La rencontre de parents", "lines": [["P", "Bonsoir, madame Martin. Merci d'être venue. Je suis contente de vous rencontrer en personne. Hugo est un élève très attachant.", "Mme Roussel"], ["S", "Merci. Je voulais vous rencontrer, parce que je trouve que ses devoirs prennent beaucoup de temps le soir, et il me dit qu'il n'aime pas la lecture.", "Élodie"], ["P", "Oui, j'en voulais justement vous parler. Commençons par les points positifs. En mathématiques, Hugo est excellent. Il a même de l'avance sur le groupe. Et il est très sociable. Il s'est fait beaucoup d'amis.", "Mme Roussel"], ["S", "Ça me fait plaisir à entendre. Au début, j'avais peur qu'il se sente différent, avec son accent français.", "Élodie"], ["P", "Les enfants s'adaptent vite. D'ailleurs, il commence déjà à dire « tantôt » et « c'est le fun » ! Par contre, en lecture, il a un peu de difficulté. Il lit lentement, et il a parfois du mal à comprendre ce qu'il a lu.", "Mme Roussel"], ["S", "C'est ce que je remarquais aussi. Est-ce que c'est inquiétant ?", "Élodie"], ["P", "Pas inquiétant, mais il faut agir maintenant. Je vous propose qu'il rencontre l'orthopédagogue de l'école. Elle travaille avec les élèves en petits groupes, deux fois par semaine.", "Mme Roussel"], ["S", "L'orthopédagogue ? En France, je ne crois pas qu'on ait ce métier exactement. C'est une sorte d'enseignante spécialisée ?", "Élodie"], ["P", "Oui, exactement. Elle aide les enfants qui ont des difficultés d'apprentissage. C'est un service gratuit à l'école, et ça ne veut pas dire qu'Hugo a un problème grave. Beaucoup d'élèves en profitent.", "Mme Roussel"], ["S", "D'accord, ça me rassure. Et à la maison, qu'est-ce que je peux faire ?", "Élodie"], ["P", "Le plus important, c'est le plaisir de lire. Choisissez des livres sur des sujets qu'il aime. Hugo adore les dinosaures et le hockey. Lisez ensemble quinze minutes chaque soir, et posez-lui des questions sur l'histoire.", "Mme Roussel"], ["S", "Et pour les devoirs, il passe parfois une heure dessus. C'est normal ?", "Élodie"], ["P", "Non, c'est trop. En deuxième année, les devoirs ne devraient pas dépasser vingt à trente minutes. S'il bloque, arrêtez, et écrivez-moi un mot dans son agenda. J'ajusterai.", "Mme Roussel"], ["S", "Merci beaucoup. Je me sens beaucoup mieux qu'en arrivant.", "Élodie"], ["P", "C'est le but ! On fait le point de nouveau au deuxième bulletin, en mars.", "Mme Roussel"]], "words": 335, "kind": "story", "scene": "Parent-teacher meeting. Élodie meets her son's teacher to talk about his progress.", "F": "The school system, feedback, asking questions", "V": "un élève (a student (school)); attachant (endearing, lovable); avoir de l'avance (to be ahead); c'est le fun (it's fun (Québec)); avoir du mal à (to have trouble); l'orthopédagogue (a learning support teacher (Québec)); en profiter (to benefit from it); l'agenda (the school planner); le bulletin (the report card)", "t": [[1.99, 4.7], [4.92, 7.1], [7.32, 10.66], [10.87, 13.66], [14.3, 16.18], [16.39, 23.76], [24.41, 27.48], [27.7, 30.46], [30.67, 33.77], [33.98, 36.82], [37.03, 39.22], [39.43, 41.64], [42.29, 44.95], [45.17, 50.18], [50.83, 53.23], [53.45, 58.44], [58.66, 62.69], [62.9, 67.3], [67.94, 70.49], [70.7, 72.89], [73.54, 76.85], [77.06, 81.07], [81.29, 85.73], [86.38, 88.56], [88.78, 92.78], [93.0, 96.22], [96.86, 99.19], [99.41, 103.25], [103.46, 108.79], [109.01, 111.46], [112.1, 114.79], [115.01, 118.01], [118.66, 122.14], [122.35, 125.69], [125.9, 128.9], [129.12, 134.52], [135.17, 138.89], [139.1, 141.0], [141.65, 143.83], [144.05, 148.85], [149.06, 153.65], [153.86, 155.74], [156.38, 158.26], [158.47, 161.21], [161.86, 163.73], [163.94, 167.78]], "R": []}, {"num": 83, "title": "La tempête de neige", "lines": [["P", "Lucas, t'as vu la météo ? Environnement Canada a émis un avertissement de tempête hivernale. On annonce entre trente et quarante centimètres de neige cette nuit, avec des vents forts.", "Stéphane"], ["S", "Quarante centimètres ! C'est ma première vraie tempête. Qu'est-ce que je dois faire ?", "Lucas"], ["P", "D'abord, si tu peux, travaille de la maison demain. Les routes vont être terribles le matin, pis les autobus vont avoir des retards partout.", "Stéphane"], ["S", "Je vais écrire à Marc ce soir. De toute façon, la moitié de l'équipe travaille de la maison quand il neige beaucoup.", "Lucas"], ["P", "Ensuite, ton auto. Elle est stationnée dans la rue ?", "Stéphane"], ["S", "Oui, juste devant la maison.", "Lucas"], ["P", "Après une grosse tempête, la Ville fait une opération de chargement de la neige. Ils installent des panneaux orange temporaires dans la rue. Quand tu vois ces panneaux, il faut déplacer ton auto avant l'heure indiquée. Sinon, elle va être remorquée.", "Stéphane"], ["S", "Remorquée ? Et je la retrouve où ?", "Lucas"], ["P", "Souvent dans une rue voisine, mais pas toujours. Il faut appeler la Ville pour la trouver. Pis il y a une contravention en plus. Crois-moi, ça m'est arrivé une fois, et c'était pas drôle.", "Stéphane"], ["S", "OK, je vais surveiller les panneaux. Il y a une application pour ça, non ?", "Lucas"], ["P", "Oui, l'application de la Ville t'avertit quand ta rue va être déneigée. Installe-la ce soir. Autre chose : as-tu une pelle ?", "Stéphane"], ["S", "Non. Je pensais que la compagnie de déneigement s'occupait de tout.", "Lucas"], ["P", "Elle s'occupe de l'entrée et des escaliers. Mais pour dégager ton auto, t'as besoin d'une pelle pis d'un balai à neige. Je peux te prêter ma vieille pelle.", "Stéphane"], ["S", "Merci, t'es un vrai ami. Et les écoles ?", "Lucas"], ["P", "Si la tempête est vraiment forte, le centre de services scolaire va fermer les écoles. Ils l'annoncent tôt le matin. Les enfants adorent ça : c'est une journée de tempête ! Bon, je vais aller faire mon épicerie avant que tout le monde vide les tablettes.", "Stéphane"]], "words": 307, "kind": "story", "scene": "The snowstorm. A big storm is coming, and Stéphane explains to Lucas what it means for the next day.", "F": "Weather warnings, changes of plan, rules", "V": "émettre un avertissement (to issue a warning); une tempête hivernale (a winter storm); stationné (parked); le chargement de la neige (snow removal (loading)); remorquer (to tow); une contravention (a ticket, a fine); une pelle (a shovel); dégager (to dig out, to clear); prêter (to lend)", "t": [[1.99, 4.61], [4.82, 9.5], [9.72, 15.31], [15.96, 18.12], [18.34, 20.74], [20.95, 23.02], [23.66, 27.58], [27.79, 33.36], [34.01, 36.89], [37.1, 41.9], [42.55, 45.05], [45.26, 47.64], [48.29, 50.93], [51.58, 56.86], [57.07, 60.74], [60.96, 65.71], [65.93, 68.83], [69.48, 71.35], [71.57, 73.49], [74.14, 77.78], [78.0, 80.88], [81.1, 84.17], [84.38, 88.61], [89.26, 92.11], [92.33, 95.21], [95.86, 100.51], [100.73, 103.03], [103.25, 106.13], [106.78, 108.65], [108.86, 112.49], [113.14, 116.28], [116.5, 121.42], [121.63, 124.32], [124.97, 127.61], [127.82, 129.7], [130.34, 135.89], [136.1, 138.38], [138.6, 142.61], [142.82, 147.55]], "R": []}, {"num": 84, "title": "Le chalet", "lines": [["P", "Bon, j'ai trouvé le chalet parfait. Il est au bord d'un lac, dans les Laurentides, à une heure et demie de Montréal. Il y a trois chambres, un foyer, pis un spa dehors.", "Catherine"], ["S", "Un spa dehors, en hiver ? Dans la neige ?", "Camila"], ["P", "Oui ! C'est ça, le plaisir. T'es dans l'eau chaude, il fait moins vingt, pis il neige autour de toi. C'est magique.", "Catherine"], ["S", "Ça a l'air incroyable. Ça coûte combien ?", "Lucas"], ["P", "Six cents dollars pour deux nuits, du vendredi au dimanche. Plus les frais de ménage, soixante-quinze dollars. Si on est six, ça fait environ cent quinze dollars chacun.", "Catherine"], ["S", "C'est raisonnable. Qui d'autre vient ?", "Lucas"], ["P", "François et sa blonde, pis mon cousin Mathieu. Ça fait six avec nous trois.", "Catherine"], ["S", "Parfait. Et pour la nourriture, on fait comment ?", "Camila"], ["P", "Je propose qu'on fasse les courses ensemble vendredi, pis qu'on divise la facture. Chaque soir, une équipe cuisine.", "Catherine"], ["S", "Bonne idée. Samedi soir, Camila et moi, on pourrait faire un repas brésilien. Une feijoada, par exemple.", "Lucas"], ["S", "Ou des pão de queijo pour le déjeuner. C'est plus simple, et tout le monde aime ça.", "Camila"], ["P", "Les deux ! Moi, je m'occupe du souper vendredi. Pour le transport, on a deux autos ?", "Catherine"], ["S", "Moi, j'ai mon auto, avec des pneus d'hiver. Je peux prendre trois personnes. Mais est-ce que le chemin est déneigé ? Je n'ai jamais conduit en montagne en hiver.", "Lucas"], ["P", "Le propriétaire m'a dit que le chemin est entretenu, mais la côte avant le chalet est à pic. S'il neige beaucoup, on laissera les autos en bas, pis on montera à pied.", "Catherine"], ["S", "Et qu'est-ce qu'on peut faire, à part le spa ?", "Camila"], ["P", "Il y a des sentiers de raquette juste derrière le chalet, pis une petite station de ski à vingt minutes. Ou on peut juste lire devant le foyer. Personne n'est obligé de rien.", "Catherine"], ["S", "J'aime ça. Bon, réserve-le, et envoie-nous la facture. Je te fais un virement ce soir.", "Lucas"]], "words": 308, "kind": "story", "scene": "The cottage. Lucas, Camila and Catherine plan a weekend at a rented cottage in the Laurentides.", "F": "Planning, sharing costs, suggestions", "V": "au bord d'un lac (on a lakeshore); le foyer (the fireplace); les frais de ménage (cleaning fee); sa blonde (his girlfriend (Québec)); faire les courses (to do the shopping); entretenu (maintained); une côte à pic (a steep hill); un virement (a money transfer)", "t": [[1.99, 4.92], [5.14, 10.15], [10.37, 14.38], [15.02, 17.02], [17.23, 19.1], [19.75, 21.62], [21.84, 24.41], [24.62, 28.97], [29.18, 31.06], [31.7, 34.1], [34.32, 36.19], [36.84, 40.92], [41.14, 44.81], [45.02, 48.89], [49.54, 51.41], [51.62, 53.5], [54.14, 57.6], [57.82, 60.26], [60.91, 61.73], [61.94, 64.22], [64.87, 70.3], [70.51, 73.46], [74.11, 75.98], [76.2, 81.02], [81.24, 83.93], [84.58, 86.83], [87.05, 89.4], [90.05, 91.92], [92.14, 95.35], [95.57, 98.54], [99.19, 102.79], [103.01, 105.55], [105.77, 108.26], [108.48, 111.74], [112.39, 118.25], [118.46, 123.41], [124.06, 126.29], [126.94, 132.89], [133.1, 136.01], [136.22, 138.74], [139.39, 141.26], [141.48, 145.34], [145.56, 148.25]], "R": []}, {"num": 85, "title": "Le voyage en Gaspésie", "lines": [["P", "Regarde la carte, Lucas. Si on fait le tour complet de la Gaspésie, c'est environ mille huit cents kilomètres aller-retour depuis Montréal.", "Camila"], ["S", "On a dix jours. Ça fait beaucoup de route, mais c'est faisable.", "Lucas"], ["P", "Faisable, oui. Mais moi, je ne veux pas passer mes vacances dans l'auto. Je préférerais choisir deux ou trois endroits et vraiment en profiter.", "Camila"], ["S", "Je comprends. Mais tout le monde dit que le tour de la Gaspésie, c'est une expérience unique. La route longe le fleuve, puis la mer. On s'arrête où on veut.", "Lucas"], ["P", "Justement. Qu'est-ce que tu veux absolument voir ?", "Camila"], ["S", "Le rocher Percé, évidemment. Et le parc national Forillon, au bout de la péninsule. On peut y voir des phoques et parfois des baleines.", "Lucas"], ["P", "Moi aussi, je veux voir Percé. Mais je rêve aussi de faire de la randonnée dans le parc de la Gaspésie, dans les monts Chic-Chocs. On peut voir des caribous, il paraît.", "Camila"], ["S", "Les Chic-Chocs, c'est à l'intérieur des terres. Si on y va, ça ajoute au moins une journée.", "Lucas"], ["P", "Alors, faisons un compromis. On ne fait pas tout le tour. On monte par la côte nord de la péninsule, on passe deux jours dans les Chic-Chocs, deux jours à Forillon, et deux jours à Percé. Ensuite, on revient par le même chemin.", "Camila"], ["S", "Mais on rate la baie des Chaleurs, au sud. Il paraît que c'est magnifique.", "Lucas"], ["P", "Et si on gardait la baie des Chaleurs pour un autre voyage ? Comme ça, on aura une raison de revenir.", "Camila"], ["S", "C'est un bon argument. D'accord pour ton plan. Mais j'ai une condition : à Percé, on fait l'excursion en bateau jusqu'à l'île Bonaventure. Il y a des milliers de fous de Bassan.", "Lucas"], ["P", "Des fous de quoi ?", "Camila"], ["S", "Des fous de Bassan. Ce sont de grands oiseaux blancs. Il y en a une énorme colonie sur l'île.", "Lucas"], ["P", "Ah, d'accord ! Marché conclu. Maintenant, il faut réserver les hébergements. En juillet, tout est vite complet.", "Camila"], ["S", "Je m'occupe des réservations ce soir. On fait un beau couple d'organisateurs, non ?", "Lucas"]], "words": 328, "kind": "story", "scene": "The trip to Gaspésie. Lucas and Camila plan their first road trip together and disagree on the route.", "F": "Expressing preferences, negotiating a compromise", "V": "faire le tour (to go all the way around); longer (to run alongside); un phoque, une baleine (a seal, a whale); il paraît (apparently); à l'intérieur des terres (inland); rater (to miss); un fou de Bassan (a northern gannet); l'hébergement (accommodation)", "t": [[1.99, 4.18], [4.39, 9.86], [10.51, 12.38], [12.6, 15.77], [16.42, 18.29], [18.5, 21.41], [21.62, 25.49], [26.14, 28.01], [28.22, 32.81], [33.02, 36.17], [36.38, 38.47], [39.12, 40.99], [41.21, 43.22], [43.87, 46.51], [46.73, 50.71], [50.93, 54.14], [54.79, 57.05], [57.26, 61.78], [61.99, 64.37], [65.02, 68.28], [68.5, 71.83], [72.48, 74.52], [74.74, 76.61], [76.82, 83.04], [83.26, 85.75], [86.4, 89.66], [89.88, 92.28], [92.93, 96.05], [96.26, 98.83], [99.48, 101.66], [101.88, 103.94], [104.16, 109.8], [110.02, 112.75], [113.4, 115.27], [115.92, 117.82], [118.03, 120.53], [120.74, 123.86], [124.51, 126.38], [126.6, 128.47], [128.69, 131.33], [131.54, 133.73], [134.38, 137.3], [137.52, 140.86]], "R": []}, {"num": 86, "title": "Trouver un médecin de famille", "lines": [["P", "Camila, tu travailles dans le système de santé. Tu pourrais m'expliquer comment on trouve un médecin de famille ? Ça fait trois ans que je suis ici, pis j'en ai toujours pas.", "Lucas"], ["S", "Tu es loin d'être le seul. Beaucoup de Québécois n'ont pas de médecin de famille. Est-ce que tu t'es déjà inscrit au guichet d'accès ?", "Camila"], ["P", "Le guichet d'accès ? Non. C'est quoi ?", "Lucas"], ["S", "C'est le système du gouvernement pour les personnes qui n'ont pas de médecin de famille. Tu t'inscris avec ta carte d'assurance maladie, en ligne ou par téléphone. Ensuite, on te rattache à une clinique ou à un groupe de médecins quand il y a de la place.", "Camila"], ["P", "Et ça prend combien de temps ?", "Lucas"], ["S", "Ça dépend beaucoup de ta région et de ta situation. Les personnes qui ont des problèmes de santé chroniques, ou les femmes enceintes, par exemple, sont prioritaires. Pour quelqu'un de jeune et en bonne santé comme toi, ça peut être long.", "Camila"], ["P", "Alors, en attendant, si je suis malade, je fais quoi ?", "Lucas"], ["S", "Plusieurs choses. D'abord, le 811, comme pour ta cheville l'hiver passé. Ils peuvent t'orienter vers une clinique où il y a de la place. Ensuite, les pharmaciens peuvent maintenant traiter certains problèmes simples, comme une infection urinaire ou une conjonctivite. Pas besoin de voir un médecin.", "Camila"], ["P", "Je ne savais pas ça. Au Brésil, j'allais directement à l'hôpital.", "Lucas"], ["S", "Ici, l'urgence, c'est seulement pour les vraies urgences. Sinon, tu peux attendre huit ou dix heures, et tu prends la place de quelqu'un qui est vraiment malade.", "Camila"], ["P", "Logique. Et une fois que j'ai un médecin, est-ce que je vais toujours voir la même personne ?", "Lucas"], ["S", "Pas toujours. Souvent, tu es inscrit dans un groupe de médecine de famille. Tu peux voir ton médecin, mais aussi une infirmière praticienne ou un autre médecin du groupe. Le but, c'est que quelqu'un connaisse ton dossier.", "Camila"], ["P", "D'accord. Je m'inscris ce soir. Merci, docteure Camila !", "Lucas"], ["S", "Infirmière, pas docteure ! Mais de rien. Et prends rendez-vous pour un examen annuel quand on t'appellera. La prévention, c'est important.", "Camila"]], "words": 331, "kind": "story", "scene": "Finding a family doctor. Lucas asks Camila, now a nurse, how to get a family doctor.", "F": "The health system, explaining steps", "V": "un médecin de famille (a family doctor); un guichet d'accès (an access point, a registry); rattacher à (to assign to, to link to); chronique (chronic); enceinte (pregnant); orienter (to direct, to refer); traiter (to treat); une infirmière praticienne (a nurse practitioner)", "t": [[1.99, 5.4], [5.62, 9.22], [9.43, 13.32], [13.97, 15.84], [16.06, 18.77], [18.98, 21.53], [22.18, 24.05], [24.26, 26.14], [26.35, 28.22], [28.87, 32.64], [32.86, 37.01], [37.22, 41.4], [42.05, 44.18], [44.83, 47.66], [47.88, 53.45], [53.66, 57.17], [57.82, 61.85], [62.5, 64.37], [64.58, 68.45], [68.66, 71.71], [71.93, 78.07], [78.29, 80.21], [80.86, 82.85], [83.06, 86.57], [87.22, 90.7], [90.91, 95.88], [96.53, 98.4], [98.62, 102.91], [103.56, 105.43], [105.65, 108.89], [109.1, 113.57], [113.78, 116.47], [117.12, 118.99], [119.21, 121.46], [121.68, 124.39], [125.04, 127.01], [127.22, 129.1], [129.31, 132.53], [132.74, 134.98]], "R": []}, {"num": 87, "title": "Les accents du Québec", "lines": [["P", "J'ai une question pour vous deux. La semaine passée, j'étais au Saguenay pour le travail, pis j'ai eu de la misère à comprendre les gens. Est-ce que c'est le même français qu'à Montréal ?", "Lucas"], ["S", "Ha ! C'est le même français, mais avec une autre musique. Au Saguenay–Lac-Saint-Jean, les gens parlent vite, pis ils allongent certaines voyelles. Ma grand-mère vient de là-bas. Quand elle est fâchée, même moi, je comprends pas tout.", "François"], ["S", "Et ils ont leurs propres expressions. Mais c'est des gens super accueillants. Si tu leur dis que tu viens du Brésil, ils vont t'inviter à souper.", "Catherine"], ["P", "C'est exactement ce qui m'est arrivé ! Un client m'a invité chez lui, et sa femme m'a servi une tourtière énorme.", "Lucas"], ["S", "La tourtière du Lac, c'est une religion là-bas. Pis attention : ça n'a rien à voir avec la tourtière de Montréal. Ne dis jamais à quelqu'un du Lac que c'est la même chose.", "François"], ["S", "Et si tu vas en Beauce, au sud de Québec, c'est encore un autre accent. Les Beaucerons sont célèbres pour leur façon de parler. Au Québec, tout le monde essaie de les imiter, mais personne n'y arrive vraiment.", "Catherine"], ["P", "Et à Québec, la ville ? Mon voisin Martin vient de là.", "Lucas"], ["S", "À Québec, l'accent est souvent considéré comme plus doux, plus posé. Les gens de Québec trouvent que les Montréalais parlent trop vite et mélangent l'anglais et le français.", "Catherine"], ["S", "C'est vrai qu'à Montréal, on dit des choses comme « Je vais checker ça » ou « C'est cute ». Ça fait fâcher les gens de Québec.", "François"], ["P", "Et aux Îles-de-la-Madeleine ? Camila veut y aller cet été.", "Lucas"], ["S", "Là, c'est fascinant. Une partie de la population est d'origine acadienne. Ils ont un accent très particulier, avec des mots qu'on n'entend nulle part ailleurs. Même nous, on doit tendre l'oreille.", "Catherine"], ["P", "Ça me rassure. Je pensais que mon français était mauvais. En fait, c'est juste que le Québec a plein d'accents différents !", "Lucas"], ["S", "Exactement. Pis t'sais quoi ? Toi aussi, t'as un accent. Un petit accent brésilien, avec des expressions montréalaises. C'est le nouvel accent du Québec.", "François"], ["S", "Ça, c'est vrai ! Tu dis « tiguidou » avec un accent de Belo Horizonte. C'est adorable.", "Catherine"]], "words": 346, "kind": "story", "scene": "Québec accents. At a party, Catherine and François compare regional accents for Lucas.", "F": "Informal French, humour, comparing", "V": "avoir de la misère (to have a hard time (Québec)); allonger (to lengthen); accueillant (welcoming); la tourtière (a meat pie); imiter (to imitate); posé (calm, measured); checker (to check (informal anglicism)); tendre l'oreille (to listen closely)", "t": [[1.99, 4.49], [4.7, 10.61], [10.82, 13.63], [14.28, 16.15], [16.37, 19.92], [20.14, 25.46], [25.68, 28.1], [28.32, 32.11], [32.76, 35.47], [35.69, 38.28], [38.5, 42.94], [43.58, 46.37], [46.58, 51.31], [51.96, 55.54], [55.75, 60.34], [60.55, 64.42], [65.06, 69.84], [70.06, 73.63], [73.85, 78.94], [79.58, 81.91], [82.13, 84.79], [85.44, 90.24], [90.46, 95.98], [96.62, 102.79], [103.01, 105.74], [106.39, 108.6], [108.82, 111.5], [112.15, 114.41], [114.62, 118.3], [118.51, 123.58], [123.79, 126.84], [127.49, 129.38], [129.6, 132.41], [132.62, 136.63], [137.28, 139.15], [139.37, 141.24], [141.46, 144.02], [144.24, 148.85], [149.06, 151.7], [152.35, 154.56], [154.78, 158.78], [159.0, 160.99]], "R": []}, {"num": 88, "title": "Le mal du pays", "lines": [["P", "Lucas, t'es pas mal tranquille ce soir. Ça va ?", "Catherine"], ["S", "Honnêtement, pas vraiment. C'est l'anniversaire de ma mère aujourd'hui. Toute ma famille est réunie chez elle, à Belo Horizonte. Ils m'ont appelé en vidéo, pis après, je me suis senti vraiment seul.", "Lucas"], ["P", "Je comprends. Ça doit être dur d'être aussi loin dans ces moments-là.", "Catherine"], ["S", "Le pire, c'est que je devrais être content. J'ai un bon emploi, des amis, Camila. Mais parfois, j'ai l'impression d'être entre deux pays. Au Brésil, je ne suis plus tout à fait chez moi. Ici, je ne le suis pas encore complètement.", "Lucas"], ["P", "C'est normal de ressentir ça. Une amie qui est arrivée du Liban il y a dix ans m'a dit que les premières années, c'est comme des montagnes russes. Il y a l'excitation du début, pis la fatigue, pis la nostalgie, pis un jour, tu te rends compte que t'es chez toi.", "Catherine"], ["S", "Les montagnes russes, oui. Ma première année, tout était nouveau, tout était une aventure. Maintenant, la nouveauté est partie, et il reste le quotidien. Et l'hiver.", "Lucas"], ["P", "Novembre, c'est le pire mois, en plus. Il fait noir à quatre heures et demie, il fait gris, il n'y a pas encore de neige. Même les Québécois trouvent ça difficile.", "Catherine"], ["S", "Vraiment ? Je pensais que vous étiez habitués.", "Lucas"], ["P", "Habitués, oui. Mais ça veut pas dire qu'on aime ça ! Beaucoup de gens ont une lampe de luminothérapie, pis on essaie d'aller dehors le midi, quand il fait clair.", "Catherine"], ["S", "Je devrais peut-être essayer. Et parler de tout ça avec quelqu'un, aussi.", "Lucas"], ["P", "Tu en parles avec moi, c'est déjà un bon début. Et si ça dure, il y a des organismes qui aident les nouveaux arrivants, avec des groupes de soutien. Tu serais pas le seul à vivre ça, crois-moi.", "Catherine"], ["S", "Merci, Catherine. Ça me fait du bien d'en parler.", "Lucas"], ["P", "Pis j'ai une idée. Pour l'anniversaire de ta mère, on pourrait faire un souper brésilien chez toi, samedi. Tu cuisines, on invite Camila, Stéphane, pis toute la gang. Tu pourrais même appeler ta mère pendant le souper, pour qu'elle nous voie tous.", "Catherine"], ["S", "Elle adorerait ça. Elle s'inquiète toujours que je sois seul ici.", "Lucas"], ["P", "Ben, on va lui montrer que t'es pas seul pantoute.", "Catherine"]], "words": 361, "kind": "story", "scene": "Homesickness. On a grey November evening, Lucas tells Catherine he misses Brazil.", "F": "Talking about feelings, encouragement", "V": "le mal du pays (homesickness); pas mal (pretty, quite (Québec)); ressentir (to feel); les montagnes russes (a roller coaster); se rendre compte (to realize); le quotidien (everyday life); la luminothérapie (light therapy); un groupe de soutien (a support group); la gang (the group of friends (Québec))", "t": [[1.99, 5.28], [5.5, 7.37], [8.02, 10.32], [10.54, 13.34], [13.56, 17.64], [17.86, 22.78], [23.42, 25.3], [25.51, 29.14], [29.78, 33.02], [33.24, 36.79], [37.01, 40.66], [40.87, 44.18], [44.4, 47.57], [48.22, 50.86], [51.07, 57.17], [57.38, 64.92], [65.57, 68.09], [68.3, 72.53], [72.74, 77.16], [77.38, 79.25], [79.9, 83.33], [83.54, 88.78], [88.99, 92.02], [92.66, 94.54], [94.75, 97.42], [98.06, 100.32], [100.54, 103.18], [103.39, 110.04], [110.69, 113.11], [113.33, 116.57], [117.22, 120.72], [120.94, 127.08], [127.3, 130.68], [131.33, 133.66], [133.87, 136.39], [137.04, 138.91], [139.13, 144.72], [144.94, 149.76], [149.98, 154.54], [155.18, 157.1], [157.32, 160.32], [160.97, 164.5]], "R": []}, {"num": 89, "title": "Messages vocaux : le logement", "lines": [["P", "Bonjour, Lucas, c'est Ginette Gagnon. Je vous appelle pour deux choses. D'abord, l'inspection des détecteurs de fumée aura lieu le mardi quatorze, entre neuf heures et onze heures. Je dois entrer chez vous, mais ça prend cinq minutes. Ensuite, je voulais vous dire que j'ai bien reçu votre réponse pour le renouvellement du bail. Je suis d'accord avec votre proposition à quatre pour cent. Je vais vous envoyer l'entente signée par la poste cette semaine. Merci, et bonne journée.", "Mme Gagnon"], ["S", "Oui, bonjour, ici Martin Lacasse, de Réfrigération Lacasse. C'est un message pour monsieur Oliveira, au 2150 Beaubien Est, appartement 3. Votre propriétaire nous a demandé de venir réparer votre réfrigérateur. On a un rendez-vous disponible jeudi après-midi, entre treize heures et seize heures, ou vendredi matin, à partir de huit heures. Rappelez-nous au quatre, cinq, zéro, cinq, cinq, cinq, six, deux, un, sept, pour confirmer. Si on n'a pas de nouvelles d'ici mercredi midi, on va donner la place à un autre client. Merci.", "Le réparateur"], ["S", "Salut, Lucas, c'est Stéphane. Je voulais juste te dire qu'il y a eu une fuite d'eau dans mon plafond de salle de bain hier soir. Je pense que ça vient de chez toi, de ton bain ou de ta toilette. C'est pas grave, c'est juste quelques gouttes, mais peux-tu vérifier sous ton bain quand tu rentres ? Pis peut-être en parler au réparateur, s'il vient pour ton frigo. Bon, à plus tard !", "Stéphane"]], "words": 234, "kind": "story", "scene": "Voicemails: housing. Lucas listens to three voicemails about his apartment.", "F": "Catching key details from fast messages", "V": "les détecteurs de fumée (smoke detectors); le renouvellement (the renewal); une entente (an agreement); le réfrigérateur, le frigo (the fridge); donner la place (to give the slot); une fuite d'eau (a water leak); le plafond (the ceiling); des gouttes (drops)", "t": [[1.99, 5.47], [5.69, 8.21], [8.42, 15.07], [15.29, 18.89], [19.1, 24.79], [25.01, 28.99], [29.21, 33.31], [33.53, 36.02], [36.67, 42.72], [42.94, 49.73], [49.94, 55.37], [55.58, 65.09], [65.3, 74.93], [75.14, 81.58], [81.79, 83.66], [84.31, 87.41], [87.62, 93.38], [93.6, 97.94], [98.16, 103.82], [104.04, 108.34], [108.55, 110.88]], "R": []}, {"num": 90, "title": "Messages vocaux au bureau", "lines": [["P", "Lucas, c'est Élodie. Petit changement pour la réunion avec le client : elle est déplacée de jeudi à vendredi, même heure, à dix heures. Par contre, ce sera en visioconférence, pas dans nos bureaux. Je t'ai envoyé le lien par courriel. Est-ce que tu peux préparer une démo de cinq minutes sur les nouvelles notifications ? Merci, à demain.", "Élodie"], ["S", "Bonjour, monsieur Oliveira, ici Claude Arsenault, de la Clinique des Bois-Francs. On s'est parlé au téléphone la semaine dernière à propos de la sécurité de notre système de rendez-vous. J'ai parlé avec notre direction, et on serait intéressés à une rencontre pour discuter d'un mandat. Je suis disponible lundi ou mardi prochain, en après-midi. Mon numéro direct est le huit, un, neuf, cinq, cinq, cinq, quatre, quatre, trois, zéro. Merci de me rappeler.", "M. Arsenault"], ["S", "Bonjour, Lucas, ici Annie, des ressources humaines. Je vous rappelle que la période d'inscription aux assurances collectives se termine le trente novembre. Si vous voulez ajouter une personne à charge, par exemple un conjoint, vous devez remplir le formulaire en ligne avant cette date. Après, il faudra attendre l'année prochaine. Si vous avez des questions, mon poste est le deux cent quarante-trois.", "Les ressources humaines"], ["S", "Salut, c'est François. Écoute, le serveur de test est tombé en panne ce matin. Les TI travaillent dessus, mais ce sera pas réglé avant demain midi au plus tôt. Faque, si tu veux tester ta démo pour vendredi, utilise mon ordi, j'ai une copie locale. Je suis au bureau toute la journée demain. Bye !", "François"]], "words": 246, "kind": "story", "scene": "Voicemails at work. Back from a day off, Lucas listens to four voicemails at work.", "F": "Who, what, when: details from work messages", "V": "déplacer (to move, to reschedule); en visioconférence (by video call); un mandat (a contract, an assignment); la direction (management); une personne à charge (a dependant); un conjoint (a spouse, a partner); le poste (the extension); les TI (IT (Québec)); un ordi (a computer (informal))", "t": [[1.99, 4.54], [4.75, 11.71], [11.93, 16.61], [16.82, 19.87], [20.09, 24.91], [25.13, 27.46], [28.1, 34.75], [34.97, 41.86], [42.07, 49.18], [49.39, 54.36], [54.58, 63.62], [63.84, 66.22], [66.86, 71.26], [71.47, 76.97], [77.18, 83.78], [84.0, 87.46], [87.67, 91.58], [92.23, 94.68], [94.9, 98.98], [99.19, 104.33], [104.54, 110.93], [111.14, 114.12], [114.34, 116.21]], "R": []}, {"num": 91, "title": "Annonces à la gare et à l'aéroport", "lines": [["P", "Votre attention, s'il vous plaît. Le train numéro vingt-deux à destination de Québec, avec arrêts à Saint-Lambert, Drummondville et Sainte-Foy, est retardé d'environ trente-cinq minutes en raison d'un problème de signalisation. Le nouveau départ est prévu à quinze heures cinquante. Nous nous excusons pour ce retard.", "La gare"], ["P", "Votre attention, s'il vous plaît. Les passagers du train numéro soixante-sept à destination d'Ottawa sont priés de se diriger vers la voie quatorze. L'embarquement commence dans dix minutes. Veuillez avoir votre billet et une pièce d'identité en main. Les passagers ayant besoin d'aide pour l'embarquement peuvent se présenter au comptoir du service à la clientèle.", "La gare"], ["S", "Votre attention, s'il vous plaît. Changement de porte pour le vol huit cent douze à destination de Calgary. Ce vol partira maintenant de la porte cinquante-trois, et non de la porte quarante et un. L'embarquement débutera à dix-sept heures vingt. Nous rappelons aux passagers que la porte ferme quinze minutes avant le départ.", "L'aéroport"], ["S", "Ceci est le dernier appel pour madame Isabelle Tremblay et monsieur Karim Haddad, passagers du vol trois cent quatre à destination de Paris. Vous êtes priés de vous présenter immédiatement à la porte cinquante-sept. Les portes fermeront dans cinq minutes.", "L'aéroport"], ["S", "Votre attention, s'il vous plaît. Pour la sécurité de tous, ne laissez jamais vos bagages sans surveillance. Tout bagage laissé sans surveillance pourra être retiré et détruit par les services de sécurité. Merci de votre collaboration, et bon voyage.", "L'aéroport"]], "words": 233, "kind": "story", "scene": "Station and airport announcements. Five announcements at Montréal's Central Station and at Montréal-Trudeau airport.", "F": "Announcements: delays, platform and gate changes, boarding", "V": "à destination de (bound for); retardé (delayed); la signalisation (signalling); prié de (asked to); la voie (the track, the platform); l'embarquement (boarding); la porte (the gate); le dernier appel (the final call); sans surveillance (unattended)", "t": [[1.99, 4.73], [4.94, 15.7], [15.91, 19.42], [19.63, 22.46], [22.68, 25.42], [25.63, 32.35], [32.57, 35.52], [35.74, 39.46], [39.67, 46.13], [46.78, 49.75], [49.97, 55.27], [55.49, 61.63], [61.85, 65.47], [65.69, 71.14], [71.35, 81.24], [81.46, 86.5], [86.71, 90.02], [90.24, 93.22], [93.43, 99.17], [99.38, 106.22], [106.44, 110.74]], "R": []}, {"num": 92, "title": "Météo et circulation", "lines": [["P", "Il est sept heures quinze, et c'est l'heure de faire le point sur la météo et la circulation. Bonjour, Mathieu !", "L'animatrice"], ["S", "Bonjour, Julie. Alors, ce matin, ça roule difficilement un peu partout, surtout à cause de la pluie verglaçante tombée pendant la nuit. Sur le pont Jacques-Cartier, une voie est fermée en direction de Montréal à cause d'un accrochage. On parle d'au moins vingt-cinq minutes d'attente à partir de Longueuil. Si vous le pouvez, prenez plutôt le pont Samuel-De Champlain, où la circulation est dense, mais fluide.", "Le chroniqueur"], ["S", "Sur l'autoroute Décarie, en direction nord, c'est très lent entre la rue Sherbrooke et l'autoroute Métropolitaine. Dans le tunnel Louis-Hippolyte-La Fontaine, ça va bien dans les deux directions. Et côté transport en commun, bonne nouvelle : le métro fonctionne normalement sur toutes les lignes ce matin.", "Le chroniqueur"], ["P", "Merci, Mathieu. Maintenant, la météo. Ce matin, il fait moins trois degrés à Montréal, mais avec le vent, on a une sensation de moins dix. La pluie verglaçante va se transformer en neige vers dix heures. On attend entre cinq et dix centimètres d'ici la fin de l'après-midi. Le maximum aujourd'hui sera de moins un.", "L'animatrice"], ["P", "Environnement Canada maintient un avertissement de pluie verglaçante pour la Montérégie et les Laurentides jusqu'à midi. Les trottoirs sont extrêmement glissants, alors soyez prudents si vous marchez. Demain, retour du soleil, mais il fera beaucoup plus froid : on annonce moins quatorze au réveil.", "L'animatrice"], ["P", "Et une dernière information : en raison des conditions routières, plusieurs centres de services scolaires de la Rive-Sud ont annoncé que le transport scolaire était annulé ce matin. Les écoles, elles, restent ouvertes. Vérifiez le site de votre école pour plus de détails. On se retrouve dans quinze minutes pour un nouveau point sur la circulation.", "L'animatrice"]], "words": 284, "kind": "story", "scene": "Weather and traffic. A morning radio update with the weather and the traffic in Greater Montréal.", "F": "Fast, dense information: numbers, places, conditions", "V": "faire le point (to give an update); ça roule difficilement (traffic is slow); la pluie verglaçante (freezing rain); un accrochage (a fender bender); fluide (flowing); le transport en commun (public transit); la sensation (the wind chill, the feel); glissant (slippery); au réveil (first thing in the morning)", "t": [[1.99, 7.32], [7.54, 9.84], [10.49, 12.84], [13.06, 20.45], [20.66, 26.76], [26.98, 31.22], [31.44, 38.26], [38.47, 45.6], [45.82, 50.81], [51.02, 57.41], [58.06, 60.31], [60.53, 62.98], [63.19, 69.84], [70.06, 74.35], [74.57, 78.98], [79.2, 82.22], [82.44, 89.26], [89.47, 94.61], [94.82, 101.11], [101.33, 111.31], [111.53, 114.77], [114.98, 118.82], [119.04, 123.53]], "R": []}, {"num": 93, "title": "L'histoire de Montréal", "lines": [["P", "Bonjour à tous. Aujourd'hui, nous allons voir les grandes étapes de l'histoire de Montréal, de sa fondation jusqu'à l'Expo 67. Je vous rappelle que cette matière sera à l'examen de mi-session, alors prenez de bonnes notes.", "Le professeur"], ["P", "Commençons avant l'arrivée des Européens. Bien avant la fondation de la ville, l'île était un lieu de rencontre et d'échange pour plusieurs peuples autochtones. En mille cinq cent trente-cinq, l'explorateur Jacques Cartier remonte le fleuve Saint-Laurent et visite un village iroquoien appelé Hochelaga. Il monte sur la montagne et lui donne le nom de mont Royal. C'est de là que vient le nom de Montréal.", "Le professeur"], ["P", "Pourtant, la ville elle-même n'est fondée que plus d'un siècle plus tard, en mille six cent quarante-deux. Paul de Chomedey de Maisonneuve et Jeanne Mance y établissent une petite colonie religieuse, qu'ils appellent Ville-Marie. Jeanne Mance y fonde d'ailleurs le premier hôpital, l'Hôtel-Dieu. Retenez bien ces deux noms.", "Le professeur"], ["P", "Grâce à sa position sur le fleuve, Ville-Marie devient rapidement un centre important du commerce des fourrures. En mille sept cent soixante, pendant la guerre de Sept Ans, la ville capitule devant l'armée britannique. C'est la fin de la Nouvelle-France à Montréal.", "Le professeur"], ["P", "Au dix-neuvième siècle, Montréal se transforme. L'ouverture du canal de Lachine, en mille huit cent vingt-cinq, permet aux bateaux de contourner les rapides. Des usines s'installent le long du canal, et Montréal devient la métropole industrielle et financière du Canada.", "Le professeur"], ["P", "Enfin, au vingtième siècle, deux événements changent l'image de la ville. En mille neuf cent soixante-six, on inaugure le métro. Et l'année suivante, Montréal accueille l'Exposition universelle, l'Expo 67, qui attire plus de cinquante millions de visites. Montréal se présente alors au monde comme une ville moderne et internationale.", "Le professeur"], ["P", "Pour la semaine prochaine, lisez le chapitre quatre, sur la Révolution tranquille. Et une question pour vous faire réfléchir : pourquoi, selon vous, Montréal a-t-elle perdu son titre de métropole économique du Canada au profit de Toronto ? Nous en discuterons au prochain cours.", "Le professeur"]], "words": 322, "kind": "story", "scene": "The history of Montréal. An excerpt from a first-year university lecture on the history of Montréal.", "F": "Lectures: dates, causes, following the structure", "V": "la fondation (the founding); un peuple autochtone (an Indigenous people); remonter le fleuve (to sail up the river); retenir (to remember); le commerce des fourrures (the fur trade); capituler (to surrender); contourner (to get around); inaugurer (to open officially); au profit de (in favour of)", "t": [[1.99, 4.37], [4.58, 12.67], [12.89, 19.44], [19.66, 23.06], [23.28, 30.98], [31.2, 40.99], [41.21, 45.74], [45.96, 49.32], [49.54, 56.35], [56.57, 64.46], [64.68, 69.43], [69.65, 72.24], [72.46, 80.16], [80.38, 87.48], [87.7, 91.46], [91.68, 96.05], [96.26, 103.97], [104.18, 112.2], [112.42, 118.1], [118.32, 122.57], [122.78, 132.7], [132.91, 138.82], [139.03, 145.27], [145.49, 155.26], [155.47, 158.81]], "R": []}, {"num": 94, "title": "L'hydroélectricité au Québec", "lines": [["P", "Bonjour. La semaine dernière, nous avons parlé des ressources naturelles du Québec. Aujourd'hui, nous allons nous concentrer sur une ressource qui a profondément marqué l'économie et l'identité québécoises : l'hydroélectricité.", "La professeure"], ["P", "D'abord, pourquoi le Québec ? La réponse est géographique. Le territoire compte des milliers de lacs et de rivières, avec des dénivelés importants. C'est l'environnement idéal pour produire de l'électricité grâce à la force de l'eau. Aujourd'hui, la quasi-totalité de l'électricité produite par Hydro-Québec provient de centrales hydroélectriques.", "La professeure"], ["P", "Mais au début du vingtième siècle, l'électricité était entre les mains de compagnies privées. Les prix étaient élevés, et plusieurs régions rurales n'étaient pas desservies. En mille neuf cent quarante-quatre, le gouvernement crée Hydro-Québec, d'abord pour la région de Montréal.", "La professeure"], ["P", "Le grand tournant arrive au début des années soixante, pendant la Révolution tranquille. René Lévesque, alors ministre des Ressources naturelles, défend la nationalisation des autres compagnies d'électricité. Le slogan de l'élection de mille neuf cent soixante-deux, « Maîtres chez nous », résume bien l'esprit de l'époque. En mille neuf cent soixante-trois, Hydro-Québec devient le principal fournisseur d'électricité de la province.", "La professeure"], ["P", "Ensuite viennent les grands chantiers. Dans les années soixante, on construit le complexe Manicouagan, sur la Côte-Nord. Puis, à partir de mille neuf cent soixante et onze, on lance le projet de la Baie-James, l'un des plus grands projets hydroélectriques au monde.", "La professeure"], ["P", "Ce projet a cependant eu des conséquences importantes pour les peuples autochtones du territoire, notamment les Cris et les Inuits. Les travaux ont commencé sans leur consentement. Après une longue bataille juridique, ils ont signé avec les gouvernements, en mille neuf cent soixante-quinze, la Convention de la Baie-James et du Nord québécois. C'est considéré comme le premier grand traité moderne au Canada.", "La professeure"], ["P", "Pour conclure, l'hydroélectricité a donné au Québec une électricité relativement peu coûteuse et peu polluante. Mais elle soulève aussi des questions sur l'environnement et sur les droits des communautés autochtones. Pour mercredi, je vous demande de lire l'article sur la Convention de la Baie-James, et de préparer une question pour la discussion.", "La professeure"]], "words": 330, "kind": "story", "scene": "Hydroelectricity in Québec. An excerpt from a college lecture on the history of hydroelectricity in Québec.", "F": "Explanations, causes and consequences", "V": "marquer (to shape, to leave a mark on); un dénivelé (a drop in elevation); la quasi-totalité (almost all); une centrale (a power plant); desservi (served (by a service)); un tournant (a turning point); un chantier (a construction project); le consentement (consent); soulever des questions (to raise questions)", "t": [[1.99, 3.86], [4.08, 8.74], [8.95, 16.92], [17.14, 19.85], [20.06, 22.66], [22.87, 28.25], [28.46, 33.22], [33.43, 39.84], [40.06, 45.31], [45.53, 50.14], [50.35, 56.59], [56.81, 62.02], [62.23, 69.29], [69.5, 75.94], [76.15, 82.27], [82.49, 85.08], [85.3, 90.53], [90.74, 98.71], [98.93, 106.06], [106.27, 109.39], [109.61, 118.39], [118.61, 122.59], [122.81, 129.36], [129.58, 134.86], [135.07, 142.51]], "R": []}, {"num": 95, "title": "Les consignes d'examen", "lines": [["P", "Avant de terminer, je veux prendre quelques minutes pour vous expliquer comment va se dérouler l'examen final. Écoutez bien, parce que je ne répéterai pas ces consignes le jour de l'examen.", "Le professeur"], ["P", "L'examen aura lieu le lundi quinze décembre, de neuf heures à midi, mais pas dans notre local habituel. Il se tiendra au gymnase, au pavillon B. Arrivez au moins quinze minutes à l'avance. Une fois l'examen commencé, personne ne pourra entrer après neuf heures trente.", "Le professeur"], ["P", "Vous devez apporter votre carte étudiante. Sans carte, vous ne pourrez pas faire l'examen. Les téléphones cellulaires et les montres intelligentes sont interdits. Vous devrez les laisser dans votre sac, à l'avant de la salle, éteints.", "Le professeur"], ["P", "L'examen comprend trois parties. La première partie, ce sont trente questions à choix multiples, qui valent trente pour cent. La deuxième partie, ce sont des questions à réponse courte, pour trente pour cent également. Et la troisième, une analyse de cas, vaut quarante pour cent. Je vous conseille de garder au moins une heure pour l'analyse de cas, parce que c'est la partie qui demande le plus de réflexion.", "Le professeur"], ["P", "Vous avez droit à une feuille de notes, recto verso, écrite à la main. Pas de feuille imprimée. Les calculatrices simples sont permises, mais pas les calculatrices programmables.", "Le professeur"], ["S", "Excusez-moi, monsieur. Est-ce que la matière de la première semaine est incluse ?", "Une étudiante"], ["P", "Bonne question. Oui, l'examen porte sur toute la matière de la session, du premier au dernier cours. Par contre, les chapitres neuf et dix compteront davantage, puisqu'on ne les a pas évalués à l'examen de mi-session.", "Le professeur"], ["P", "Enfin, si vous êtes malade le jour de l'examen, vous devez avertir le secrétariat avant neuf heures, et fournir un billet médical dans les quarante-huit heures. Sinon, vous aurez la note zéro. Les étudiants qui ont des mesures d'accommodement doivent confirmer leur inscription au centre d'aide avant le premier décembre. Des questions ? Non ? Alors, bonne étude à tous.", "Le professeur"]], "words": 315, "kind": "story", "scene": "Exam instructions. A professor explains the rules for the final exam.", "F": "Rules, conditions, what is allowed", "V": "les consignes (the instructions); se dérouler (to take place, to go); se tenir (to be held); éteint (turned off); valoir (to be worth); une analyse de cas (a case study); recto verso (double-sided); porter sur (to cover); des mesures d'accommodement (accommodations)", "t": [[1.99, 9.48], [9.7, 15.19], [15.41, 23.47], [23.69, 27.62], [27.84, 31.68], [31.9, 37.92], [38.14, 41.62], [41.83, 45.65], [45.86, 50.71], [50.93, 55.9], [56.11, 59.04], [59.26, 65.54], [65.76, 72.31], [72.53, 77.35], [77.57, 85.61], [85.82, 91.49], [91.7, 94.03], [94.25, 100.08], [100.73, 102.72], [102.94, 105.74], [106.39, 108.43], [108.65, 115.01], [115.22, 123.72], [123.94, 134.9], [135.12, 138.36], [138.58, 146.52], [146.74, 148.61], [148.82, 150.7], [150.91, 154.18]], "R": []}, {"num": 96, "title": "Une entrepreneure immigrante", "lines": [["P", "Bonjour et bienvenue à notre émission. Aujourd'hui, j'ai le plaisir de recevoir Amina Diallo. Arrivée du Sénégal il y a huit ans, elle a ouvert l'année passée une boulangerie dans le quartier Villeray, qui fait déjà beaucoup parler d'elle. Bonjour, Amina !", "L'animatrice"], ["S", "Bonjour, et merci de m'inviter.", "Amina Diallo"], ["P", "Commençons par le début. Qu'est-ce qui vous a amenée à Montréal ?", "L'animatrice"], ["S", "Je suis venue pour étudier. J'ai fait une maîtrise en gestion à l'Université de Montréal. Pendant mes études, pour payer mon loyer, je travaillais la nuit dans une boulangerie industrielle. C'est là que j'ai découvert que j'adorais faire du pain.", "Amina Diallo"], ["P", "Et de là à ouvrir votre propre boulangerie, il y a tout un pas. Qu'est-ce qui a été le plus difficile ?", "L'animatrice"], ["S", "Sans hésiter, le financement. Les banques me demandaient un historique de crédit et des garanties que je n'avais pas. On m'a refusé un prêt trois fois. Finalement, c'est un organisme qui aide les entrepreneurs immigrants qui m'a accompagnée. Ils m'ont aidée à refaire mon plan d'affaires, et j'ai obtenu un microcrédit pour commencer.", "Amina Diallo"], ["P", "Votre boulangerie mélange les traditions françaises, sénégalaises et québécoises. Comment est-ce que les clients ont réagi ?", "L'animatrice"], ["S", "Au début, j'avais peur que ce soit trop différent. Mais les gens du quartier sont très curieux. Mon pain au bissap, qui est fait avec des fleurs d'hibiscus, est devenu notre produit le plus populaire. Et pour l'automne, je fais un croissant à l'érable. Les clients d'origine sénégalaise retrouvent des saveurs de chez eux, et les Québécois découvrent quelque chose de nouveau.", "Amina Diallo"], ["P", "C'est un beau symbole d'intégration. Selon vous, qu'est-ce qui manque aux nouveaux arrivants qui veulent se lancer en affaires ?", "L'animatrice"], ["S", "Surtout un réseau. Quand on arrive, on ne connaît personne. On ne sait pas à qui demander des conseils. Je pense que le mentorat est essentiel. D'ailleurs, aujourd'hui, j'accompagne moi-même deux jeunes entrepreneures.", "Amina Diallo"], ["P", "Et un conseil pour nos auditeurs qui rêvent d'ouvrir leur commerce ?", "L'animatrice"], ["S", "Ne restez pas seuls. Demandez de l'aide, même si ça vous semble difficile. Et soyez patients. Moi, j'ai mis cinq ans à réaliser mon rêve, mais aujourd'hui, je ne regrette rien.", "Amina Diallo"], ["P", "Merci beaucoup, Amina Diallo. Et pour nos auditeurs, la boulangerie est ouverte du mardi au dimanche, dès sept heures.", "L'animatrice"]], "words": 362, "kind": "story", "scene": "An immigrant entrepreneur. A radio host interviews Amina Diallo, who opened a bakery after arriving from Senegal.", "F": "Interviews: questions, opinions, a personal story", "V": "faire parler de soi (to get people talking); une maîtrise (a master's degree); tout un pas (quite a leap); le financement (financing); une garantie (collateral); accompagner (to support, to coach); un plan d'affaires (a business plan); se lancer en affaires (to start a business); les auditeurs (listeners)", "t": [[1.99, 4.87], [5.09, 9.1], [9.31, 17.26], [17.47, 19.82], [20.47, 23.35], [24.0, 26.26], [26.47, 29.18], [29.83, 32.28], [32.5, 36.5], [36.72, 42.34], [42.55, 45.74], [46.39, 50.62], [50.83, 53.59], [54.24, 57.07], [57.29, 61.78], [61.99, 64.61], [64.82, 70.06], [70.27, 75.41], [76.06, 81.46], [81.67, 84.46], [85.1, 88.51], [88.73, 91.61], [91.82, 97.82], [98.04, 101.57], [101.78, 108.19], [108.84, 111.67], [111.89, 116.71], [117.36, 119.5], [119.71, 122.81], [123.02, 126.07], [126.29, 129.46], [129.67, 134.14], [134.78, 139.01], [139.66, 141.91], [142.13, 145.94], [146.16, 148.13], [148.34, 153.29], [153.94, 156.89], [157.1, 162.84]], "R": []}, {"num": 97, "title": "Mon premier hiver", "lines": [["P", "Bienvenue à « Nouveau départ », le balado qui donne la parole aux nouveaux arrivants. Aujourd'hui, mon invité s'appelle Lucas. Il est arrivé de Belo Horizonte, au Brésil, il y a quatre ans. Lucas, on se tutoie ?", "L'animateur"], ["S", "Bien sûr. Salut, et merci de m'avoir invité.", "Lucas"], ["P", "Le thème de l'épisode, c'est le premier hiver. Alors, raconte-nous. Quand t'es arrivé, est-ce que t'avais peur du froid ?", "L'animateur"], ["S", "Je pensais que j'étais prêt. J'avais lu des articles, j'avais regardé des vidéos. Mais lire « moins vingt », et sentir moins vingt sur ton visage, c'est deux choses complètement différentes. La première fois, j'ai eu l'impression que l'air me brûlait les poumons.", "Lucas"], ["P", "C'est quoi, ton pire souvenir de ce premier hiver ?", "L'animateur"], ["S", "Sans aucun doute ma première tempête. Je ne savais pas qu'il fallait déplacer mon auto quand on voit les panneaux orange. Le lendemain matin, plus d'auto ! J'étais sûr qu'on me l'avait volée. J'ai appelé la police. Le policier a ri, et il m'a expliqué qu'elle avait été remorquée dans la rue d'à côté.", "Lucas"], ["P", "Ha ! C'est un classique. Je pense que tous les Montréalais ont vécu ça au moins une fois.", "L'animateur"], ["S", "Oui, mais quand t'es nouveau, tu te sens vraiment perdu. Heureusement, mon voisin m'a tout expliqué ensuite. C'est ça, la leçon de mon premier hiver : demander de l'aide. Les gens ici sont très généreux, mais ils ne vont pas toujours venir vers toi. Il faut faire le premier pas.", "Lucas"], ["P", "Et ton meilleur souvenir ?", "L'animateur"], ["S", "Mon premier match de hockey, au bar, avec mes collègues. Je ne connaissais pas les règles, mais l'ambiance était incroyable. Et aussi, la première fois que j'ai fait du patin, sur la patinoire du parc. Je suis tombé au moins quinze fois, mais j'ai ri tout le long.", "Lucas"], ["P", "Quels conseils tu donnerais à quelqu'un qui arrive cet automne ?", "L'animateur"], ["S", "Trois conseils. Premièrement, achète de bonnes bottes et des mitaines, pas des gants. Ne fais pas d'économies là-dessus. Deuxièmement, sors dehors, même quand il fait froid. Fais du patin, de la raquette, n'importe quoi. Si tu restes enfermé tout l'hiver, tu vas déprimer. Et troisièmement, novembre est difficile pour tout le monde. Ce n'est pas toi le problème. Ça va passer.", "Lucas"], ["P", "Des conseils précieux. Et aujourd'hui, après quatre hivers, tu aimes l'hiver ?", "L'animateur"], ["S", "« Aimer », c'est un grand mot. Disons que je le respecte. Et j'avoue que la première neige, chaque année, me rend encore heureux comme un enfant.", "Lucas"]], "words": 390, "kind": "story", "scene": "My first winter. Lucas is the guest on a podcast for newcomers and talks about his first winter in Montréal.", "F": "Personal stories, past tenses, humour", "V": "un balado (a podcast (Québec)); donner la parole (to give a voice to); les poumons (the lungs); le lendemain (the next day); faire le premier pas (to make the first move); tout le long (the whole time); faire des économies (to save money, to skimp); enfermé (shut in); déprimer (to feel depressed)", "t": [[1.99, 7.22], [7.44, 10.68], [10.9, 15.46], [15.67, 18.1], [18.74, 20.62], [20.83, 23.95], [24.6, 28.39], [28.61, 30.94], [31.15, 34.56], [35.21, 37.46], [37.68, 41.42], [41.64, 48.05], [48.26, 52.34], [52.99, 56.69], [57.34, 60.17], [60.38, 65.04], [65.26, 68.09], [68.3, 70.82], [71.04, 73.27], [73.49, 78.6], [79.25, 81.12], [81.34, 83.38], [83.59, 87.65], [88.3, 92.18], [92.4, 95.98], [96.19, 100.54], [100.75, 105.46], [105.67, 107.98], [108.62, 110.93], [111.58, 115.56], [115.78, 119.9], [120.12, 124.97], [125.18, 129.14], [129.79, 133.73], [134.38, 136.25], [136.46, 140.78], [141.0, 143.42], [143.64, 147.58], [147.79, 151.34], [151.56, 155.28], [155.5, 159.38], [159.6, 161.83], [162.05, 163.92], [164.57, 166.73], [166.94, 170.95], [171.6, 174.02], [174.24, 176.59], [176.81, 181.9]], "R": []}, {"num": 98, "title": "Le discours d'accueil", "lines": [["P", "Bonjour à toutes et à tous, et bienvenue chez Solutions Laurentiennes. Je m'appelle Chantal Bergeron, et je suis la directrice générale de l'entreprise. C'est toujours un grand plaisir pour moi d'accueillir de nouveaux employés. Vous êtes quatorze ce matin, et vous venez de six pays différents. Je pense que ça représente bien qui nous sommes.", "La directrice"], ["P", "Notre entreprise a été fondée il y a vingt-deux ans, dans un petit bureau du Vieux-Montréal. Nous étions trois. Aujourd'hui, nous sommes plus de deux cents employés, à Montréal, à Québec et à Sherbrooke. Mais malgré notre croissance, nous avons gardé les mêmes valeurs : le respect, la collaboration et la curiosité.", "La directrice"], ["P", "Le respect, c'est d'écouter les autres, même quand on n'est pas d'accord. La collaboration, c'est de comprendre qu'ici, personne ne réussit seul. Et la curiosité, c'est de ne jamais avoir peur de poser une question. Je le dis à chaque groupe : il n'y a pas de question bête. Les seules erreurs graves, ce sont celles qu'on cache.", "La directrice"], ["P", "Quelques informations pratiques maintenant. Cette semaine, vous allez suivre un programme d'intégration de trois jours. Vous allez rencontrer votre équipe, recevoir votre matériel informatique et suivre une formation sur la sécurité des données. Chacun d'entre vous aura aussi un parrain ou une marraine, une personne d'expérience qui va vous accompagner pendant vos trois premiers mois.", "La directrice"], ["P", "Je sais que plusieurs d'entre vous arrivent d'un autre pays, et que vous apprenez encore le français. Sachez que l'entreprise offre des cours de français gratuits, sur les heures de travail, deux fois par semaine. Je vous encourage fortement à en profiter. Le français est notre langue de travail, et c'est aussi la clé pour vous sentir chez vous au Québec.", "La directrice"], ["P", "Enfin, ma porte est toujours ouverte. Si vous avez une idée pour améliorer nos façons de faire, ou si quelque chose ne va pas, n'hésitez pas à venir me voir. Certaines de nos meilleures idées sont venues de nouveaux employés, justement parce qu'ils voyaient les choses avec un regard neuf.", "La directrice"], ["P", "Encore une fois, bienvenue dans l'équipe. Je vous invite maintenant à prendre un café et une viennoiserie au fond de la salle, et à faire connaissance avec vos collègues. Merci, et bonne première journée !", "La directrice"]], "words": 363, "kind": "story", "scene": "The welcome speech. The director of a company welcomes a group of new employees.", "F": "Formal speech, the company's values, practical information", "V": "la directrice générale (the CEO, the general manager); la croissance (growth); les valeurs (values); une question bête (a stupid question); un parrain, une marraine (a mentor, a buddy); sachez que (please know that); un regard neuf (a fresh perspective); une viennoiserie (a pastry); faire connaissance (to get to know)", "t": [[1.99, 6.6], [6.82, 12.34], [12.55, 17.09], [17.3, 21.53], [21.74, 24.91], [25.13, 30.86], [31.08, 33.05], [33.26, 39.1], [39.31, 46.75], [46.97, 51.67], [51.89, 57.02], [57.24, 61.9], [62.11, 65.98], [66.19, 70.01], [70.22, 73.22], [73.44, 78.29], [78.5, 86.11], [86.33, 93.86], [94.08, 99.82], [100.03, 106.73], [106.94, 110.14], [110.35, 116.02], [116.23, 119.28], [119.5, 126.74], [126.96, 133.97], [134.18, 137.38], [137.59, 144.48], [144.7, 147.62]], "R": []}, {"num": 99, "title": "Le 1er juillet", "lines": [["P", "Bonsoir. Comme chaque année, des dizaines de milliers de ménages québécois ont déménagé aujourd'hui, à l'occasion du premier juillet. À Montréal, les camions de déménagement ont envahi les rues dès l'aube, sous une chaleur accablante. Notre journaliste, Simon Paquette, a passé la journée sur le Plateau-Mont-Royal.", "La présentatrice"], ["S", "Merci, Isabelle. Ici, sur la rue Saint-Hubert, le spectacle est le même depuis six heures ce matin : des matelas sur les trottoirs, des sofas qui descendent par les balcons, et des déménageurs épuisés. Avec un indice humidex de trente-huit, la journée a été particulièrement difficile.", "Le journaliste"], ["S", "Cette tradition remonte en partie à une loi qui fixait la fin des baux au premier mai. Elle a été changée au premier juillet dans les années soixante-dix, pour éviter que les familles déménagent en pleine année scolaire. Aujourd'hui, la majorité des baux au Québec se terminent encore le trente juin.", "Le journaliste"], ["S", "Mais derrière l'image pittoresque, il y a une réalité plus difficile. Selon les organismes de défense des locataires, plusieurs centaines de ménages se retrouvent ce soir sans logement dans la région de Montréal. La hausse des loyers et le faible taux d'inoccupation rendent la recherche de logement de plus en plus difficile, surtout pour les familles nombreuses et les nouveaux arrivants.", "Le journaliste"], ["S", "La Ville rappelle que les ménages sans logement peuvent composer le 311 pour être dirigés vers un service d'aide, qui offre de l'hébergement temporaire et de l'entreposage pour les meubles. Elle rappelle aussi que la collecte des encombrants est augmentée cette semaine, pour ramasser les meubles abandonnés sur les trottoirs.", "Le journaliste"], ["S", "Enfin, la Société de l'assurance automobile rappelle aux personnes qui ont loué un camion de bien attacher leur chargement. Plusieurs objets sont tombés sur les routes aujourd'hui, et deux accidents mineurs ont été signalés. Isabelle ?", "Le journaliste"], ["P", "Merci, Simon. Et un dernier conseil, de la part des services d'urgence : avec cette chaleur, pensez à boire beaucoup d'eau, que vous soyez déménageur, bénévole ou simplement en train de magasiner des meubles sur le trottoir !", "La présentatrice"]], "words": 324, "kind": "story", "scene": "July 1. A television news report on moving day in Montréal.", "F": "News style: facts, numbers, quotations", "V": "un ménage (a household /* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'àâäéèêëîïôöùûüÿçœæãõáíóú½%]/g, "").replace(/^'+|'+$/g, "");

  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }

  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();

  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });

}
function showResult(s) {

  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");

    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="copy">Copy my results</button></div>

function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Story: ${s.num}. ${s.title} (Tier ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,

document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
<script data-goatcounter="https://executiveclass.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
