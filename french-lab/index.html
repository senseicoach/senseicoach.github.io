<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Free Québécois French listening practice: 100 recorded conversations set in Montréal, from first words to NCLC 7, with transcription and sentence replay.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Listening Lab | Executive Class</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}

le": "Un nouveau voisin", "lines": [["P", "Allô ! Tu es le nouveau voisin du troisième ?", "Stéphane"], ["S", "Oui ! Bonjour, je m'appelle Lucas. J'ai déménagé le premier juillet.", "Lucas"], ["P", "Moi, c'est Stéphane. J'habite au deuxième depuis cinq ans. Le déménagement s'est bien passé ?", "Stéphane"], ["S", "Oui, mais il faisait très chaud. Trente-deux degrés !", "Lucas"], ["P", "Classique ! Tu aimes le quartier ?", "Stéphane"], ["S", "Oui, beaucoup. Il y a des cafés, un parc et le métro est tout près.", "Lucas"], ["P", "Et le marché Jean-Talon n'est pas loin. Tu aimes cuisiner ?", "Stéphane"], ["S", "Oui, j'adore cuisiner ! Surtout des plats brésiliens.", "Lucas"], ["P", "Ah, j'aimerais goûter ça un jour ! Moi, je fais un bon barbecue.", "Stéphane"], ["S", "Super ! Qu'est-ce que tu fais dans la vie ?", "Lucas"], ["P", "Je suis infirmier à l'hôpital, pas loin d'ici. Et toi ?", "Stéphane"], ["S", "Je suis développeur informatique.", "Lucas"], ["P", "Cool. Bon, si tu as besoin d'aide pour tes boîtes, cogne à ma porte !", "Stéphane"], ["S", "Merci, Stéphane. C'est gentil !", "Lucas"]], "words": 129, "kind": "story", "scene": "A new neighbour. In July, Lucas meets his downstairs neighbour on the balcony of his new apartment.", "F": "Questions about yourself, likes", "V": "au troisième, au deuxième (on the third floor, on the second floor); le déménagement (the move); le quartier (the neighbourhood); goûter (to taste); Qu'est-ce que tu fais dans la vie ? (What do you do for a living?); un infirmier (a (male) nurse); cogner (to knock (Québec))", "t": [[1.99, 3.86], [4.08, 7.97], [8.62, 10.49], [10.7, 14.4], [14.62, 18.07], [18.72, 21.84], [22.06, 25.8], [26.02, 29.62], [30.26, 33.72], [33.94, 36.58], [37.22, 39.53], [39.74, 42.43], [43.08, 45.67], [45.89, 51.02], [51.67, 55.34], [55.56, 58.25], [58.9, 62.23], [62.45, 65.54], [66.19, 70.22], [70.44, 74.21], [74.86, 77.04], [77.26, 80.16], [80.81, 85.73], [85.94, 87.96], [88.61, 92.02], [92.66, 94.61], [94.82, 100.82], [101.47, 104.69], [104.9, 107.21]], "R": []}, {"num": 28, "title": "Les patins", "lines": [["P", "Bonjour. Je voudrais louer des patins, s'il vous plaît.", "Lucas"], ["S", "Bonjour ! Quelle pointure ?", "Le préposé"], ["P", "Je chausse du dix.", "Lucas"], ["S", "Voilà, des patins de pointure dix. Vous voulez aussi un casque ?", "Le préposé"], ["P", "Un casque ? C'est obligatoire ?", "Lucas"], ["S", "Ce n'est pas obligatoire pour les adultes, mais c'est recommandé. C'est votre première fois ?", "Le préposé"], ["P", "Oui, c'est ma première fois sur la glace.", "Lucas"], ["S", "Alors, prenez le casque ! Il est gratuit avec les patins.", "Le préposé"], ["P", "D'accord. C'est combien pour les patins ?", "Lucas"], ["S", "Dix dollars pour deux heures. Laissez vos souliers ici, dans le casier.", "Le préposé"], ["P", "Merci. Vous avez un conseil pour un débutant ?", "Lucas"], ["S", "Pliez les genoux, regardez devant vous et allez lentement. Et si vous tombez, riez !", "Le préposé"], ["P", "D'accord. Je vais sûrement rire beaucoup !", "Lucas"]], "words": 109, "kind": "story", "scene": "Skates. Lucas rents skates at an outdoor rink in a park.", "F": "Sports words, sizes, rules", "V": "louer (to rent); des patins (skates); la pointure (shoe size); un casque (a helmet); obligatoire (required); le casier (the locker); un débutant (a beginner); plier les genoux (to bend your knees); tomber (to fall)", "t": [[1.99, 4.18], [4.39, 8.66], [9.31, 11.76], [11.98, 14.5], [15.14, 17.98], [18.62, 23.45], [23.66, 26.83], [27.48, 29.52], [29.74, 32.38], [33.02, 39.22], [39.43, 42.36], [43.01, 46.99], [47.64, 51.36], [51.58, 55.13], [55.78, 57.89], [58.1, 61.01], [61.66, 65.33], [65.54, 70.39], [71.04, 73.1], [73.32, 76.75], [77.4, 83.26], [83.47, 86.98], [87.62, 89.74], [89.95, 93.17]], "R": []}, {"num": 29, "title": "Le cours de francisation", "lines": [["P", "Bonsoir, tout le monde, et bienvenue au cours de français ! Je m'appelle Isabelle Bélanger. Je suis votre professeure.", "Mme Bélanger"], ["S", "Bonsoir, madame.", "Lucas"], ["P", "Le cours a lieu le mardi et le jeudi, de dix-huit heures à vingt et une heures. Vous avez tous un cahier ?", "Mme Bélanger"], ["S", "Excusez-moi, je n'ai pas de cahier.", "Lucas"], ["P", "Ce n'est pas grave. Voici un cahier pour vous. Comment vous appelez-vous ?", "Mme Bélanger"], ["S", "Je m'appelle Lucas. Je viens du Brésil.", "Lucas"], ["P", "Bienvenue, Lucas. Alors, ce soir, nous allons nous présenter. Ensuite, nous allons écouter un dialogue.", "Mme Bélanger"], ["S", "Est-ce qu'on peut poser des questions en anglais ?", "Lucas"], ["P", "Essayez en français d'abord ! Si vous ne comprenez pas, dites simplement : Pouvez-vous répéter, s'il vous plaît ?", "Mme Bélanger"], ["S", "Pouvez-vous répéter, s'il vous plaît ?", "Lucas"], ["P", "Parfait, Lucas ! Vous voyez, c'est facile. Pour jeudi, faites les exercices de la page dix.", "Mme Bélanger"], ["S", "Les exercices de la page dix. D'accord.", "Lucas"]], "words": 133, "kind": "story", "scene": "French class. Lucas's first evening at a French class for newcomers.", "F": "Classroom words, instructions", "V": "le cours a lieu (the class takes place); un cahier (a notebook, a workbook); Ce n'est pas grave. (It's no problem.); se présenter (to introduce yourself); poser une question (to ask a question); Pouvez-vous répéter ? (Can you repeat that?); les exercices (the exercises)", "t": [[1.99, 7.49], [7.7, 11.21], [11.42, 14.76], [15.41, 18.53], [19.18, 25.56], [25.78, 28.78], [29.42, 33.22], [33.86, 36.53], [36.74, 39.82], [40.03, 42.74], [43.39, 45.96], [46.18, 49.08], [49.73, 52.99], [53.21, 58.18], [58.39, 62.78], [63.43, 67.22], [67.87, 71.28], [71.5, 78.43], [79.08, 82.66], [83.3, 86.3], [86.52, 89.98], [90.19, 95.28], [95.93, 99.46], [99.67, 101.78]], "R": []}, {"num": 30, "title": "Une invitation", "lines": [["P", "Salut, Lucas ! C'est Catherine. Tu vas bien ?", "Catherine"], ["S", "Salut, Catherine ! Oui, très bien. Et toi ?", "Lucas"], ["P", "Super ! Écoute, j'ai un nouvel appartement. Je fais une pendaison de crémaillère samedi soir. Tu veux venir ?", "Catherine"], ["S", "Une pendaison de quoi ?", "Lucas"], ["P", "Une pendaison de crémaillère. C'est une fête pour un nouvel appartement.", "Catherine"], ["S", "Ah, je comprends ! Samedi soir, oui, je suis libre. À quelle heure ?", "Lucas"], ["P", "À partir de dix-neuf heures. L'adresse, c'est le 4820, rue de la Roche.", "Catherine"], ["S", "Parfait. Qu'est-ce que je peux apporter ?", "Lucas"], ["P", "Rien de spécial. Apporte ce que tu veux boire. Ici, on dit « apportez votre vin ».", "Catherine"], ["S", "D'accord. Est-ce que je peux venir avec mon voisin, Stéphane ?", "Lucas"], ["P", "Bien sûr ! Plus on est de fous, plus on rit.", "Catherine"], ["S", "Merci pour l'invitation. Mais dimanche, je ne peux pas aller au brunch avec toi. Je travaille.", "Lucas"], ["P", "Pas de problème. À samedi, alors !", "Catherine"]], "words": 134, "kind": "story", "scene": "An invitation. Catherine calls Lucas to invite him to her housewarming party.", "F": "Inviting, accepting and declining", "V": "une pendaison de crémaillère (a housewarming party); libre (free, available); à partir de (from (a time)); apporter (to bring); Plus on est de fous, plus on rit. (The more, the merrier.); je ne peux pas (I can't)", "t": [[1.99, 4.94], [5.16, 7.63], [7.85, 9.96], [10.61, 13.7], [13.92, 16.63], [16.85, 18.72], [19.37, 21.72], [21.94, 25.94], [26.16, 30.89], [31.1, 33.62], [34.27, 36.96], [37.61, 41.06], [41.28, 45.26], [45.91, 48.6], [48.82, 53.16], [53.38, 55.63], [56.28, 59.71], [59.93, 65.66], [66.31, 68.23], [68.45, 71.3], [71.95, 74.74], [74.95, 78.36], [78.58, 82.8], [83.45, 85.56], [85.78, 90.17], [90.82, 93.14], [93.36, 97.01], [97.66, 100.73], [100.94, 106.06], [106.27, 108.55], [109.2, 111.77], [111.98, 115.15]], "R": []}]}, {"part": 2, "title": "Bridge", "desc": "NCLC 4–5 (B1). Longer conversations about work, school, a car and the first winter.", "scripts": [{"num": 31, "title": "La visite", "lines": [["P", "Bonjour, Lucas ! Entrez, entrez. Vous avez trouvé facilement ?", "Mme Gagnon"], ["S", "Oui, j'ai pris le métro jusqu'à Beaubien, puis j'ai marché cinq minutes. C'est vraiment proche.", "Lucas"], ["P", "C'est pratique, hein ? Bon, je vais vous faire visiter. Ici, c'est le salon. Il y a beaucoup de lumière le matin parce que les fenêtres donnent sur l'est.", "Mme Gagnon"], ["S", "C'est grand ! Et la cuisine ?", "Lucas"], ["P", "Par ici. Le frigo et la cuisinière sont fournis. Je les ai changés l'année passée, alors ils sont presque neufs.", "Mme Gagnon"], ["S", "Super. Et les chambres ?", "Lucas"], ["P", "La grande chambre est au fond, à côté de la salle de bain. La petite chambre est ici. Beaucoup de locataires l'utilisent comme bureau.", "Mme Gagnon"], ["S", "Ça tombe bien, je travaille souvent de la maison. Est-ce qu'il y a un balcon ?", "Lucas"], ["P", "Oui, il y a un balcon en arrière. L'été, c'est très agréable.", "Mme Gagnon"], ["S", "Et l'hiver, qui s'occupe du déneigement ?", "Lucas"], ["P", "C'est une compagnie qui déneige l'entrée et les escaliers. Vous n'avez rien à faire.", "Mme Gagnon"], ["S", "Parfait. L'appartement est disponible quand ?", "Lucas"], ["P", "Le premier juillet. Le bail est de douze mois, du premier juillet au trente juin.", "Mme Gagnon"], ["S", "D'accord. Est-ce que les animaux sont acceptés ? J'ai un petit chat.", "Lucas"], ["P", "Un chat, ça va. Les chiens, non, à cause du bruit pour les voisins d'en bas.", "Mme Gagnon"], ["S", "Je comprends. Qu'est-ce que je dois faire si je suis intéressé ?", "Lucas"], ["P", "Vous remplissez un formulaire de location, et je vais vérifier vos références. Je vais vous appeler d'ici mercredi.", "Mme Gagnon"], ["S", "Merci beaucoup, madame Gagnon. Je vais remplir le formulaire ce soir.", "Lucas"], ["P", "Parfait. Bonne fin de semaine, Lucas !", "Mme Gagnon"]], "words": 244, "kind": "story", "scene": "The visit. On Saturday, Mme Gagnon shows Lucas the apartment on rue Beaubien.", "F": "Describing a home, the lease basics", "V": "faire visiter (to show around); donner sur (to face, to look onto); fournis (supplied); un locataire (a tenant); Ça tombe bien. (That works out well.); le déneigement (snow removal); le bail (the lease); d'ici mercredi (by Wednesday)", "t": [[1.99, 4.66], [4.87, 7.42], [7.63, 10.3], [10.94, 16.15], [16.37, 18.58], [19.22, 21.5], [21.72, 24.79], [25.01, 27.55], [27.77, 32.71], [33.36, 35.23], [35.45, 37.34], [37.99, 39.86], [40.08, 43.49], [43.7, 48.43], [49.08, 50.95], [51.17, 53.04], [53.69, 58.03], [58.25, 60.91], [61.13, 64.73], [65.38, 69.12], [69.34, 71.71], [72.36, 75.82], [76.03, 79.2], [79.85, 83.11], [83.76, 88.1], [88.32, 90.96], [91.61, 93.48], [93.7, 96.48], [97.13, 99.41], [99.62, 104.06], [104.71, 106.58], [106.8, 109.54], [109.75, 111.96], [112.61, 114.98], [115.2, 119.93], [120.58, 122.45], [122.66, 125.88], [126.53, 132.07], [132.29, 135.38], [136.03, 139.22], [139.44, 142.75], [143.4, 145.27], [145.49, 148.58]], "R": []}, {"num": 32, "title": "Le jour du déménagement", "lines": [["P", "Bonjour, Lucas ! Bonne fête du Canada, et bon déménagement ! Voici vos clés : la grande, c'est pour la porte d'entrée, et la petite, c'est pour la boîte aux lettres.", "Mme Gagnon"], ["S", "Merci, madame Gagnon. Les déménageurs viennent d'arriver avec le camion.", "Lucas"], ["P", "Parfait. L'ancien locataire est parti hier soir. J'ai nettoyé l'appartement ce matin, alors tout est prêt.", "Mme Gagnon"], ["S", "Bonjour ! Je m'appelle Kevin. On commence par quoi ?", "Kevin"], ["S", "Bonjour, Kevin. Commencez par le lit et le sofa, s'il vous plaît. Le lit va dans la grande chambre, au fond à droite.", "Lucas"], ["S", "D'accord. Et les boîtes ?", "Kevin"], ["S", "Les boîtes avec un K vont dans la cuisine. Les boîtes avec un B vont dans le bureau. J'ai écrit les lettres hier soir.", "Lucas"], ["S", "Bonne idée ! Ça va aller plus vite. Attention, l'escalier est étroit. On va passer le sofa par le balcon.", "Kevin"], ["S", "Par le balcon ? Vous êtes sûr ?", "Lucas"], ["S", "Oui, on fait ça tout le temps. Le premier juillet, on a déjà fait trois déménagements avant midi !", "Kevin"], ["P", "Lucas, n'oubliez pas : les vidanges sont ramassées le jeudi, et le recyclage, le mardi. Mettez les bacs sur le trottoir la veille au soir.", "Mme Gagnon"], ["S", "Les vidanges le jeudi, le recyclage le mardi. C'est noté.", "Lucas"], ["S", "Voilà, c'est fini ! On a tout monté. Vous pouvez vérifier s'il manque quelque chose ?", "Kevin"], ["S", "Tout est là. Merci beaucoup ! Vous avez travaillé très vite.", "Lucas"], ["S", "Merci ! Bonne installation, et bon premier juillet !", "Kevin"]], "words": 221, "kind": "story", "scene": "Moving day. On July 1, Lucas moves into his new apartment with two movers.", "F": "Giving instructions, the past tense", "V": "les clés (the keys); la boîte aux lettres (the mailbox); les déménageurs (the movers); étroit (narrow); les vidanges (household garbage (Québec)); ramasser (to pick up, to collect); les bacs (the bins); monter (to carry up)", "t": [[1.99, 4.66], [4.87, 8.71], [8.93, 16.13], [16.78, 19.68], [19.9, 23.54], [24.19, 26.06], [26.28, 29.95], [30.17, 34.75], [35.4, 37.44], [37.66, 40.25], [40.46, 42.79], [43.44, 46.2], [46.42, 50.33], [50.54, 54.43], [55.08, 57.05], [57.26, 59.14], [59.78, 63.07], [63.29, 66.55], [66.77, 70.01], [70.66, 72.62], [72.84, 75.58], [75.79, 79.61], [79.82, 83.33], [83.98, 85.85], [86.06, 88.03], [88.68, 91.78], [91.99, 97.46], [98.11, 105.24], [105.46, 109.46], [110.11, 114.26], [114.48, 116.35], [117.0, 119.62], [119.83, 122.09], [122.3, 125.88], [126.53, 128.4], [128.62, 130.73], [130.94, 133.78], [134.42, 136.3], [136.51, 140.57]], "R": []}, {"num": 33, "title": "La carte de crédit", "lines": [["P", "Bonjour, monsieur Oliveira. Qu'est-ce que je peux faire pour vous aujourd'hui ?", "La conseillère"], ["S", "Bonjour. Je voudrais une carte de crédit. Mes collègues m'ont dit que c'est important pour mon historique de crédit.", "Lucas"], ["P", "Vos collègues ont raison. Au Canada, quand vous louez un appartement ou que vous achetez une voiture, on vérifie souvent votre dossier de crédit.", "La conseillère"], ["S", "Mais je n'ai pas de dossier. J'ai toujours payé comptant ou par carte de débit.", "Lucas"], ["P", "C'est normal pour un nouvel arrivant. Je vous propose une carte de crédit garantie. Vous déposez cinq cents dollars, et votre limite de crédit est de cinq cents dollars.", "La conseillère"], ["S", "Je comprends. Et si je ne paie pas tout à la fin du mois ?", "Lucas"], ["P", "Si vous ne payez pas le solde au complet, vous allez payer des intérêts. Ils sont élevés, alors je vous conseille de tout payer chaque mois.", "La conseillère"], ["S", "D'accord. Combien de temps faut-il pour avoir un bon dossier ?", "Lucas"], ["P", "En général, après six mois à un an, si vous payez toujours à temps, votre dossier sera bon. Ensuite, vous pourrez demander une carte ordinaire et récupérer votre dépôt.", "La conseillère"], ["S", "Et est-ce que je peux utiliser toute la limite ?", "Lucas"], ["P", "Vous pouvez, mais ce n'est pas une bonne idée. Essayez d'utiliser moins de la moitié de votre limite. C'est mieux pour votre dossier.", "La conseillère"], ["S", "Merci, c'est très clair. Je vais prendre la carte garantie.", "Lucas"], ["P", "Parfait. Vous allez la recevoir par la poste dans une dizaine de jours.", "La conseillère"]], "words": 232, "kind": "story", "scene": "The credit card. Lucas asks his bank adviser how to build a credit history in Canada.", "F": "Explaining a situation, conditions with si", "V": "l'historique de crédit, le dossier de crédit (credit history, credit file); payer comptant (to pay cash); une carte garantie (a secured card); déposer (to deposit); le solde au complet (the full balance); les intérêts (interest); à temps (on time); récupérer (to get back)", "t": [[1.99, 5.18], [5.4, 8.62], [9.26, 11.14], [11.35, 14.3], [14.52, 19.06], [19.7, 22.08], [22.3, 30.02], [30.67, 33.12], [33.34, 37.15], [37.8, 40.9], [41.11, 44.83], [45.05, 50.69], [51.34, 53.21], [53.42, 56.5], [57.14, 62.11], [62.33, 67.03], [67.68, 69.55], [69.77, 73.42], [74.06, 80.71], [80.93, 86.3], [86.95, 90.14], [90.79, 94.32], [94.54, 98.69], [98.9, 101.57], [102.22, 105.17], [105.38, 108.55], [109.2, 111.07], [111.29, 115.9]], "R": []}, {"num": 34, "title": "L'entrevue téléphonique", "lines": [["P", "Bonjour, est-ce que je parle à Camila Souza ?", "Mme Côté"], ["S", "Oui, c'est moi.", "Camila"], ["P", "Bonjour, madame Souza. Ici Nathalie Côté, des ressources humaines du CHSLD Rosemont. Vous avez posé votre candidature pour le poste de préposée aux bénéficiaires. Vous avez quelques minutes ?", "Mme Côté"], ["S", "Oui, bien sûr. Merci de m'appeler.", "Camila"], ["P", "Parfait. Pouvez-vous me parler de votre expérience ?", "Mme Côté"], ["S", "Je suis infirmière. J'ai travaillé six ans dans un hôpital à São Paulo, surtout avec des personnes âgées. Je suis arrivée à Montréal en janvier.", "Camila"], ["P", "Très bien. Et pourquoi ce poste vous intéresse ?", "Mme Côté"], ["S", "Je suis en train de faire les démarches pour travailler comme infirmière au Québec. En attendant, je veux travailler avec les patients et améliorer mon français.", "Camila"], ["P", "Je comprends. Le poste est de jour, de sept heures à quinze heures, mais vous devez travailler une fin de semaine sur deux. Est-ce que c'est possible pour vous ?", "Mme Côté"], ["S", "Oui, c'est possible. Je suis disponible tout de suite.", "Camila"], ["P", "Excellent. La prochaine étape, c'est une entrevue en personne avec l'infirmier-chef, monsieur Lavoie. Êtes-vous libre jeudi à dix heures ?", "Mme Côté"], ["S", "Oui, jeudi à dix heures, c'est parfait. Je dois apporter quelque chose ?", "Camila"], ["P", "Apportez votre curriculum vitae et une pièce d'identité. Je vous envoie l'adresse par courriel.", "Mme Côté"], ["S", "Merci beaucoup, madame Côté. À jeudi !", "Camila"]], "words": 200, "kind": "story", "scene": "The phone screen. A recruiter phones Camila about a job as an orderly in a long-term care home.", "F": "Describing experience, the past tense", "V": "les ressources humaines (human resources); poser sa candidature (to apply); un préposé aux bénéficiaires (an orderly, a care aide); les personnes âgées (the elderly); faire les démarches (to go through the process); en attendant (in the meantime); une fin de semaine sur deux (every other weekend)", "t": [[1.99, 5.74], [6.38, 8.26], [8.9, 11.83], [12.05, 17.23], [17.45, 23.35], [23.57, 26.18], [26.83, 28.7], [28.92, 30.79], [31.44, 33.31], [33.53, 36.91], [37.56, 39.5], [39.72, 44.71], [44.93, 47.52], [48.17, 50.04], [50.26, 53.4], [54.05, 58.1], [58.32, 62.81], [63.46, 65.42], [65.64, 72.34], [72.55, 75.22], [75.86, 77.74], [77.95, 80.09], [80.74, 82.61], [82.82, 89.09], [89.3, 92.28], [92.93, 95.78], [96.0, 98.21], [98.86, 103.37], [103.58, 106.9], [107.54, 109.97], [110.18, 112.06]], "R": []}, {"num": 35, "title": "L'entrevue d'embauche", "lines": [["P", "Bonjour, madame Souza. Assoyez-vous, je vous en prie. Vous avez trouvé facilement ?", "M. Lavoie"], ["S", "Oui, merci. Je suis venue en autobus. Ça m'a pris vingt minutes.", "Camila"], ["P", "Parfait. Alors, Mme Côté m'a dit que vous êtes infirmière au Brésil. Parlez-moi d'une journée typique dans votre ancien travail.", "M. Lavoie"], ["S", "Je travaillais dans une unité de gériatrie. Le matin, je donnais les médicaments et je vérifiais les signes vitaux. J'aidais aussi les patients à se lever, à se laver et à manger.", "Camila"], ["P", "Ici, le travail de préposée, c'est surtout les soins de base : l'hygiène, les repas, les déplacements. Vous n'allez pas donner de médicaments. Est-ce que ça vous convient ?", "M. Lavoie"], ["S", "Oui, tout à fait. Je sais que c'est un autre rôle. Pour moi, le plus important, c'est le contact avec les résidents.", "Camila"], ["P", "Quelle est votre plus grande qualité ?", "M. Lavoie"], ["S", "Je suis patiente et calme. Avec les personnes âgées, c'est essentiel. Une fois, une patiente avait peur de prendre sa douche. J'ai pris le temps de lui parler, et elle a accepté.", "Camila"], ["P", "C'est un bel exemple. Et votre français ? Les résidents parlent seulement français, souvent avec un fort accent.", "M. Lavoie"], ["S", "Je suis des cours de français trois soirs par semaine. Je comprends bien, mais parfois je dois demander de répéter.", "Camila"], ["P", "C'est normal. Avez-vous des questions pour moi ?", "M. Lavoie"], ["S", "Oui. Est-ce qu'il y a une formation au début ?", "Camila"], ["P", "Oui, deux semaines de formation, avec une préposée expérimentée. On vous rappelle d'ici lundi.", "M. Lavoie"], ["S", "Merci beaucoup pour votre temps, monsieur Lavoie.", "Camila"]], "words": 237, "kind": "story", "scene": "The job interview. Camila meets the head nurse at the long-term care home.", "F": "Strengths, past experience, questions to ask", "V": "Assoyez-vous. (Have a seat. (Québec)); les signes vitaux (vital signs); les soins de base (basic care); Ça vous convient ? (Does that suit you?); une qualité (a strength); suivre des cours (to take classes); une formation (training)", "t": [[1.99, 5.42], [5.64, 8.98], [9.19, 11.76], [12.41, 14.28], [14.5, 16.56], [16.78, 18.82], [19.46, 21.34], [21.55, 27.41], [27.62, 32.3], [32.95, 35.9], [36.12, 40.58], [40.8, 44.86], [45.5, 54.7], [54.91, 58.18], [58.39, 60.79], [61.44, 63.31], [63.53, 65.66], [65.88, 69.94], [70.58, 73.42], [74.06, 76.08], [76.3, 79.3], [79.51, 82.97], [83.18, 86.45], [87.1, 89.71], [89.93, 92.02], [92.23, 97.9], [98.54, 101.62], [101.83, 105.58], [106.22, 108.5], [108.72, 111.46], [112.1, 112.75], [112.97, 115.32], [115.97, 122.09], [122.3, 125.38], [126.02, 128.98]], "R": []}, {"num": 36, "title": "La visite du CHSLD", "lines": [["P", "Bonjour, Camila ! Je suis Josée. Je vais te former pendant deux semaines. On se tutoie, ça te va ?", "Josée"], ["S", "Oui, bien sûr ! Enchantée, Josée. Je suis un peu nerveuse.", "Camila"], ["P", "C'est normal, la première journée. Viens, je vais te faire visiter. D'abord, voici le vestiaire. Ton casier, c'est le numéro quarante-deux. Ton uniforme est déjà dedans.", "Josée"], ["S", "Parfait. Et mon badge ?", "Camila"], ["P", "Tu vas le recevoir cet après-midi aux ressources humaines. En attendant, tu restes avec moi, parce que les portes s'ouvrent seulement avec le badge.", "Josée"], ["S", "D'accord.", "Camila"], ["P", "Ici, au deuxième étage, il y a trente-deux résidents. Le poste des infirmières est au milieu du corridor. Si tu as un problème, tu vas là. La salle à manger est au bout, à gauche.", "Josée"], ["S", "Les repas sont à quelle heure ?", "Camila"], ["P", "Le déjeuner est à huit heures, le dîner à midi et le souper à dix-sept heures. On aide les résidents à venir à la salle à manger, et certains mangent dans leur chambre.", "Josée"], ["S", "Le déjeuner, c'est le repas du matin, c'est ça ? Au cours de français, on a appris « petit-déjeuner ».", "Camila"], ["P", "Oui ! Au Québec, on dit le déjeuner, le dîner et le souper. Tu vas t'habituer vite. Autre chose importante : on se lave les mains en entrant et en sortant de chaque chambre. Toujours.", "Josée"], ["S", "Compris. Et la pause ?", "Camila"], ["P", "Tu as quinze minutes à dix heures et trente minutes pour dîner. La salle des employés est à côté de l'ascenseur. Bon, on va rencontrer madame Pelletier. Elle a quatre-vingt-quatorze ans, et elle adore les visiteurs !", "Josée"]], "words": 247, "kind": "story", "scene": "The tour of the care home. On her first day, a colleague shows Camila around the long-term care home.", "F": "Workplace vocabulary, rules and routines", "V": "former (to train); le vestiaire (the locker room); dedans (inside); le poste des infirmières (the nursing station); le déjeuner, le dîner, le souper (breakfast, lunch, supper (Québec)); s'habituer (to get used to); l'ascenseur (the elevator)", "t": [[1.99, 4.68], [4.9, 6.98], [7.2, 10.27], [10.49, 13.22], [13.87, 15.74], [15.96, 18.24], [18.46, 20.4], [21.05, 24.34], [24.55, 27.6], [27.82, 31.08], [31.3, 34.92], [35.14, 37.94], [38.59, 40.46], [40.68, 42.55], [43.2, 47.4], [47.62, 53.83], [54.48, 56.35], [57.0, 61.42], [61.63, 65.83], [66.05, 69.34], [69.55, 73.1], [73.75, 75.67], [76.32, 81.72], [81.94, 87.74], [88.39, 91.66], [91.87, 95.66], [96.31, 98.18], [98.4, 103.15], [103.37, 105.84], [106.06, 111.96], [112.18, 114.05], [114.7, 116.57], [116.78, 118.66], [119.3, 123.43], [123.65, 127.68], [127.9, 131.42], [131.64, 136.15]], "R": []}, {"num": 37, "title": "La réunion du lundi", "lines": [["P", "Bon matin, tout le monde ! On commence. Cette semaine, on a une grosse semaine, parce que le client viendra vendredi pour voir la nouvelle version de l'application.", "Marc"], ["S", "Vendredi à quelle heure ?", "Élodie"], ["P", "À dix heures. Élodie, tu prépareras la présentation. Tu pourras me l'envoyer jeudi midi ?", "Marc"], ["S", "Oui, pas de problème. J'aurai besoin des captures d'écran de Lucas.", "Élodie"], ["P", "Justement. Lucas, tu termineras la page de connexion d'ici mercredi. Ensuite, tu feras les captures d'écran pour Élodie.", "Marc"], ["S", "D'accord. Mais j'ai une question. Le client veut toujours la connexion avec le numéro de téléphone ?", "Lucas"], ["P", "Bonne question. Je l'appellerai ce matin et je te répondrai avant midi.", "Marc"], ["S", "Et moi, Marc ?", "François"], ["P", "François, tu corrigeras les bogues de la semaine dernière. Il en reste combien ?", "Marc"], ["S", "Il en reste six. Deux sont urgents.", "François"], ["P", "Alors, commence par les deux urgents. Si tu as besoin d'aide, Lucas pourra t'aider jeudi.", "Marc"], ["S", "Oui, jeudi après-midi, je serai libre.", "Lucas"], ["P", "Parfait. Une dernière chose : mercredi, il y aura une coupure d'électricité dans l'immeuble entre midi et treize heures. Sauvegardez votre travail avant midi.", "Marc"], ["S", "On pourra dîner ensemble au restaurant, alors !", "Élodie"], ["P", "Bonne idée. Merci, tout le monde. Bonne semaine !", "Marc"]], "words": 184, "kind": "story", "scene": "The Monday meeting. At the weekly team meeting, Marc gives out the tasks for the week.", "F": "The future tense, deadlines", "V": "Bon matin ! (Good morning! (Québec)); la version (the version); des captures d'écran (screenshots); justement (exactly, as it happens); la page de connexion (the login page); les bogues (bugs (Québec)); Il en reste six. (There are six left.); une coupure d'électricité (a power outage); sauvegarder (to save)", "t": [[1.99, 5.02], [5.23, 7.37], [7.58, 16.85], [17.5, 20.04], [20.69, 22.87], [23.09, 27.14], [27.36, 30.5], [31.15, 33.74], [33.96, 37.51], [38.16, 40.13], [40.34, 45.91], [46.13, 50.95], [51.6, 53.47], [53.69, 56.02], [56.23, 60.43], [61.08, 63.34], [63.55, 68.42], [69.07, 71.45], [72.1, 77.35], [77.57, 79.94], [80.59, 83.02], [83.23, 85.42], [86.06, 89.95], [90.17, 95.16], [95.81, 99.72], [100.37, 102.24], [102.46, 111.65], [111.86, 115.66], [116.3, 120.29], [120.94, 122.98], [123.19, 126.26], [126.48, 128.76]], "R": []}, {"num": 38, "title": "La pause café", "lines": [["P", "Salut, Lucas ! Pis, ta fin de semaine ? T'as fait quelque chose de spécial ?", "François"], ["S", "Oui, je suis allé au Festival de jazz avec mon voisin. Il y avait beaucoup de monde, mais c'était super.", "Lucas"], ["S", "Ah, j'adore le Festival de jazz ! Les spectacles gratuits dehors, c'est ce que je préfère à Montréal en été.", "Élodie"], ["P", "Moi, je trouve qu'il y a trop de monde. Je préfère les petits festivals, dans les quartiers.", "François"], ["S", "Tu as raison, c'était un peu difficile de bouger. Mais la musique était excellente. Il y avait même un groupe brésilien !", "Lucas"], ["S", "Ça t'a rappelé ton pays ?", "Élodie"], ["S", "Oui, un peu. J'ai eu un petit coup de nostalgie. Et toi, Élodie, ta fin de semaine ?", "Lucas"], ["S", "Tranquille. On est allés à la piscine avec les enfants. Il faisait trente-trois degrés avec l'humidité !", "Élodie"], ["P", "C'est fou, hein ? L'hiver, il fait moins trente, et l'été, il fait trente-trois. Au Québec, on a deux saisons : l'hiver et les travaux !", "François"], ["S", "Les travaux ? Pourquoi ?", "Lucas"], ["P", "Regarde les rues ! Il y a des cônes orange partout. On répare les routes tout l'été, parce que l'hiver les abîme.", "François"], ["S", "Ah, c'est vrai ! Ce matin, mon autobus a fait un grand détour à cause des travaux.", "Lucas"], ["S", "Bienvenue à Montréal ! Bon, je retourne travailler. On se voit à la réunion.", "Élodie"], ["P", "À tantôt !", "François"]], "words": 206, "kind": "story", "scene": "The coffee break. In the office kitchen, Lucas makes small talk with Élodie and François.", "F": "Small talk, opinions, everyday expressions", "V": "Pis ? (So? (informal Québec)); T'as fait… (Did you do… (informal for tu as)); beaucoup de monde (a lot of people); un coup de nostalgie (a wave of homesickness); tranquille (quiet, relaxed); les travaux (roadwork, construction); abîmer (to damage); À tantôt ! (See you later! (Québec))", "t": [[1.99, 4.49], [4.7, 7.61], [7.82, 10.85], [11.5, 15.84], [16.06, 19.94], [20.59, 24.1], [24.31, 29.9], [30.55, 33.98], [34.2, 38.3], [38.95, 42.91], [43.13, 46.06], [46.27, 49.44], [50.09, 52.7], [53.35, 55.42], [55.63, 58.73], [58.94, 62.47], [63.12, 64.99], [65.21, 68.47], [68.69, 72.31], [72.96, 75.0], [75.22, 80.23], [80.45, 84.98], [85.63, 87.5], [87.72, 89.59], [90.24, 92.38], [92.59, 95.38], [95.59, 100.2], [100.85, 103.03], [103.25, 108.1], [108.74, 111.24], [111.46, 114.48], [114.7, 117.19], [117.84, 119.71]], "R": []}, {"num": 39, "title": "Le match du Canadien", "lines": [["P", "Lucas, ce soir, c'est le match du Canadien contre Toronto. Tu viens le regarder avec nous au bar ?", "François"], ["S", "Avec plaisir ! Mais je dois t'avouer quelque chose : je ne connais pas du tout les règles du hockey.", "Lucas"], ["P", "Pas de problème, je vais t'expliquer. C'est simple : il y a deux équipes de six joueurs, et il faut mettre la rondelle dans le filet de l'autre équipe.", "François"], ["S", "La rondelle ? C'est le petit disque noir ?", "Lucas"], ["P", "Exactement. Un match, c'est trois périodes de vingt minutes. Si c'est égal à la fin, il y a une prolongation.", "François"], ["S", "Et pourquoi tout le monde parle du match contre Toronto ?", "Lucas"], ["P", "C'est la grande rivalité ! Montréal contre Toronto, c'est comme Flamengo contre Fluminense chez vous, j'imagine.", "François"], ["S", "Ah, je comprends maintenant ! Alors, c'est très important.", "Lucas"], ["P", "Très, très important. Regarde, le match commence. Le numéro quatorze, c'est notre meilleur joueur.", "François"], ["S", "Oh ! Il a marqué un but ? Pourquoi tout le monde crie ?", "Lucas"], ["P", "Oui, il a compté ! Un à zéro pour le Canadien ! Allez, Montréal !", "François"], ["S", "Et maintenant, pourquoi le joueur de Toronto va dans la petite boîte ?", "Lucas"], ["P", "C'est le banc des pénalités. Il a fait trébucher notre joueur, alors il doit rester là deux minutes.", "François"], ["S", "J'aime ça ! C'est rapide, et l'ambiance est incroyable. Je pense que je vais devenir un fan du Canadien.", "Lucas"]], "words": 209, "kind": "story", "scene": "The Canadiens game. François invites Lucas to watch a hockey game at a sports bar.", "F": "Sports talk, enthusiasm, explaining rules", "V": "avouer (to admit); les règles (the rules); la rondelle (the puck (Québec)); le filet (the net); une prolongation (overtime); marquer un but, compter (to score a goal (compter: Québec)); le banc des pénalités (the penalty box); faire trébucher (to trip)", "t": [[1.99, 7.15], [7.37, 10.75], [11.4, 13.51], [13.73, 18.96], [19.61, 22.92], [23.14, 30.46], [31.1, 32.98], [33.19, 35.83], [36.48, 38.5], [38.71, 42.6], [42.82, 47.09], [47.74, 51.55], [52.2, 54.77], [54.98, 61.8], [62.45, 65.09], [65.3, 68.23], [68.88, 71.42], [71.64, 74.93], [75.14, 79.37], [80.02, 81.89], [82.1, 84.31], [84.53, 86.9], [87.55, 90.02], [90.24, 93.05], [93.26, 95.78], [96.43, 101.04], [101.69, 104.33], [104.54, 109.75], [110.4, 112.27], [112.49, 116.18], [116.4, 120.0]], "R": []}, {"num": 40, "title": "À la clinique sans rendez-vous", "lines": [["P", "Bonjour, monsieur Oliveira. Je suis la docteure Roy. Qu'est-ce qui vous amène aujourd'hui ?", "La médecin"], ["S", "Bonjour, docteure. J'ai mal à la gorge depuis quatre jours, et depuis hier, j'ai de la fièvre.", "Lucas"], ["P", "Vous avez pris votre température ?", "La médecin"], ["S", "Oui, ce matin. Trente-huit virgule neuf.", "Lucas"], ["P", "D'accord. Est-ce que vous toussez ? Est-ce que vous avez le nez qui coule ?", "La médecin"], ["S", "Non, je ne tousse pas. Mais j'ai mal quand j'avale, et je suis très fatigué.", "Lucas"], ["P", "Ouvrez la bouche, s'il vous plaît. Dites « ah ».", "La médecin"], ["S", "Ah.", "Lucas"], ["P", "Votre gorge est très rouge, et il y a des points blancs. Je vais faire un test rapide pour le streptocoque. Ça prend dix minutes.", "La médecin"], ["S", "Est-ce que c'est grave ?", "Lucas"], ["P", "Non, ne vous inquiétez pas. Le test est positif, alors c'est une infection bactérienne. Je vais vous prescrire un antibiotique. Prenez-le jusqu'à la fin, même si vous vous sentez mieux.", "La médecin"], ["S", "D'accord. Je peux aller travailler demain ?", "Lucas"], ["P", "Restez à la maison au moins deux jours, jusqu'à ce que la fièvre baisse. Voici votre ordonnance. Vous pouvez aller à n'importe quelle pharmacie.", "La médecin"], ["S", "Est-ce que je dois revenir ?", "Lucas"], ["P", "Si vous avez encore de la fièvre dans trois jours, revenez nous voir. Bon rétablissement !", "La médecin"]], "words": 187, "kind": "story", "scene": "At the walk-in clinic. Lucas has had a sore throat and a fever for four days and sees a doctor at a walk-in clinic.", "F": "Describing symptoms, depuis, health words", "V": "Qu'est-ce qui vous amène ? (What brings you in?); le nez qui coule (a runny nose); avaler (to swallow); grave (serious); Ne vous inquiétez pas. (Don't worry.); prescrire, une ordonnance (to prescribe, a prescription); baisser (to go down)", "t": [[1.99, 5.18], [5.4, 7.97], [8.18, 10.87], [11.52, 14.26], [14.47, 20.14], [20.78, 23.95], [24.6, 26.88], [27.1, 29.57], [30.22, 32.14], [32.35, 34.42], [34.63, 37.58], [38.23, 40.75], [40.97, 45.14], [45.79, 48.89], [49.1, 51.14], [51.79, 53.66], [54.31, 58.37], [58.58, 62.47], [62.69, 65.28], [65.93, 67.94], [68.59, 71.54], [71.76, 76.82], [77.04, 80.33], [80.54, 84.7], [85.34, 87.22], [87.43, 89.98], [90.62, 95.78], [96.0, 98.74], [98.95, 102.43], [103.08, 105.48], [106.13, 111.34], [111.55, 113.86]], "R": []}, {"num": 41, "title": "La voiture d'occasion", "lines": [["P", "Bonjour ! Vous cherchez une voiture ?", "Le vendeur"], ["S", "Oui, une voiture d'occasion. Pas trop chère, mais fiable. J'en ai besoin pour aller voir des amis à l'extérieur de Montréal.", "Lucas"], ["P", "J'ai deux voitures pour vous. Cette petite grise est de deux mille dix-neuf. Elle a quatre-vingt-cinq mille kilomètres. Elle est à quatorze mille dollars.", "Le vendeur"], ["S", "Et la bleue, là-bas ?", "Lucas"], ["P", "La bleue est plus récente, de deux mille vingt et un, avec seulement quarante mille kilomètres. Mais elle est plus chère : dix-huit mille cinq cents dollars.", "Le vendeur"], ["S", "Hum. La grise consomme beaucoup d'essence ?", "Lucas"], ["P", "Non, elle est très économique. Environ six litres aux cent kilomètres.", "Le vendeur"], ["S", "Est-ce qu'elle a déjà eu un accident ?", "Lucas"], ["P", "Non, aucun accident. Voici le rapport d'historique du véhicule. Et elle a été inspectée la semaine dernière.", "Le vendeur"], ["S", "Est-ce que je peux faire un essai routier ?", "Lucas"], ["P", "Bien sûr. Vous avez votre permis de conduire ?", "Le vendeur"], ["S", "Oui, j'ai un permis temporaire. Je passe mon examen de conduite le mois prochain.", "Lucas"], ["P", "Parfait. Alors, après l'essai, si elle vous plaît, on peut parler du prix.", "Le vendeur"], ["S", "Quatorze mille, c'est un peu cher pour moi. Si je la prends aujourd'hui, est-ce que vous pouvez inclure les pneus d'hiver ?", "Lucas"], ["P", "Hum, vous êtes un bon négociateur ! D'accord, les pneus d'hiver sont inclus. On va faire l'essai ?", "Le vendeur"]], "words": 201, "kind": "story", "scene": "The used car. Lucas looks at a used car at a dealership.", "F": "Comparing, asking questions, negotiating", "V": "une voiture d'occasion (a used car); fiable (reliable); consommer de l'essence (to use gas); aux cent kilomètres (per hundred kilometres); le rapport d'historique (the vehicle history report); un essai routier (a test drive); le permis de conduire (the driver's licence); les pneus d'hiver (winter tires)", "t": [[1.99, 3.94], [4.15, 6.74], [7.39, 10.25], [10.46, 13.39], [13.61, 18.36], [19.01, 21.55], [21.77, 25.34], [25.56, 28.9], [29.11, 31.97], [32.62, 35.06], [35.71, 42.38], [42.6, 46.87], [47.52, 49.39], [49.61, 52.63], [53.28, 56.4], [56.62, 59.98], [60.62, 63.36], [64.01, 66.7], [66.91, 70.63], [70.85, 74.5], [75.14, 77.95], [78.6, 80.59], [80.81, 83.98], [84.62, 87.74], [87.96, 91.66], [92.3, 94.18], [94.39, 99.36], [100.01, 103.54], [103.75, 108.5], [109.15, 112.66], [112.87, 116.47], [116.69, 118.85]], "R": []}, {"num": 42, "title": "L'assurance auto", "lines": [["P", "Assurances Laurentide, bonjour. Mon nom est Mélanie. Comment puis-je vous aider ?", "L'agente"], ["S", "Bonjour, Mélanie. Je viens d'acheter une voiture, et j'ai besoin d'une assurance.", "Lucas"], ["P", "Félicitations ! Je vais vous poser quelques questions. Quelle est la marque et l'année de la voiture ?", "L'agente"], ["S", "C'est une petite voiture grise de deux mille dix-neuf.", "Lucas"], ["P", "Et depuis combien de temps vous conduisez ?", "L'agente"], ["S", "Je conduis depuis dix ans au Brésil. Mais ici, j'ai seulement un permis temporaire.", "Lucas"], ["P", "Je comprends. Malheureusement, pour les assurances, votre expérience à l'étranger ne compte pas toujours. Le prix sera un peu plus élevé au début.", "L'agente"], ["S", "Ah, d'accord. Qu'est-ce qui est obligatoire ?", "Lucas"], ["P", "Au Québec, l'assurance responsabilité civile est obligatoire. Elle couvre les dommages que vous causez aux autres. Les blessures, elles, sont couvertes par la SAAQ, l'assurance publique.", "L'agente"], ["S", "Et si quelqu'un vole ma voiture ?", "Lucas"], ["P", "Pour le vol, il faut ajouter une protection supplémentaire. Pour une voiture récente, je vous la recommande.", "L'agente"], ["S", "Combien ça coûte en tout ?", "Lucas"], ["P", "Avec la responsabilité civile et la protection complète, c'est cent quarante dollars par mois. Si vous installez un système antivol, le prix baisse.", "L'agente"], ["S", "D'accord, je vais prendre la protection complète. Je peux payer chaque mois ?", "Lucas"], ["P", "Oui, par prélèvement automatique. Je vous envoie le contrat par courriel tout de suite.", "L'agente"]], "words": 201, "kind": "story", "scene": "Car insurance. Lucas calls an insurance company to insure his car.", "F": "Numbers, conditions, explaining coverage", "V": "une assurance (insurance); la marque (the make, the brand); à l'étranger (abroad); la responsabilité civile (liability); les dommages (damage); les blessures (injuries); le vol, voler (theft, to steal); un prélèvement automatique (an automatic withdrawal)", "t": [[1.99, 5.47], [5.69, 8.06], [8.28, 10.66], [11.3, 14.04], [14.26, 18.74], [19.39, 21.58], [21.79, 24.7], [24.91, 28.15], [28.8, 32.66], [33.31, 36.41], [37.06, 40.44], [40.66, 44.54], [45.19, 47.16], [47.38, 53.86], [54.07, 57.53], [58.18, 60.48], [60.7, 63.34], [63.98, 69.41], [69.62, 73.3], [73.51, 79.18], [79.82, 82.66], [83.3, 88.08], [88.3, 92.23], [92.88, 95.26], [95.9, 102.36], [102.58, 107.06], [107.71, 111.6], [111.82, 114.26], [114.91, 118.25], [118.46, 122.33]], "R": []}, {"num": 43, "title": "L'examen de conduite", "lines": [["P", "Bonjour, monsieur Oliveira. Je m'appelle Paul Gagné. Je serai votre examinateur aujourd'hui. Vous êtes prêt ?", "L'examinateur"], ["S", "Bonjour. Oui, je suis un peu nerveux, mais je suis prêt.", "Lucas"], ["P", "C'est normal. Avant de partir, ajustez votre siège et vos miroirs, et attachez votre ceinture.", "L'examinateur"], ["S", "Voilà, c'est fait.", "Lucas"], ["P", "Parfait. Sortez du stationnement et tournez à droite sur la rue principale.", "L'examinateur"], ["S", "D'accord. Le feu est rouge. Est-ce que je peux tourner à droite ?", "Lucas"], ["P", "Non. Sur l'île de Montréal, le virage à droite au feu rouge est interdit. Attendez le feu vert.", "L'examinateur"], ["S", "Ah oui, c'est vrai. J'attends.", "Lucas"], ["P", "Bien. Au prochain arrêt, tournez à gauche. Attention, c'est une zone scolaire. La limite est de trente kilomètres à l'heure.", "L'examinateur"], ["S", "Trente kilomètres à l'heure. Je ralentis.", "Lucas"], ["P", "Très bien. Maintenant, garez-vous en parallèle derrière la voiture rouge.", "L'examinateur"], ["S", "C'est la partie que j'aime le moins ! Voilà. C'est correct ?", "Lucas"], ["P", "Vous êtes un peu loin du trottoir, mais c'est acceptable. Retournez au centre de service, s'il vous plaît.", "L'examinateur"], ["S", "Alors ? Est-ce que j'ai réussi ?", "Lucas"], ["P", "Oui, vous avez réussi. Vous avez fait une petite erreur au feu rouge, mais vous vous êtes arrêté. Félicitations ! Passez au comptoir pour votre permis.", "L'examinateur"]], "words": 185, "kind": "story", "scene": "The road test. Lucas takes his road test with a SAAQ examiner.", "F": "Following directions, traffic rules", "V": "l'examinateur (the examiner); ajuster (to adjust); attacher sa ceinture (to fasten your seatbelt); interdit (not allowed); l'arrêt (the stop sign (Québec)); une zone scolaire (a school zone); ralentir (to slow down); se garer en parallèle (to parallel park); réussir (to pass)", "t": [[1.99, 5.71], [5.93, 8.59], [8.81, 12.53], [12.74, 14.62], [15.26, 17.14], [17.35, 21.26], [21.91, 24.19], [24.41, 32.09], [32.74, 35.16], [35.81, 37.68], [37.9, 43.58], [44.23, 46.1], [46.32, 48.6], [48.82, 51.46], [52.1, 53.98], [54.19, 60.6], [60.82, 63.53], [64.18, 66.6], [66.82, 68.69], [69.34, 71.21], [71.42, 75.22], [75.43, 79.25], [79.46, 83.42], [84.07, 86.62], [86.83, 88.87], [89.52, 91.39], [91.61, 97.03], [97.68, 100.37], [100.58, 102.46], [102.67, 104.54], [105.19, 110.11], [110.33, 114.89], [115.54, 117.41], [117.62, 119.76], [120.41, 123.41], [123.62, 129.29], [129.5, 131.81], [132.02, 135.48]], "R": []}, {"num": 44, "title": "Les pneus d'hiver", "lines": [["P", "Bonjour ! Qu'est-ce qu'on peut faire pour vous ?", "Le mécanicien"], ["S", "Bonjour. J'ai acheté ma voiture cet été, et le vendeur m'a donné des pneus d'hiver. Je voudrais les faire installer.", "Lucas"], ["P", "Bonne idée. Vous savez que c'est obligatoire au Québec ?", "Le mécanicien"], ["S", "Oui, un collègue m'en a parlé. C'est à partir de quand, exactement ?", "Lucas"], ["P", "Du premier décembre au quinze mars. Mais la neige arrive souvent avant, alors beaucoup de gens les installent en novembre.", "Le mécanicien"], ["S", "Et si je ne les installe pas ?", "Lucas"], ["P", "Vous pouvez avoir une amende. Et surtout, c'est dangereux. Avec des pneus d'été, la voiture glisse beaucoup sur la neige.", "Le mécanicien"], ["S", "Comment je sais si ce sont de vrais pneus d'hiver ?", "Lucas"], ["P", "Il faut voir le petit symbole sur le côté du pneu : une montagne avec un flocon de neige. Laissez-moi regarder vos pneus. Oui, ils sont bons, et presque neufs.", "Le mécanicien"], ["S", "Parfait. Ça va prendre combien de temps ?", "Lucas"], ["P", "Environ quarante-cinq minutes. Si vous voulez, on peut aussi vérifier vos essuie-glaces et le liquide lave-glace.", "Le mécanicien"], ["S", "Oui, s'il vous plaît. Je n'y avais pas pensé.", "Lucas"], ["P", "En hiver, il faut un liquide lave-glace pour moins quarante. Et pensez à acheter un balai à neige pour votre voiture.", "Le mécanicien"], ["S", "Un balai à neige ? Pour enlever la neige sur la voiture, le matin ?", "Lucas"], ["P", "Exactement. Et au printemps, revenez nous voir pour remettre vos pneus d'été. On peut garder vos pneus ici, si vous n'avez pas de place.", "Le mécanicien"]], "words": 224, "kind": "story", "scene": "Winter tires. In November, Lucas takes his car to a garage to get winter tires put on.", "F": "Obligations, il faut, dates", "V": "faire installer (to have something put on); obligatoire (required by law); à partir de quand ? (from when?); une amende (a fine); un flocon de neige (a snowflake); les essuie-glaces (windshield wipers); le liquide lave-glace (windshield washer fluid); un balai à neige (a snow brush)", "t": [[1.99, 3.94], [4.15, 6.72], [7.37, 9.24], [9.46, 14.62], [14.83, 17.47], [18.12, 19.99], [20.21, 23.69], [24.34, 27.31], [27.53, 30.58], [31.22, 34.56], [34.78, 40.3], [40.94, 43.44], [44.09, 46.78], [46.99, 49.82], [50.04, 54.79], [55.44, 58.97], [59.62, 65.95], [66.17, 68.86], [69.07, 72.72], [73.37, 75.24], [75.46, 78.07], [78.72, 81.72], [81.94, 87.6], [88.25, 90.7], [90.91, 93.29], [93.94, 98.64], [98.86, 103.3], [103.94, 106.1], [106.32, 109.85], [110.5, 112.51], [112.73, 117.36], [117.58, 122.14]], "R": []}, {"num": 45, "title": "L'inscription au cégep", "lines": [["P", "Bonjour, madame Souza. Je suis Daniel Bouchard, aide pédagogique. Comment je peux vous aider ?", "M. Bouchard"], ["S", "Bonjour. Je suis infirmière au Brésil. Je voudrais travailler comme infirmière ici, et on m'a dit qu'il y a un programme au cégep.", "Camila"], ["P", "Oui, nous offrons un programme d'intégration pour les infirmières formées à l'étranger. Il dure environ un an, avec des cours et des stages à l'hôpital.", "M. Bouchard"], ["S", "Est-ce que je peux m'inscrire tout de suite ?", "Camila"], ["P", "Il faut d'abord avoir la décision de l'Ordre des infirmières. Ils vont analyser votre diplôme et vous dire quelle formation vous devez suivre. Vous avez reçu cette décision ?", "M. Bouchard"], ["S", "Oui, je l'ai reçue le mois dernier. La voici.", "Camila"], ["P", "Parfait. Je vois que vous devez faire le programme complet. Il y a aussi un test de français obligatoire. Avez-vous passé un test de français ?", "M. Bouchard"], ["S", "Pas encore. Je suis des cours de français le soir depuis huit mois.", "Camila"], ["P", "Je vous conseille de passer le test bientôt. Le prochain groupe commence en janvier, et la date limite pour s'inscrire est le premier novembre.", "M. Bouchard"], ["S", "Le premier novembre. Et est-ce que je peux continuer à travailler pendant le programme ?", "Camila"], ["P", "Oui, beaucoup d'étudiantes travaillent à temps partiel, surtout la fin de semaine. Mais les stages sont de jour, alors il faut être flexible.", "M. Bouchard"], ["S", "Je comprends. Je travaille dans un CHSLD. Je vais parler à mon patron.", "Camila"], ["P", "Excellent. Votre expérience en CHSLD va vous aider. Voici la liste des documents à fournir. Revenez me voir si vous avez des questions.", "M. Bouchard"]], "words": 242, "kind": "story", "scene": "Enrolling at a cégep. Camila meets an academic adviser at a cégep about a program for nurses trained abroad.", "F": "Programs, requirements, explaining a plan", "V": "un aide pédagogique (an academic adviser); formé à l'étranger (trained abroad); un stage (an internship, a placement); s'inscrire (to enrol); l'Ordre des infirmières (the nurses' professional order); la date limite (the deadline); à temps partiel (part-time); fournir (to provide)", "t": [[1.99, 5.42], [5.64, 9.94], [10.15, 12.53], [13.18, 15.05], [15.26, 17.66], [17.88, 22.7], [23.35, 30.12], [30.34, 36.34], [36.98, 39.22], [39.86, 45.07], [45.29, 51.58], [51.79, 54.55], [55.2, 57.74], [57.96, 59.83], [60.48, 62.35], [62.57, 66.48], [66.7, 71.21], [71.42, 74.57], [75.22, 77.09], [77.3, 80.57], [81.22, 85.2], [85.42, 92.83], [93.48, 95.35], [95.57, 99.07], [99.72, 106.61], [106.82, 112.22], [112.87, 114.74], [114.96, 117.46], [117.67, 119.64], [120.29, 122.18], [122.4, 126.98], [127.2, 131.38], [131.59, 135.46]], "R": []}, {"num": 46, "title": "Le premier cours", "lines": [["P", "Bonjour à toutes et à tous, et bienvenue dans le cours de soins infirmiers en médecine. Je m'appelle Hélène Dubois. Je viens de Bruxelles, mais j'enseigne ici depuis douze ans. Aujourd'hui, nous allons regarder ensemble le plan de cours.", "Professeure Dubois"], ["P", "Le cours a lieu le lundi et le mercredi, de huit heures à onze heures, dans le local A-214. Le plan de cours est sur le portail du cégep. Je vous demande de le lire en entier avant mercredi.", "Professeure Dubois"], ["P", "Maintenant, l'évaluation. Il y a trois parties. D'abord, deux examens écrits, qui comptent pour cinquante pour cent de la note finale. Ensuite, un travail d'équipe, pour vingt-cinq pour cent. Enfin, des exercices en laboratoire, pour les vingt-cinq derniers pour cent.", "Professeure Dubois"], ["P", "La présence est obligatoire au laboratoire. Si vous êtes malade, vous devez m'écrire avant le cours et apporter un billet médical.", "Professeure Dubois"], ["S", "Excusez-moi, madame. Les examens sont à quelles dates ?", "Camila"], ["P", "Bonne question. Le premier examen est le vingt-trois février, et le deuxième, le vingt-huit avril. Les dates sont aussi dans le plan de cours.", "Professeure Dubois"], ["P", "Un dernier point. Plusieurs d'entre vous ont déjà travaillé comme infirmières dans un autre pays. Votre expérience est précieuse. Mais ici, les pratiques et le vocabulaire peuvent être différents. Alors, n'hésitez pas à poser des questions.", "Professeure Dubois"], ["P", "Pour mercredi, lisez le chapitre un du manuel et regardez la vidéo sur le lavage des mains. On commence la première pratique en laboratoire mercredi. Bonne session à toutes et à tous !", "Professeure Dubois"]], "words": 239, "kind": "story", "scene": "The first class. On the first day of the program, Camila's teacher explains the course outline.", "F": "Instructions, dates, how grades work", "V": "le plan de cours (the course outline); le local (the classroom (Québec)); le portail (the online portal); la note finale (the final grade); la présence (attendance); un billet médical (a doctor's note); précieux (valuable); la session (the semester (Québec))", "t": [[1.99, 7.54], [7.75, 10.3], [10.51, 14.88], [15.1, 19.46], [19.68, 26.9], [27.12, 30.74], [30.96, 34.85], [35.06, 37.94], [38.16, 40.34], [40.56, 46.66], [46.87, 51.14], [51.36, 56.76], [56.98, 60.72], [60.94, 66.82], [67.46, 69.67], [69.89, 72.19], [72.84, 74.78], [75.0, 81.07], [81.29, 84.46], [84.67, 86.59], [86.81, 91.7], [91.92, 94.87], [95.09, 99.84], [100.06, 103.54], [103.75, 109.94], [110.16, 114.38], [114.6, 117.6]], "R": []}, {"num": 47, "title": "Le travail d'équipe", "lines": [["P", "Bon, on doit faire une présentation de vingt minutes sur la prévention des chutes chez les personnes âgées. Comment on s'organise ?", "Sarah"], ["S", "On pourrait diviser le sujet en trois parties. Une personne par partie.", "Camila"], ["S", "Bonne idée. Moi, je pourrais faire la première partie : les causes des chutes. J'ai trouvé des statistiques intéressantes.", "Maxime"], ["P", "Parfait. Camila, toi, tu travailles dans un CHSLD, non ? Tu pourrais parler des mesures de prévention ? Tu as sûrement des exemples concrets.", "Sarah"], ["S", "Oui, avec plaisir. Par exemple, chez nous, on vérifie que les résidents portent des souliers fermés. Et on installe des barres dans la salle de bain.", "Camila"], ["P", "Super. Moi, je vais faire la dernière partie : le rôle de l'infirmière. Et je vais préparer les diapositives.", "Sarah"], ["S", "On se donne quelle date pour finir nos parties ?", "Maxime"], ["S", "La présentation est le quinze mars. Si on finit le premier mars, on aura deux semaines pour pratiquer.", "Camila"], ["P", "D'accord. On pourrait se rencontrer à la bibliothèque le premier mars, après le cours ?", "Sarah"], ["S", "Ça me va. Mais moi, je travaille le soir. On pourrait faire ça à midi plutôt ?", "Maxime"], ["S", "Midi, c'est parfait pour moi aussi.", "Camila"], ["P", "Alors, c'est réglé : le premier mars, à midi, à la bibliothèque. Je crée un groupe de discussion pour qu'on puisse s'écrire.", "Sarah"], ["S", "Et on partage un document en ligne, comme ça, tout le monde peut voir le travail des autres.", "Maxime"], ["S", "Excellent. Je suis contente d'être dans votre équipe !", "Camila"]], "words": 227, "kind": "story", "scene": "The group project. Camila meets her two teammates to plan their group project.", "F": "Making suggestions, on pourrait, dividing tasks", "V": "la prévention des chutes (fall prevention); s'organiser (to get organized); on pourrait (we could); des mesures (measures); les diapositives (slides); Ça me va. (That works for me.); plutôt (instead); C'est réglé. (It's settled.)", "t": [[1.99, 8.52], [8.74, 11.3], [11.95, 14.9], [15.12, 17.09], [17.74, 19.61], [19.82, 24.72], [24.94, 28.49], [29.14, 31.01], [31.22, 36.17], [36.38, 39.74], [39.96, 43.15], [43.8, 45.77], [45.98, 50.66], [50.88, 53.5], [54.14, 56.14], [56.35, 61.68], [61.9, 65.11], [65.76, 69.29], [69.94, 72.46], [72.67, 76.75], [77.4, 79.32], [79.54, 85.08], [85.73, 87.6], [87.82, 90.96], [91.18, 94.13], [94.78, 97.32], [97.97, 104.02], [104.23, 108.55], [109.2, 115.7], [116.35, 118.22], [118.44, 121.27]], "R": []}, {"num": 48, "title": "La cabane à sucre", "lines": [["P", "Lucas, je te présente mon amie Camila. Elle vient du Brésil, comme toi !", "Catherine"], ["S", "Ah oui ? Enchanté, Camila ! Tu viens de quelle ville ?", "Lucas"], ["S", "De São Paulo. Et toi ?", "Camila"], ["S", "De Belo Horizonte. C'est ta première cabane à sucre ?", "Lucas"], ["S", "Oui. Catherine m'a dit que c'est une tradition très importante au printemps.", "Camila"], ["P", "Exactement. Au printemps, quand il fait froid la nuit et doux le jour, la sève coule dans les érables. On la fait bouillir pendant des heures, et ça donne le sirop d'érable.", "Catherine"], ["S", "Il faut combien de sève pour faire du sirop ?", "Lucas"], ["P", "Environ quarante litres de sève pour un litre de sirop.", "Catherine"], ["S", "Quarante litres ! C'est pour ça que c'est cher.", "Camila"], ["P", "Oui ! Bon, venez, le repas est servi. Il y a de la soupe aux pois, des fèves au lard, du jambon, des œufs, des patates et des crêpes. Et on met du sirop d'érable sur tout !", "Catherine"], ["S", "Sur tout ? Même sur le jambon ?", "Lucas"], ["P", "Même sur le jambon. Goûte, tu vas voir.", "Catherine"], ["S", "Hum, c'est sucré et salé en même temps. C'est vraiment bon !", "Camila"], ["P", "Et pour finir, on va dehors pour la tire sur la neige. On verse du sirop chaud sur la neige, et on le roule sur un bâton.", "Catherine"], ["S", "Je n'ai jamais mangé autant de sucre de ma vie !", "Lucas"], ["S", "Moi non plus. Mais je veux revenir l'année prochaine !", "Camila"]], "words": 214, "kind": "story", "scene": "The sugar shack. In April, Catherine takes Lucas and her friend Camila to a sugar shack.", "F": "Food, traditions, explaining customs", "V": "une cabane à sucre (a sugar shack); doux (mild); la sève (the sap); un érable (a maple tree); faire bouillir (to boil); les fèves au lard (baked beans (Québec)); les patates (potatoes (Québec)); la tire sur la neige (maple taffy on snow); verser (to pour)", "t": [[1.99, 5.78], [6.0, 9.29], [9.94, 11.81], [12.02, 14.69], [14.9, 17.16], [17.81, 19.68], [19.9, 21.77], [22.42, 24.82], [25.03, 27.65], [28.3, 28.94], [29.16, 33.07], [33.72, 35.76], [35.98, 41.9], [42.12, 46.92], [47.57, 50.83], [51.48, 55.7], [56.35, 58.22], [58.44, 60.31], [60.96, 62.83], [63.05, 66.62], [66.84, 73.73], [73.94, 77.09], [77.74, 79.61], [79.82, 82.03], [82.68, 85.03], [85.25, 87.94], [88.58, 91.58], [91.8, 93.67], [94.32, 98.76], [98.98, 103.75], [104.4, 108.14], [108.79, 110.66], [110.88, 113.3]], "R": []}, {"num": 49, "title": "Le camping", "lines": [["P", "Bonjour, bienvenue au parc national ! Vous avez une réservation ?", "Le préposé"], ["S", "Bonjour. Oui, au nom d'Oliveira, pour deux nuits.", "Lucas"], ["P", "Voyons. Oui, emplacement numéro dix-sept, dans le secteur du lac. Vous êtes combien ?", "Le préposé"], ["S", "Nous sommes deux, avec une tente.", "Lucas"], ["P", "Parfait. Voici votre permis. Mettez-le sur le tableau de bord de votre voiture. L'emplacement dix-sept est à cinq minutes, au bout du chemin, à droite.", "Le préposé"], ["S", "Merci. Est-ce qu'on peut faire un feu de camp ?", "Lucas"], ["P", "Oui, mais seulement dans le foyer de votre emplacement. Vous pouvez acheter du bois ici. Il est interdit d'apporter du bois de l'extérieur, à cause des insectes qui peuvent tuer les arbres.", "Le préposé"], ["S", "Ah, je ne savais pas. On va acheter du bois ici, alors.", "Lucas"], ["P", "Autre chose importante : il y a des ours noirs dans le parc. Ne laissez jamais de nourriture dans votre tente. La nuit, mettez toute votre nourriture dans votre voiture.", "Le préposé"], ["S", "Des ours ! Est-ce qu'ils sont dangereux ?", "Lucas"], ["P", "En général, ils ont peur des humains. Mais ils sont attirés par la nourriture. Si vous en voyez un, ne courez pas. Parlez fort et reculez lentement.", "Le préposé"], ["S", "D'accord. Et le silence, c'est à partir de quelle heure ?", "Lucas"], ["P", "De vingt-trois heures à sept heures. Les toilettes et les douches sont près de l'emplacement douze. Et si vous voulez faire du canot, la location ouvre à huit heures.", "Le préposé"], ["S", "Parfait. Merci beaucoup !", "Lucas"], ["P", "Bon séjour, et attention aux maringouins !", "Le préposé"]], "words": 224, "kind": "story", "scene": "Camping. Lucas arrives at a campground in a national park and checks in.", "F": "Equipment, rules, the park's instructions", "V": "un emplacement (a campsite); le tableau de bord (the dashboard); un feu de camp (a campfire); le foyer (the fire pit); un ours noir (a black bear); reculer (to back away); faire du canot (to go canoeing); les maringouins (mosquitoes (Québec))", "t": [[1.99, 6.38], [6.6, 9.17], [9.82, 11.69], [11.9, 15.6], [16.25, 18.12], [18.34, 23.83], [24.05, 26.06], [26.71, 29.74], [30.38, 32.26], [32.47, 35.04], [35.26, 39.74], [39.96, 46.13], [46.78, 48.65], [48.86, 51.46], [52.1, 56.59], [56.81, 60.07], [60.29, 67.66], [68.3, 70.78], [70.99, 74.62], [75.26, 80.59], [80.81, 84.82], [85.03, 90.12], [90.77, 92.64], [92.86, 95.11], [95.76, 99.65], [99.86, 103.58], [103.8, 107.64], [107.86, 111.22], [111.86, 113.74], [113.95, 117.53], [118.18, 121.44], [121.66, 126.5], [126.72, 132.38], [133.03, 134.9], [135.12, 137.23], [137.88, 142.1]], "R": []}, {"num": 50, "title": "Une journée de ski", "lines": [["P", "Bonjour ! Bienvenue à la station. Je peux vous aider ?", "L'employée"], ["S", "Bonjour. C'est la première fois que je fais du ski. Je voudrais louer l'équipement et prendre un cours.", "Lucas"], ["P", "Excellent choix ! Pour la location, il vous faut des skis, des bottes, des bâtons et un casque. Vous chaussez quelle pointure ?", "L'employée"], ["S", "Du dix.", "Lucas"], ["P", "Et vous mesurez combien ?", "L'employée"], ["S", "Un mètre soixante-dix-huit.", "Lucas"], ["P", "Parfait. Pour un débutant, on va vous donner des skis courts. C'est plus facile pour tourner. L'équipement complet coûte cinquante-cinq dollars pour la journée.", "L'employée"], ["S", "D'accord. Et le cours ?", "Lucas"], ["P", "Nous avons des cours de groupe pour débutants à dix heures et à treize heures. Ils durent deux heures. Ou bien, un cours privé d'une heure.", "L'employée"], ["S", "Je pense que le cours de groupe à dix heures, c'est bien. Il y aura combien de personnes ?", "Lucas"], ["P", "Maximum six personnes. Le moniteur va vous apprendre à vous arrêter, à tourner et à prendre le remonte-pente.", "L'employée"], ["S", "Est-ce que je dois acheter un billet pour les remontées ?", "Lucas"], ["P", "Pour le cours, vous restez sur la piste des débutants, et l'accès est inclus. Si vous voulez aller sur les autres pistes après, il faut un billet de journée.", "L'employée"], ["S", "On verra après le cours ! Il fait très froid aujourd'hui. Vous avez un conseil ?", "Lucas"], ["P", "Portez plusieurs couches, et n'oubliez pas vos lunettes de ski et votre cache-cou. Et pre
