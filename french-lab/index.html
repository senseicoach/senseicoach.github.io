nez une pause au chalet pour boire un chocolat chaud !", "L'employée"]], "words": 224, "kind": "story", "scene": "A day of skiing. Lucas rents ski equipment and signs up for a lesson at a ski resort.", "F": "Sizes, levels, prices, advice", "V": "la station (the ski resort); les bâtons (the poles); mesurer (to be (a height)); un débutant (a beginner); le moniteur (the instructor); le remonte-pente (the ski lift); la piste (the slope, the run); un cache-cou (a neck warmer (Québec))", "t": [[1.99, 3.86], [4.08, 6.58], [6.79, 8.93], [9.58, 11.45], [11.66, 14.71], [14.93, 18.67], [19.32, 21.46], [21.67, 27.55], [27.77, 30.41], [31.06, 32.93], [33.58, 35.95], [36.6, 39.24], [39.89, 41.76], [41.98, 45.98], [46.2, 48.96], [49.18, 53.52], [54.17, 56.04], [56.26, 58.13], [58.78, 63.79], [64.01, 66.41], [66.62, 69.96], [70.61, 74.71], [74.93, 77.5], [78.14, 80.78], [81.0, 86.93], [87.58, 91.03], [91.68, 97.25], [97.46, 102.7], [103.34, 105.86], [106.08, 108.89], [109.1, 111.34], [111.98, 117.36], [117.58, 121.49]], "R": []}, {"num": 51, "title": "La randonnée", "lines": [["P", "Regarde la carte, Camila. Il y a trois sentiers. Le premier fait trois kilomètres, autour du lac. Il est facile.", "Lucas"], ["S", "Et les autres ?", "Camila"], ["P", "Le deuxième fait huit kilomètres. Il monte jusqu'au sommet de la montagne. Il est intermédiaire. Le troisième fait quinze kilomètres, et il est difficile.", "Lucas"], ["S", "Quinze kilomètres, c'est trop pour moi. Mais je voudrais voir la vue du sommet. Les couleurs de l'automne sont magnifiques en ce moment.", "Camila"], ["P", "D'accord, on prend le deuxième. Selon la carte, ça prend environ trois heures et demie, aller-retour.", "Lucas"], ["S", "Il est déjà onze heures. Le soleil se couche vers dix-huit heures en octobre, non ?", "Camila"], ["P", "Oui, on a le temps. Mais on ne doit pas traîner. Tu as assez d'eau ?", "Lucas"], ["S", "J'ai deux bouteilles. Et j'ai apporté des sandwichs, des noix et des fruits.", "Camila"], ["P", "Parfait. Moi, j'ai un chandail chaud et un imperméable. Il peut faire beaucoup plus froid au sommet.", "Lucas"], ["S", "Est-ce qu'il y a du réseau pour le cellulaire ?", "Camila"], ["P", "Pas partout. C'est pour ça qu'on a écrit à l'accueil du parc quel sentier on va prendre. Si on ne revient pas, ils vont savoir où nous chercher.", "Lucas"], ["S", "Tu es très prudent ! Au Brésil, je faisais des randonnées, mais jamais dans le froid.", "Camila"], ["P", "Moi non plus. Allez, on y va ! Et on reste sur le sentier balisé.", "Lucas"], ["S", "D'accord, chef ! On prendra une photo au sommet.", "Camila"]], "words": 220, "kind": "story", "scene": "The hike. Lucas and Camila choose a trail for a hike in the fall.", "F": "Giving advice, distances, preferences", "V": "un sentier (a trail); le sommet (the summit); aller-retour (there and back); se coucher (le soleil) (to set (the sun)); traîner (to dawdle); un chandail (a sweater (Québec)); du réseau (cell signal); un sentier balisé (a marked trail)", "t": [[1.99, 5.02], [5.23, 7.66], [7.87, 11.69], [11.9, 13.94], [14.59, 16.46], [17.11, 20.06], [20.28, 23.45], [23.66, 26.09], [26.3, 30.55], [31.2, 33.77], [33.98, 36.46], [36.67, 39.67], [40.32, 43.27], [43.49, 48.82], [49.46, 51.34], [51.55, 55.08], [55.73, 58.03], [58.25, 60.67], [60.89, 62.78], [63.43, 65.3], [65.52, 68.93], [69.58, 71.45], [71.66, 75.72], [75.94, 79.22], [79.87, 82.46], [83.11, 84.98], [85.2, 90.1], [90.31, 94.49], [95.14, 97.01], [97.22, 101.3], [101.95, 103.82], [104.04, 106.46], [106.68, 109.75], [110.4, 112.27], [112.49, 114.65]], "R": []}, {"num": 52, "title": "Le chef commande", "lines": [["P", "Fruits et légumes Lachance, bonjour !", "Mme Lachance"], ["S", "Bonjour, Mme Lachance. C'est Benoît, du restaurant Le Vieux-Port. Je voudrais passer ma commande pour demain.", "Chef Benoît"], ["P", "Bonjour, chef ! Allez-y, je vous écoute.", "Mme Lachance"], ["S", "Alors, vingt kilos de pommes de terre, dix kilos d'oignons jaunes et cinq kilos de carottes.", "Chef Benoît"], ["P", "Vingt, dix et cinq. C'est noté. Ensuite ?", "Mme Lachance"], ["S", "Six caisses de tomates, trois caisses de laitue romaine et deux kilos de champignons.", "Chef Benoît"], ["P", "Pour les champignons, j'ai un problème. Je n'ai plus de champignons blancs. J'ai des pleurotes, du Québec. Ça vous va ?", "Mme Lachance"], ["S", "Des pleurotes ? Oui, c'est parfait pour mon plat du jour. Mais à quel prix ?", "Chef Benoît"], ["P", "Un peu plus cher : douze dollars le kilo, au lieu de huit.", "Mme Lachance"], ["S", "D'accord. Mettez-en deux kilos. Et pour les fruits, quatre caisses de pommes et deux caisses de citrons.", "Chef Benoît"], ["P", "Les pommes, ce sont des Cortland, du Québec. Elles sont excellentes en ce moment.", "Mme Lachance"], ["S", "Parfait, c'est pour ma tarte aux pommes. Et j'aimerais aussi des fines herbes : du persil, de la coriandre et du thym. Dix bottes de chaque.", "Chef Benoît"], ["P", "Très bien. Je relis la commande. Vingt kilos de patates, dix kilos d'oignons, cinq kilos de carottes, six caisses de tomates, trois caisses de laitue, deux kilos de pleurotes, quatre caisses de pommes, deux caisses de citrons et dix bottes de persil, de coriandre et de thym.", "Mme Lachance"], ["S", "C'est ça. Vous pouvez livrer avant neuf heures ?", "Chef Benoît"], ["P", "Oui, le camion passe chez vous vers huit heures et demie. Bonne journée, chef !", "Mme Lachance"]], "words": 235, "kind": "story", "scene": "The chef places an order. The chef of a restaurant in Old Montréal calls his produce supplier.", "F": "Quantities, substitutions, delivery times", "V": "passer une commande (to place an order); une caisse (a crate, a case); je n'ai plus de… (I'm out of…); des pleurotes (oyster mushrooms); au lieu de (instead of); les fines herbes (fresh herbs); une botte (a bunch); livrer (to deliver)", "t": [[1.99, 5.54], [6.19, 9.94], [10.15, 14.28], [14.5, 18.14], [18.79, 21.53], [21.74, 24.6], [25.25, 33.0], [33.65, 36.22], [36.43, 38.33], [38.54, 40.42], [41.06, 47.71], [48.36, 51.7], [51.91, 54.62], [54.84, 57.98], [58.2, 60.07], [60.72, 62.62], [62.83, 66.86], [67.08, 69.14], [69.79, 74.47], [75.12, 77.09], [77.3, 79.9], [80.11, 85.61], [86.26, 90.58], [90.79, 93.72], [94.37, 98.06], [98.28, 104.47], [104.69, 107.18], [107.83, 109.7], [109.92, 112.34], [112.56, 127.08], [127.73, 129.6], [129.82, 132.65], [133.3, 137.21], [137.42, 140.16]], "R": []}, {"num": 53, "title": "Le souper chez des amis", "lines": [["P", "Bienvenue, Lucas ! Entre, entre. Donne-moi ton manteau. Ici, on se tutoie, hein !", "M. Tremblay"], ["S", "Merci, monsieur Tremblay. J'ai apporté une bouteille de vin et des brigadeiros. Ce sont des petits chocolats brésiliens.", "Lucas"], ["P", "Ah, c'est gentil ! Appelle-moi Gilles. Catherine nous a beaucoup parlé de toi.", "M. Tremblay"], ["S", "Papa a fait sa spécialité ce soir : le pâté chinois.", "Catherine"], ["S", "Le pâté chinois ? C'est un plat chinois ?", "Lucas"], ["P", "Non, pas du tout ! C'est très québécois. Il y a du bœuf haché, du maïs en crème et des patates pilées. On ne sait pas vraiment pourquoi on l'appelle comme ça.", "M. Tremblay"], ["S", "Hum, c'est délicieux ! Est-ce que je peux avoir la recette ?", "Lucas"], ["P", "Bien sûr. C'était la recette de ma mère. Et toi, Lucas, qu'est-ce qu'on mange au Brésil le dimanche ?", "M. Tremblay"], ["S", "Chez moi, à Belo Horizonte, on mange souvent du feijão tropeiro. Ce sont des haricots avec de la farine de manioc et du lard. Et toujours avec du riz.", "Lucas"], ["S", "Tu devrais nous en faire un jour !", "Catherine"], ["S", "Avec plaisir. Il faut juste que je trouve tous les ingrédients ici.", "Lucas"], ["P", "Et comment tu trouves le Québec, après un an ?", "M. Tremblay"], ["S", "J'aime beaucoup la vie ici. Les gens sont gentils, et j'ai de bons amis. Mais l'hiver est long !", "Lucas"], ["P", "Ça, c'est vrai pour tout le monde ! Bon, qui veut du dessert ? J'ai fait un pouding chômeur.", "M. Tremblay"], ["S", "Un pouding chômeur ? Il faut absolument que vous m'expliquiez ce nom !", "Lucas"]], "words": 221, "kind": "story", "scene": "Dinner at friends'. Catherine invites Lucas to Sunday supper with her parents.", "F": "Compliments, table talk, polite questions", "V": "Entre ! (Come in!); Appelle-moi… (Call me…); le pâté chinois (shepherd's pie (Québec)); le bœuf haché (ground beef); le maïs en crème (creamed corn); les patates pilées (mashed potatoes (Québec)); la recette (the recipe); le pouding chômeur (a Québec cake baked in syrup)", "t": [[1.99, 4.49], [4.7, 7.06], [7.27, 9.6], [9.82, 12.89], [13.54, 16.39], [16.61, 20.45], [20.66, 23.86], [24.5, 26.95], [27.17, 29.4], [29.62, 32.71], [33.36, 37.94], [38.59, 40.66], [40.87, 43.01], [43.66, 45.98], [46.2, 48.41], [48.62, 53.23], [53.45, 57.12], [57.77, 60.31], [60.53, 63.29], [63.94, 65.93], [66.14, 69.05], [69.26, 74.04], [74.69, 79.87], [80.09, 84.6], [84.82, 87.22], [87.86, 90.77], [91.42, 93.48], [93.7, 97.7], [98.35, 101.98], [102.62, 105.29], [105.5, 109.18], [109.39, 111.55], [112.2, 115.34], [115.56, 118.46], [118.68, 121.42], [122.06, 124.32], [124.54, 128.06]], "R": []}, {"num": 54, "title": "La garderie", "lines": [["P", "CPE Les Petits Bourgeons, bonjour.", "La directrice"], ["S", "Bonjour, madame. Je m'appelle Élodie Martin. Je vous appelle pour savoir si vous avez une place pour ma fille.", "Élodie"], ["P", "Quel âge a votre fille ?", "La directrice"], ["S", "Elle s'appelle Chloé, et elle a dix-huit mois. Je retourne au travail à temps plein en septembre.", "Élodie"], ["P", "Je comprends. Malheureusement, nous n'avons pas de place pour le moment. Les places sont attribuées par la liste d'attente provinciale, La Place 0-5. Vous êtes inscrite ?", "La directrice"], ["S", "Oui, je l'ai inscrite quand elle avait trois mois. Mais je n'ai toujours pas de réponse.", "Élodie"], ["P", "C'est malheureusement très courant. Il manque de places dans le quartier. Avez-vous choisi plusieurs garderies sur la liste ?", "La directrice"], ["S", "J'ai choisi trois garderies, près de chez moi.", "Élodie"], ["P", "Je vous conseille d'en ajouter d'autres, peut-être près de votre travail. Ça augmente vos chances.", "La directrice"], ["S", "Bonne idée. Et si je n'ai pas de place en septembre, qu'est-ce que je peux faire ?", "Élodie"], ["P", "Il y a aussi des garderies privées. Elles sont plus chères, mais une partie des frais est remboursée par un crédit d'impôt.", "La directrice"], ["S", "D'accord. Et chez vous, quelles sont les heures d'ouverture ?", "Élodie"], ["P", "Nous sommes ouverts de sept heures à dix-huit heures, du lundi au vendredi. Les repas et les collations sont inclus.", "La directrice"], ["S", "Merci beaucoup pour toutes ces informations, madame.", "Élodie"], ["P", "Je vous en prie. Bonne chance, et n'hésitez pas à rappeler dans quelques mois.", "La directrice"]], "words": 217, "kind": "story", "scene": "Daycare. Élodie phones a daycare centre about a spot for her daughter.", "F": "Waiting lists, schedules, asking for information", "V": "une garderie, un CPE (a daycare, a public daycare centre (Québec)); une place (a spot); la liste d'attente (the waiting list); attribuer (to assign); il manque de… (there aren't enough…); augmenter ses chances (to improve your chances); un crédit d'impôt (a tax credit); les collations (snacks)", "t": [[1.99, 5.62], [6.26, 9.07], [9.29, 11.95], [12.17, 16.63], [17.28, 19.78], [20.42, 23.93], [24.14, 27.94], [28.58, 30.55], [30.77, 34.85], [35.06, 40.99], [41.21, 43.51], [44.16, 48.0], [48.22, 51.19], [51.84, 54.6], [54.82, 57.74], [57.96, 61.78], [62.42, 66.22], [66.86, 72.07], [72.29, 74.9], [75.55, 77.42], [77.64, 81.96], [82.61, 85.68], [85.9, 91.39], [92.04, 93.91], [94.13, 97.56], [98.21, 103.32], [103.54, 106.75], [107.4, 111.65], [112.3, 114.31], [114.53, 118.94]], "R": []}, {"num": 55, "title": "Le service à la clientèle", "lines": [["P", "Bonjour, vous êtes au service à la clientèle. Mon nom est Alexandre. Puis-je avoir votre numéro de compte ?", "L'agent"], ["S", "Bonjour, Alexandre. Oui, c'est le quatre, sept, deux, huit, zéro, un, six.", "Lucas"], ["P", "Merci, monsieur Oliveira. Comment puis-je vous aider aujourd'hui ?", "L'agent"], ["S", "J'ai reçu ma facture ce matin, et je pense qu'il y a une erreur. D'habitude, je paie soixante dollars par mois. Mais ce mois-ci, la facture est de quatre-vingt-quinze dollars.", "Lucas"], ["P", "Je regarde ça. Ah, je vois. Il y a des frais de trente-cinq dollars pour la location d'un deuxième modem.", "L'agent"], ["S", "Un deuxième modem ? Je n'ai qu'un seul modem. Je n'ai jamais demandé un deuxième appareil.", "Lucas"], ["P", "Vous avez raison. Selon votre dossier, le technicien est venu en mars pour changer votre modem. Il a ajouté le nouveau, mais il n'a pas retiré l'ancien de votre compte.", "L'agent"], ["S", "Alors, j'ai payé ces frais depuis mars ?", "Lucas"], ["P", "Non, seulement ce mois-ci. Je suis désolé pour l'erreur. Je vais retirer les frais, et vous allez recevoir un crédit de trente-cinq dollars sur votre prochaine facture.", "L'agent"], ["S", "Merci. Est-ce que je dois payer quatre-vingt-quinze ou soixante dollars cette fois-ci ?", "Lucas"], ["P", "Vous pouvez payer seulement soixante dollars. J'ai mis une note dans votre dossier. Pour vous excuser du dérangement, je vous offre aussi un mois de vitesse supérieure, gratuitement.", "L'agent"], ["S", "C'est gentil, merci. Est-ce que je peux avoir un numéro de référence ?", "Lucas"], ["P", "Bien sûr. C'est le C, trois, neuf, cinq, deux. Vous allez aussi recevoir une confirmation par courriel.", "L'agent"], ["S", "Parfait. Merci beaucoup pour votre aide, Alexandre.", "Lucas"], ["P", "Avec plaisir. Est-ce que je peux faire autre chose pour vous ? Non ? Alors, bonne fin de journée !", "L'agent"]], "words": 260, "kind": "story", "scene": "Customer service. Lucas calls his internet provider about a mistake on his bill.", "F": "Explaining a problem, complaining politely", "V": "le numéro de compte (the account number); d'habitude (usually); des frais (charges, fees); un appareil (a device); retirer (to remove); un crédit (a credit); le dérangement (the trouble, the inconvenience); un numéro de référence (a reference number)", "t": [[1.99, 6.12], [6.34, 8.93], [9.14, 12.5], [13.15, 16.1], [16.32, 22.54], [23.18, 26.35], [26.57, 29.52], [30.17, 34.94], [35.16, 38.81], [39.02, 43.42], [44.06, 46.2], [46.42, 48.72], [48.94, 54.17], [54.82, 56.98], [57.19, 59.76], [59.98, 63.5], [64.15, 66.26], [66.48, 72.43], [72.65, 77.88], [78.53, 82.08], [82.73, 85.46], [85.68, 88.51], [88.73, 96.0], [96.65, 98.52], [98.74, 103.3], [103.94, 107.54], [107.76, 110.83], [111.05, 117.7], [118.34, 121.06], [121.27, 124.68], [125.33, 127.32], [127.54, 131.88], [132.1, 136.44], [137.09, 138.96], [139.18, 142.92], [143.57, 145.8], [146.02, 149.18], [149.4, 151.27], [151.49, 154.54]], "R": []}, {"num": 56, "title": "Trois messages vocaux", "lines": [["P", "Bonjour, ce message est pour Lucas Oliveira. Ici Sophie, de la Clinique dentaire Beaubien. Je vous appelle pour confirmer votre rendez-vous de nettoyage, le mardi dix-huit novembre, à quatorze heures trente, avec la Dre Nguyen. Si vous devez annuler, merci de nous appeler au moins vingt-quatre heures à l'avance, sinon il y a des frais de cinquante dollars. Notre numéro est le cinq, un, quatre, cinq, cinq, cinq, deux, trois, quatre, zéro. Bonne journée !", "La réceptionniste"], ["S", "Allô, Lucas, c'est Mme Gagnon. Je voulais vous avertir qu'un plombier va venir vérifier le chauffe-eau de l'immeuble jeudi matin, entre huit heures et midi. Il doit entrer dans votre appartement, parce que la valve est dans votre cuisine. Si vous n'êtes pas là, je vais ouvrir avec ma clé. Rappelez-moi si ce n'est pas correct. Merci, bonne soirée !", "Mme Gagnon"], ["S", "Salut, Lucas, c'est Stéphane, ton voisin d'en bas. Écoute, je fais un barbecue samedi soir, vers dix-huit heures, dans la cour. Il y aura quelques collègues de l'hôpital. Si tu veux venir, apporte juste ta bonne humeur. Ah, et peut-être tes fameux brigadeiros ! Texte-moi pour me dire si tu viens. À plus !", "Stéphane"]], "words": 185, "kind": "story", "scene": "Three voicemails. Lucas listens to three voicemails: from his dentist's office, his landlord and his neighbour.", "F": "Catching key details: dates, times, numbers", "V": "un message vocal (a voicemail); le nettoyage (the cleaning); à l'avance (in advance); sinon (otherwise); avertir (to let someone know); un plombier (a plumber); le chauffe-eau (the water heater); la cour (the backyard); texter (to text (Québec))", "t": [[1.99, 5.88], [6.1, 9.91], [10.13, 18.62], [18.84, 26.09], [26.3, 34.66], [34.87, 36.91], [37.56, 41.11], [41.33, 48.91], [49.13, 54.53], [54.74, 58.63], [58.85, 61.9], [62.11, 64.85], [65.5, 70.18], [70.39, 76.44], [76.66, 80.09], [80.3, 84.48], [84.7, 88.39], [88.61, 91.68], [91.9, 93.77]], "R": []}, {"num": 57, "title": "Annonce dans le métro", "lines": [["P", "Votre attention, s'il vous plaît. En raison d'une panne de train, le service est interrompu sur la ligne orange, entre les stations Jean-Talon et Berri-UQAM. La reprise du service est prévue vers huit heures quarante-cinq. Des autobus navettes sont disponibles à la sortie de la station. Nous nous excusons des inconvénients.", "L'annonce"], ["S", "Excusez-moi, madame. Vous avez compris l'annonce ? Il y avait beaucoup de bruit.", "Lucas"], ["S", "Oui. Il y a une panne entre Jean-Talon et Berri-UQAM. Le métro ne passe pas avant huit heures quarante-cinq.", "La passagère"], ["S", "Ah non ! Je dois être au centre-ville à huit heures et demie pour une réunion. Qu'est-ce que je peux faire ?", "Lucas"], ["S", "Il y a des autobus navettes. Ils font le même trajet que le métro, mais avec la circulation, c'est beaucoup plus long.", "La passagère"], ["S", "Est-ce qu'il y a une autre solution ?", "Lucas"], ["S", "Vous pourriez prendre l'autobus sur la rue Saint-Denis. Il va directement au centre-ville. L'arrêt est à deux coins de rue d'ici.", "La passagère"], ["S", "C'est une bonne idée. Je vais aussi écrire à mon patron pour lui dire que je vais être en retard.", "Lucas"], ["S", "Ça arrive souvent l'hiver, malheureusement. Je vous conseille de télécharger l'application de la STM. Elle vous avertit quand il y a une panne.", "La passagère"], ["S", "Merci beaucoup pour votre aide. Bonne journée !", "Lucas"], ["P", "Votre attention, s'il vous plaît. Le service reprend graduellement sur la ligne orange. Merci de votre patience.", "L'annonce"]], "words": 219, "kind": "story", "scene": "A métro announcement. On his way to work, Lucas hears an announcement about a service interruption.", "F": "Announcements, alternatives, asking for help", "V": "en raison de (because of); une panne (a breakdown); interrompu (interrupted); la reprise du service (the return of service); un autobus navette (a shuttle bus); le trajet (the route); à deux coins de rue (two blocks away); télécharger (to download); graduellement (gradually)", "t": [[1.99, 5.3], [5.52, 15.38], [15.6, 20.76], [20.98, 26.02], [26.23, 29.45], [30.1, 32.81], [33.02, 35.59], [35.81, 38.38], [39.02, 40.9], [41.11, 44.83], [45.05, 48.89], [49.54, 51.41], [51.62, 56.18], [56.4, 58.73], [59.38, 62.28], [62.5, 68.47], [69.12, 71.93], [72.58, 76.39], [76.61, 79.73], [79.94, 82.97], [83.62, 85.8], [86.02, 91.18], [91.82, 95.42], [95.64, 100.08], [100.3, 103.54], [104.18, 106.94], [107.16, 109.1], [109.75, 113.06], [113.28, 117.89], [118.1, 121.25]], "R": []}, {"num": 58, "title": "Le bénévolat", "lines": [["P", "Bonjour, Lucas ! Merci d'être venu. Je m'appelle Marie-Ève, je suis la coordonnatrice des bénévoles. C'est ta première fois dans une banque alimentaire ?", "Marie-Ève"], ["S", "Oui. Je voulais faire quelque chose pour la communauté, et je pense que c'est aussi une bonne façon de pratiquer mon français.", "Lucas"], ["P", "Excellente idée ! Aujourd'hui, tu vas travailler au tri. On reçoit des dons de nourriture, et il faut vérifier les dates d'expiration et classer les produits.", "Marie-Ève"], ["S", "D'accord. Qu'est-ce que je fais avec les produits expirés ?", "Lucas"], ["P", "Tu les mets dans le bac gris, là-bas. Les conserves vont sur la première tablette, les pâtes et le riz sur la deuxième, et les céréales sur la troisième. Karim va te montrer.", "Marie-Ève"], ["S", "Salut, Lucas ! Bienvenue dans l'équipe. Je fais du bénévolat ici depuis deux ans. Tu vas voir, c'est simple, et l'ambiance est bonne.", "Karim"], ["S", "Salut, Karim. Tu viens chaque semaine ?", "Lucas"], ["S", "Oui, tous les samedis matin. Moi aussi, je suis arrivé au Québec il y a quelques années. Je viens du Maroc. Le bénévolat m'a beaucoup aidé à rencontrer des gens.", "Karim"], ["S", "C'est exactement ce que je cherche. Au travail, tout le monde est gentil, mais c'est difficile de se faire des amis.", "Lucas"], ["S", "Je comprends. Ici, on dîne souvent ensemble après notre quart de travail. Tu pourras te joindre à nous.", "Karim"], ["P", "Et à quatorze heures, on a besoin de deux personnes pour la distribution des paniers. Vous êtes disponibles ?", "Marie-Ève"], ["S", "Oui, je reste jusqu'à seize heures.", "Lucas"], ["S", "Moi aussi. Allez, Lucas, on commence par les conserves !", "Karim"]], "words": 241, "kind": "story", "scene": "Volunteering. Lucas does his first shift at a food bank and meets another volunteer.", "F": "Following instructions, making friends", "V": "un bénévole, le bénévolat (a volunteer, volunteering); une banque alimentaire (a food bank); le tri (sorting); des dons (donations); la date d'expiration (the expiry date); une tablette (a shelf (Québec)); se faire des amis (to make friends); un quart de travail (a shift); un panier (a food basket)", "t": [[1.99, 4.66], [4.87, 7.3], [7.51, 12.46], [12.67, 16.37], [17.02, 18.89], [19.1, 26.16], [26.81, 29.06], [29.28, 32.52], [32.74, 39.29], [39.94, 41.81], [42.02, 45.1], [45.74, 49.03], [49.25, 56.95], [57.17, 59.54], [60.19, 62.69], [62.9, 65.33], [65.54, 69.14], [69.36, 73.7], [74.35, 76.82], [77.04, 79.39], [80.04, 82.85], [83.06, 87.7], [87.91, 90.29], [90.5, 94.46], [95.11, 98.02], [98.23, 103.44], [104.09, 105.98], [106.2, 111.07], [111.29, 113.86], [114.5, 120.31], [120.53, 122.86], [123.5, 126.82], [127.46, 129.34], [129.55, 133.66]], "R": []}, {"num": 59, "title": "Une réservation et une plainte", "lines": [["P", "Bonsoir. J'ai une réservation pour deux personnes à dix-neuf heures, au nom de Souza.", "Camila"], ["S", "Bonsoir, madame. Souza ? Je suis désolé, je ne trouve pas votre nom dans le système. Vous avez réservé en ligne ?", "Le gérant"], ["P", "Non, j'ai appelé lundi. J'ai parlé avec une femme. J'ai même précisé que c'était pour un anniversaire.", "Camila"], ["S", "Je suis vraiment désolé. Il y a eu une erreur de notre côté. Nous sommes complets ce soir, mais je peux vous trouver une table dans quinze minutes, si vous voulez attendre au bar.", "Le gérant"], ["P", "D'accord, on va attendre.", "Camila"], ["S", "Excusez-moi, madame, vous vouliez me parler ?", "Le gérant"], ["P", "Oui. Je suis désolée de vous déranger encore, mais il y a un problème avec le plat de mon ami. Il a commandé le poisson, et on lui a apporté le poulet. Et mon plat est froid.", "Camila"], ["S", "Oh, je m'excuse. Ce soir, nous manquons de personnel, mais ce n'est pas une excuse. Je vais faire préparer le poisson tout de suite, et je vais demander au chef de refaire votre plat.", "Le gérant"], ["P", "Merci. Vous comprenez, c'est l'anniversaire de mon ami, et nous avons déjà attendu longtemps.", "Camila"], ["S", "Je comprends tout à fait. Pour nous faire pardonner, les desserts sont offerts par la maison. Et je vais retirer les deux plats de l'addition.", "Le gérant"], ["P", "C'est très gentil. Merci de votre compréhension.", "Camila"], ["S", "Et pour l'anniversaire, est-ce que je peux apporter une bougie sur le gâteau ?", "Le gérant"], ["P", "Oui, bonne idée ! Il va être surpris.", "Camila"], ["S", "Parfait. Encore une fois, toutes nos excuses. Je vous souhaite une belle fin de soirée.", "Le gérant"]], "words": 247, "kind": "story", "scene": "A booking and a complaint. Camila takes Lucas out for his birthday, but the dinner doesn't go as planned.", "F": "Reservations, complaints, polite firmness", "V": "préciser (to specify); de notre côté (on our end); complet (fully booked); déranger (to bother); manquer de personnel (to be short-staffed); se faire pardonner (to make up for it); offert par la maison (on the house); une bougie (a candle)", "t": [[1.99, 3.86], [4.08, 8.52], [9.17, 12.24], [12.46, 14.33], [14.54, 19.75], [19.97, 22.66], [23.3, 25.46], [25.68, 27.77], [27.98, 31.03], [31.68, 34.42], [34.63, 38.23], [38.45, 46.99], [47.64, 49.82], [50.47, 54.58], [55.22, 55.87], [56.09, 60.79], [61.01, 64.58], [64.8, 66.67], [67.32, 70.15], [70.37, 76.32], [76.54, 83.98], [84.62, 85.42], [85.63, 90.62], [91.27, 93.89], [94.1, 99.24], [99.46, 103.22], [103.87, 105.74], [105.96, 108.29], [108.94, 113.95], [114.6, 116.47], [116.69, 118.56], [119.21, 121.08], [121.3, 125.16], [125.38, 128.86]], "R": []}, {"num": 60, "title": "Les expressions québécoises", "lines": [["P", "Ce soir, on va parler des expressions qu'on entend tous les jours au Québec. Vous ne les trouverez pas toujours dans vos manuels, mais vous allez les entendre partout. Qui a déjà entendu une expression qu'il n'a pas comprise ?", "Mme Bélanger"], ["S", "Moi ! Mon collègue François dit souvent : « Il fait frette » ! C'est la même chose que « froid » ?", "Lucas"], ["P", "Presque. « Frette », c'est très froid. On le dit en hiver, quand il fait moins vingt. Vous avez d'autres exemples ?", "Mme Bélanger"], ["S", "Oui. Quand une réunion est longue, il dit : « C'est plate ».", "Lucas"], ["P", "« C'est plate » veut dire que c'est ennuyeux. Et si c'est vraiment ennuyeux, on dit : « C'est plate en titi » ! Maintenant, une autre expression très courante : « avoir de la misère ». Par exemple : « J'ai de la misère à comprendre les Québécois ».", "Mme Bélanger"], ["S", "Ça veut dire qu'on a de la difficulté ?", "Lucas"], ["P", "Exactement ! Et quand on n'en peut plus d'une situation, on dit : « Je suis tanné ». Par exemple, en mars : « Je suis tanné de l'hiver » !", "Mme Bélanger"], ["S", "Ah, ça, je le dis souvent ! Et « pantoute » ? Mon voisin dit : « Pas pantoute » !", "Lucas"], ["P", "« Pantoute » veut dire « pas du tout ». Et une dernière pour ce soir : « tiguidou ». Ça veut dire « parfait » ou « d'accord ». Par exemple : « On se voit à sept heures ? Tiguidou » !", "Mme Bélanger"], ["S", "Tiguidou ! J'aime beaucoup celle-là.", "Lucas"], ["P", "Attention, ces expressions sont familières. Utilisez-les avec vos amis et vos collègues, mais pas dans une lettre officielle ou en entrevue. Pour jeudi, notez trois expressions que vous entendez autour de vous, et on en parlera en classe.", "Mme Bélanger"]], "words": 235, "kind": "story", "scene": "Québécois expressions. In French class, Mme Bélanger explains everyday Québécois expressions.", "F": "Informal French, explaining meaning", "V": "frette (freezing cold (Québec, informal)); C'est plate. (It's boring. (Québec)); en titi (really, very (informal)); avoir de la misère à (to have a hard time (Québec)); être tanné (to be fed up (Québec)); pantoute (not at all (Québec)); tiguidou (great, OK (Québec)); familier (informal)", "t": [[1.99, 7.51], [7.73, 13.3], [13.51, 17.74], [18.38, 20.26], [20.47, 24.36], [24.58, 27.38], [28.03, 29.9], [30.12, 32.78], [33.0, 36.65], [36.86, 39.6], [40.25, 42.12], [42.34, 46.42], [47.06, 50.59], [50.81, 55.42], [55.63, 61.2], [61.42, 65.95], [66.6, 69.55], [70.2, 72.24], [72.46, 77.38], [77.59, 81.91], [82.56, 85.78], [85.99, 88.03], [88.25, 91.3], [91.94, 95.3], [95.52, 99.02], [99.24, 103.1], [103.32, 106.75], [106.97, 108.84], [109.49, 111.36], [111.58, 113.95], [114.6, 118.68], [118.9, 124.99], [125.21, 131.93]], "R": []}, {"num": 61, "title": "Retourner un article", "lines": [["P", "Bonjour, madame. Je peux vous aider ?", "Le commis"], ["S", "Bonjour. J'ai acheté ces bottes ici il y a trois semaines. Le problème, c'est qu'elles ne sont pas imperméables. Hier, j'ai marché dans la sloche, et mes pieds étaient tout mouillés.", "Camila"], ["P", "Ah, c'est désagréable. Avez-vous votre reçu ?", "Le commis"], ["S", "Oui, le voici. Je les ai payées avec ma carte de crédit.", "Camila"], ["P", "Merci. Je regarde les bottes. Effectivement, la couture est décollée ici, sur le côté. C'est un défaut de fabrication.", "Le commis"], ["S", "Alors, est-ce que je peux me faire rembourser ?", "Camila"], ["P", "Notre politique de retour est de trente jours, avec le reçu. Vous êtes encore dans les délais. Je peux vous rembourser, ou vous pouvez faire un échange.", "Le commis"], ["S", "Je préfère un échange, si vous avez un autre modèle vraiment imperméable. J'en ai besoin pour aller au travail.", "Camila"], ["P", "Je vous recommande ce modèle-ci. Elles sont imperméables, et elles sont bonnes jusqu'à moins trente. Elles coûtent vingt dollars de plus.", "Le commis"], ["S", "Je peux les essayer ? Je chausse du sept et demi.", "Camila"], ["P", "Bien sûr. Je vais chercher votre pointure en arrière.", "Le commis"], ["S", "Elles sont confortables, et elles sont chaudes. Je les prends.", "Camila"], ["P", "Parfait. Je fais l'échange, et vous payez seulement la différence : vingt dollars, plus les taxes. Le montant sera débité sur votre carte de crédit.", "Le commis"], ["S", "Merci beaucoup. Vous avez été très efficace.", "Camila"], ["P", "Ça me fait plaisir. Gardez bien votre nouveau reçu, au cas où.", "Le commis"]], "words": 221, "kind": "story", "scene": "Returning an item. Camila takes back winter boots that leak.", "F": "Giving reasons, receipts, store policy", "V": "la sloche (slush (Québec)); mouillé (wet); le reçu (the receipt); la couture est décollée (the seam has come apart); un défaut de fabrication (a manufacturing defect); se faire rembourser (to get a refund); dans les délais (within the time limit); un échange (an exchange); au cas où (just in case)", "t": [[1.99, 4.63], [4.85, 6.98], [7.63, 9.5], [9.72, 12.48], [12.7, 16.01], [16.22, 20.33], [20.98, 23.83], [24.05, 26.38], [27.02, 28.9], [29.11, 31.97], [32.62, 34.49], [34.7, 37.18], [37.39, 42.31], [42.53, 45.48], [46.13, 48.94], [49.58, 54.26], [54.48, 57.17], [57.38, 61.68], [62.33, 67.06], [67.27, 69.65], [70.3, 73.32], [73.54, 78.1], [78.31, 81.31], [81.96, 83.52], [83.74, 85.75], [86.4, 88.39], [88.61, 92.18], [92.83, 95.64], [95.86, 97.73], [98.38, 100.25], [100.46, 107.06], [107.28, 111.53], [112.18, 114.05], [114.26, 116.47], [117.12, 119.52], [119.74, 123.53]], "R": []}, {"num": 62, "title": "La déclaration de revenus", "lines": [["P", "Bonjour, Lucas. Je m'appelle Robert. Je suis bénévole à la clinique d'impôts. C'est votre première déclaration au Canada ?", "Robert"], ["S", "Oui. Je suis un peu perdu. Mon collègue m'a dit qu'il y a deux déclarations au Québec. C'est vrai ?", "Lucas"], ["P", "Oui, c'est vrai. Au Québec, on fait une déclaration pour le gouvernement fédéral, à l'Agence du revenu du Canada, et une autre pour le gouvernement du Québec, à Revenu Québec.", "Robert"], ["S", "Deux déclarations ! Et qu'est-ce que je dois apporter ?", "Lucas"], ["P", "Vous avez apporté vos feuillets ? Votre employeur vous a envoyé un T4 pour le fédéral et un Relevé 1 pour le Québec.", "Robert"], ["S", "Oui, les voici. J'ai aussi les reçus de mes cours de français et de mes dons à la banque alimentaire.", "Lucas"], ["P", "Très bien. Les dons peuvent vous donner un crédit d'impôt. Vous êtes arrivé au Canada en novembre, c'est ça ?", "Robert"], ["S", "Oui, le quinze novembre de l'année passée.", "Lucas"], ["P", "Alors, il faut indiquer votre date d'arrivée. C'est important, parce que vos revenus au Brésil, avant votre arrivée, ne sont pas imposés ici.", "Robert"], ["S", "Ah, je ne savais pas. Et quelle est la date limite ?", "Lucas"], ["P", "Le trente avril. Mais faites-le même si vous n'avez pas d'impôt à payer. Ça vous permet de recevoir certains crédits, comme le crédit pour la TPS et le crédit d'impôt pour solidarité.", "Robert"], ["S", "Je vais recevoir de l'argent ?", "Lucas"], ["P", "Probablement un peu, oui. Les crédits sont versés tous les trois mois ou chaque mois. Bon, je vais remplir vos déclarations en ligne. Ça va prendre environ quarante-cinq minutes.", "Robert"], ["S", "Merci beaucoup, Robert. C'est un service vraiment utile pour les nouveaux arrivants.", "Lucas"]], "words": 255, "kind": "story", "scene": "The tax return. A volunteer at a free tax clinic helps Lucas file his first tax returns.", "F": "Forms, documents, explaining a process", "V": "la déclaration de revenus (the tax return); les impôts (taxes); perdu (lost, confused); les feuillets (tax slips); un don (a donation); imposé (taxed); la date limite (the deadline); verser (to pay out)", "t": [[1.99, 4.82], [5.04, 7.63], [7.85, 11.47], [11.69, 15.19], [15.84, 17.71], [17.93, 20.3], [20.52, 24.65], [24.86, 26.74], [27.38, 29.78], [30.0, 42.43], [43.08, 45.29], [45.5, 48.02], [48.67, 51.34], [51.55, 58.87], [59.52, 61.82], [62.04, 67.44], [68.09, 69.96], [70.18, 73.99], [74.21, 78.14], [78.79, 82.49], [83.14, 87.58], [87.79, 95.88], [96.53, 99.0], [99.22, 101.59], [102.24, 104.71], [104.93, 109.27], [109.49, 118.68], [119.33, 121.87], [122.52, 125.69], [125.9, 130.7], [130.92, 135.38], [135.6, 139.61], [140.26, 143.21], [143.42, 147.43]], "R": []}, {"num": 63, "title": "La bibliothèque", "lines": [["P", "Bonjour ! Je peux vous aider ?", "La bibliothécaire"], ["S", "Bonjour. Je voudrais m'abonner à la bibliothèque. C'est possible ?", "Camila"], ["P", "Bien sûr ! Pour les résidents de Montréal, l'abonnement est gratuit. J'ai besoin d'une pièce d'identité avec photo et d'une preuve d'adresse.", "La bibliothécaire"], ["S", "Voici mon permis de conduire et une facture d'Hydro-Québec.", "Camila"], ["P", "Parfait. Voilà, votre carte est prête. Vous pouvez emprunter jusqu'à dix documents pour trois semaines. Ça comprend les livres, les films et les jeux.", "La bibliothécaire"], ["S", "Et si je ne rapporte pas un livre à temps ?", "Camila"], ["P", "Il n'y a plus de frais de retard dans nos bibliothèques. Mais vous ne pourrez pas emprunter d'autres documents avant de rapporter le livre. Vous pouvez aussi renouveler vos prêts en ligne.", "La bibliothécaire"], ["S", "Super. J'ai une autre question. Je cherche des activités pour pratiquer mon français. Est-ce que vous avez quelque chose ?", "Camila"], ["P", "Oui, nous avons un groupe de conversation en français tous les mercredis soir, de dix-huit heures trente à vingt heures. C'est gratuit, mais il faut s'inscrire, parce que les places sont limitées.", "La bibliothécaire"], ["S", "Le mercredi, c'est parfait. Je finis le travail à quinze heures.", "Camila"], ["P", "Je vous inscris tout de suite. Il y a aussi un club de lecture en français facile, le premier samedi du mois.", "La bibliothécaire"], ["S", "Un club de lecture ! J'adore lire. Est-ce que vous avez des livres pour les gens qui apprennent le français ?", "Camila"], ["P", "Oui, au deuxième étage, il y a une section de lectures faciles, classées par niveau. Je vous conseille de commencer par le niveau deux.", "La bibliothécaire"], ["S", "Merci beaucoup ! Je vais y aller tout de suite.", "Camila"]], "words": 246, "kind": "story", "scene": "The library. Camila gets a library card and asks about French conversation groups.", "F": "Services, schedules, asking for information", "V": "s'abonner, l'abonnement (to sign up, the membership); emprunter (to borrow); rapporter (to bring back); les frais de retard (late fees); renouveler un prêt (to renew a loan); s'inscrire (to sign up); un club de lecture (a book club); classé par niveau (sorted by level)", "t": [[1.99, 3.86], [4.08, 6.22], [6.86, 8.74], [8.95, 11.45], [11.66, 13.54], [14.18, 16.13], [16.34, 20.59], [20.81, 25.85], [26.5, 30.34], [30.98, 32.86], [33.07, 36.19], [36.41, 40.75], [40.97, 44.57], [45.22, 47.83], [48.48, 52.58], [52.8, 57.96], [58.18, 61.66], [62.3, 64.18], [64.39, 66.26], [66.48, 69.6], [69.82, 71.83], [72.48, 80.09], [80.3, 85.61], [86.26, 88.49], [88.7, 91.1], [91.75, 94.39], [94.61, 100.2], [100.85, 102.72], [102.94, 104.81], [105.02, 108.38], [109.03, 115.3], [115.51, 119.14], [119.78, 121.66], [121.87, 123.74]], "R": []}, {"num": 64, "title": "Le voisin bruyant", "lines": [["P", "Oui ? Bonjour.", "M. Fortin"], ["S", "Bonjour, monsieur. Je suis Camila, votre voisine d'en dessous. Excusez-moi de vous déranger. Est-ce que vous avez deux minutes ?", "Camila"], ["P", "Euh, oui. Il y a un problème ?", "M. Fortin"], ["S", "C'est un peu délicat. Le soir, j'entends beaucoup de bruit. De la musique et des pas, souvent après minuit.", "Camila"], ["P", "Ah oui ? Je suis désolé, je ne savais pas que ça s'entendait autant. Je travaille de soir, alors je rentre vers minuit et je me détends un peu.", "M. Fortin"], ["S", "Je comprends. Le problème, c'est que je commence à travailler à sept heures. Je dois me lever à cinq heures et demie. Quand je n'arrive pas à dormir, je suis très fatiguée au travail.", "Camila"], ["P", "Oh, c'est vrai que c'est tôt. Qu'est-ce que vous me proposez ?", "M. Fortin"], ["S", "Est-ce que vous pourriez baisser la musique après vingt-deux heures ? Ou peut-être utiliser des écouteurs ?", "Camila"], ["P", "Oui, c'est raisonnable. Je vais utiliser mes écouteurs. Pour les pas, je n'avais pas pensé à ça. Je vais mettre un tapis dans le salon.", "M. Fortin"], ["S", "Merci beaucoup. C'est très gentil de votre part.", "Camila"], ["P", "C'est normal. Et si le bruit continue, n'hésitez pas à me le dire. Je préfère que vous veniez me voir, au lieu d'appeler la propriétaire.", "M. Fortin"], ["S", "Bien sûr. Et si un jour je fais du bruit, vous pouvez venir me voir aussi.", "Camila"], ["P", "Marché conclu ! Au fait, je m'appelle Jean-François. Bienvenue dans l'immeuble.", "M. Fortin"], ["S", "Merci, Jean-François. Bonne soirée !", "Camila"]], "words": 223, "kind": "story", "scene": "The noisy neighbour. Camila knocks on her upstairs neighbour's door about late-night noise.", "F": "Polite requests, finding a solution", "V": "bruyant (noisy); d'en dessous (downstairs); délicat (awkward, sensitive); des pas (footsteps); se détendre (to relax); n'arriver pas à dormir (to be unable to sleep); des écouteurs (headphones); un tapis (a rug); Marché conclu ! (It's a deal!)", "t": [[1.99, 3.86], [4.08, 6.14], [6.79, 8.66], [8.88, 12.14], [12.36, 14.5], [14.71, 16.68], [17.33, 19.39], [19.61, 21.89], [22.54, 24.41], [24.62, 27.19], [27.41, 30.38], [31.03, 32.9], [33.12, 38.16], [38.38, 44.71], [45.36, 47.23], [47.45, 50.9], [51.12, 53.71], [53.93, 57.77], [58.42, 61.37], [61.58, 64.1], [64.75, 67.94], [68.16, 70.54], [71.18, 74.11], [74.33, 77.69], [77.9, 81.82], [82.03, 85.37], [86.02, 87.89], [88.1, 90.12], [90.77, 93.05], [93.26, 98.42], [98.64, 104.42], [105.07, 106.94], [107.16, 110.98], [111.62, 113.93], [114.14, 117.84], [118.06, 120.74], [121.39, 123.67], [123.89, 125.76]], "R": []}, {"num": 65, "title": "Le bilan de mi-année", "lines": [["P", "Merci d'être venu, Lucas. Aujourd'hui, j'aimerais faire le bilan de tes premiers mois avec nous. Comment tu trouves ça, jusqu'à maintenant ?", "Marc"], ["S", "Je suis très content. J'ai beaucoup appris, et l'équipe m'a bien accueilli. Au début, c'était difficile de suivre les réunions en français, mais maintenant, ça va beaucoup mieux.", "Lucas"], ["P", "Je l'ai remarqué. Tu participes beaucoup plus qu'avant. Et ton travail sur la page de connexion était excellent. Le client était très satisfait.", "Marc"], ["S", "Merci. François m'a beaucoup aidé.", "Lucas"], ["P", "Maintenant, il y a un point que j'aimerais travailler avec toi. Parfois, tu attends trop longtemps avant de demander de l'aide. La semaine passée, tu as passé deux jours sur un problème que François aurait pu régler en une heure.", "Marc"], ["S", "C'est vrai. Je ne voulais pas déranger les autres. Au Brésil, dans mon ancien travail, on devait trouver les solutions seul.", "Lucas"], ["P", "Je comprends. Mais ici, demander de l'aide, ce n'est pas une faiblesse. C'est une façon de gagner du temps pour toute l'équipe. Tu pourrais te donner une règle : si tu bloques plus de deux heures, tu demandes.", "Marc"], ["S", "Deux heures. C'est une bonne règle. Je vais l'essayer.", "Lucas"], ["P", "Pour les six prochains mois, j'aimerais te donner plus de responsabilités. Est-ce que tu serais intéressé à présenter tes travaux au client directement ?", "Marc"], ["S", "Oui, beaucoup ! Mais j'ai encore un peu peur de faire des erreurs en français.", "Lucas"], ["P", "Ton français est très bon, et le client t'apprécie. On va préparer la première présentation ensemble. Est-ce que tu as d'autres objectifs ?", "Marc"], ["S", "J'aimerais suivre une formation sur la sécurité informatique. C'est un domaine qui m'intéresse.", "Lucas"], ["P", "Excellente idée. Envoie-moi les informations, et je vais vérifier le budget de formation. Bravo pour ces premiers mois, Lucas !", "Marc"]], "words": 275, "kind": "story", "scene": "The mid-year check-in. Marc meets with Lucas to look back on his first months and set new goals.", "F": "Giving and receiving feedback, goals", "V": "faire le bilan (to review, to take stock); jusqu'à maintenant (so far); accueillir (to welcome); remarquer (to notice); aurait pu régler (could have solved); une faiblesse (a weakness); bloquer (to be stuck); apprécier (to value, to like)", "t": [[1.99, 5.52], [5.74, 11.14], [11.35, 14.64], [15.29, 17.52], [17.74, 21.43], [21.65, 28.42], [29.06, 31.32], [31.54, 34.82], [35.04, 39.91], [40.13, 43.42], [44.06, 45.94], [46.15, 48.74], [49.39, 54.38], [54.6, 59.9], [60.12, 68.02], [68.66, 70.54], [70.75, 73.68], [73.9, 79.27], [79.92, 81.96], [82.18, 87.5], [87.72, 91.99], [92.21, 98.66], [99.31, 101.26], [101.47, 103.7], [103.92, 106.03], [106.68, 112.54], [112.75, 117.96], [118.61, 120.82], [121.03, 125.09], [125.74, 130.3], [130.51, 134.93], [135.14, 138.24], [138.89, 143.35], [143.57, 146.35], [147.0, 149.4], [149.62, 155.57], [155.78, 159.36]], "R": []}]}, {"part": 3, "title": "Target", "desc": "NCLC 7 (B2). Natural-speed French, plus the formats of the TEF Canada and TCF Canada listening tests.", "scripts": [{"num": 66, "title": "Avant de signer le bail", "lines": [["P", "Pis, ta visite ? T'as trouvé quelque chose ?", "Catherine"], ["S", "Oui, je pense que oui. Un quatre et demi à Rosemont, à cinq minutes du métro Beaubien. La propriétaire est super gentille, mais il y a une affaire qui me dérange un peu.", "Lucas"], ["P", "Ah oui ? Quoi ?", "Catherine"], ["S", "Ce matin, elle m'a envoyé un courriel. Elle veut que je paie le premier mois, plus un dépôt de sécurité de mille dollars, avant de signer le bail.", "Lucas"], ["P", "Attends, attends. Un dépôt de sécurité ? Ça, au Québec, c'est pas permis. Le propriétaire a le droit de te demander le premier mois de loyer d'avance, mais c'est tout. Pas de dépôt, rien d'autre.", "Catherine"], ["S", "Vraiment ? À Toronto, mon cousin a payé le premier et le dernier mois.", "Lucas"], ["P", "Oui, mais en Ontario, les règles sont différentes. Si j'étais toi, je lui répondrais poliment que tu vas payer le premier mois, point. Elle le sait sûrement. Des fois, les propriétaires essaient, juste pour voir.", "Catherine"], ["S", "OK. Et le bail, c'est elle qui le prépare ?", "Lucas"], ["P", "Oui, sur le formulaire officiel du Tribunal administratif du logement. Regarde bien la section G. Elle doit y écrire le loyer le plus bas qui a été payé dans les douze derniers mois.", "Catherine"], ["S", "Et si mon loyer est beaucoup plus élevé que celui de l'ancien locataire ?", "Lucas"], ["P", "Tu peux demander au TAL de fixer ton loyer. Mais fais attention : en général, t'as juste dix jours après la signature du bail pour faire la demande. Alors lis la section G avant de signer. Pis elle doit te donner ta copie du bail dans les dix jours, elle aussi.", "Catherine"], ["S", "Bon. Il y a autre chose que je devrais savoir ?", "Lucas"], ["P", "Ben, le gros défi, c'est le premier juillet. La moitié de la ville déménage la même journée, faque si tu veux un camion, réserve-le tout de suite. Sinon, tu vas te retrouver avec tes boîtes sur le trottoir.", "Catherine"], ["S", "Pourquoi tout le monde déménage le même jour ?", "Lucas"], ["P", "Avant, la date traditionnelle des déménagements, c'était le premier mai. Ils l'ont changé dans les années soixante-dix, pour que les enfants ne changent pas d'école en pleine année. Pense aussi à ouvrir ton compte chez Hydro-Québec avant d'arriver, pis à prendre une assurance habitation. La loi l'exige pas, mais beaucoup de propriétaires la demandent dans le bail. Pis honnêtement, ça vaut la peine.", "Catherine"], ["S", "Wow. Je pensais que louer un appartement, c'était juste signer un papier.", "Lucas"], ["P", "Bienvenue au Québec ! Mais inquiète-toi pas, tu t'en sors très bien. Envoie-moi le bail avant de le signer, je vais le relire avec toi.", "Catherine"], ["S", "T'es la meilleure. Je te paie un café pour te remercier ?", "Lucas"], ["P", "Deal. Mais un grand, par exemple !", "Catherine"]], "words": 430, "kind": "story", "scene": "Before signing the lease. Over coffee, Lucas tells his friend Catherine about the landlord's email, and she explains his rights as a tenant in Québec.", "F": "Tenant rights, giving advice, the conditional", "V": "pis (and, so (informal for puis)); une affaire (a thing (informal)); un dépôt de sécurité (a security deposit); d'avance (in advance); le TAL (the Québec housing tribunal); faque (so (informal Québec)); l'assurance habitation (tenant's insurance); par exemple (at the end) (though, mind you (Québec))", "t": [[1.99, 4.22], [4.44, 6.58], [7.22, 9.6], [9.82, 13.99], [14.21, 19.01], [19.66, 21.53], [21.74, 23.62], [24.26, 27.53], [27.74, 33.77], [34.42, 36.6], [36.82, 39.1], [39.31, 42.43], [42.65, 48.24], [48.46, 51.02], [51.67, 53.54], [53.76, 57.94], [58.58, 62.64], [62.86, 68.04], [68.26, 70.27], [70.49, 74.83], [75.48, 77.35], [77.57, 80.47], [81.12, 86.14], [86.35, 88.97], [89.18, 94.2], [94.85, 99.02], [99.67, 103.1], [103.32, 109.82], [110.04, 113.06], [113.28, 117.53], [118.18, 120.05], [120.26, 123.26], [123.91, 127.49], [127.7, 134.02], [134.23, 138.55], [139.2, 142.15], [142.8, 147.5], [147.72, 153.48], [153.7, 159.86], [160.08, 164.86], [165.07, 167.95], [168.6, 170.47], [170.69, 175.2], [175.85, 178.03], [178.25, 181.66], [181.87, 186.17], [186.82, 188.71], [188.93, 191.54], [192.19, 194.06], [194.28, 197.11]], "R": []}, {"num": 67, "title": "La hausse de loyer", "lines": [["P", "Stéphane, t'as deux minutes ? J'ai reçu une lettre de Mme Gagnon, pis je suis pas sûr de bien comprendre.", "Lucas"], ["S", "Montre-moi ça. Ah, c'est un avis de modification du bail. C'est la période, tout le monde en reçoit un en ce moment. Elle augmente ton loyer de combien ?", "Stéphane"], ["P", "De mille cinq cents à mille six cent vingt. Cent vingt dollars de plus par mois ! C'est huit pour cent. Est-ce qu'elle a le droit ?", "Lucas"], ["S", "Elle a le droit de te proposer une hausse, oui. Mais toi, t'as le droit de la refuser. Ici, c'est pas le propriétaire qui décide tout seul.", "Stéphane"], ["P", "Si je refuse, est-ce que je dois partir ?", "Lucas"], ["S", "Non, pas du tout. C'est ça que beaucoup de nouveaux arrivants ne savent pas. Tu peux refuser la hausse et rester dans ton logement. T'as trois choix : accepter, refuser la hausse mais renouveler ton bail, ou quitter le logement à la fin du bail.", "Stéphane"], ["P", "Et si je refuse, qu'est-ce qui se passe ensuite ?", "Lucas"], ["S", "Si tu refuses, Mme Gagnon a un mois pour s'adresser au Tribunal administratif du logement. Le Tribunal calcule une hausse selon les dépenses de l'immeuble : les taxes, les assurances, les réparations. Chaque année, il publie un taux de référence, pis souvent, c'est beaucoup moins que huit pour cent.", "Stéphane"], ["P", "OK. Mais j'ai combien de temps pour répondre ?", "Lucas"], ["S", "Un mois après avoir reçu la lettre. Et attention : si tu réponds pas, c'est comme si t'acceptais. Le silence, c'est un oui.", "Stéphane"], ["P", "Ah, c'est important, ça. Mais j'ai peur que ça crée un malaise avec elle. Elle a toujours été correcte avec moi.", "Lucas"], ["S", "Je comprends. T'es pas obligé d'aller au Tribunal tout de suite. Moi, à ta place, je l'appellerais avant. Tu lui dis que tu aimes l'appartement, que tu veux rester, mais que huit pour cent, c'est trop pour toi. Tu pourrais proposer quatre pour cent, par exemple.", "Stéphane"], ["P", "Négocier directement, donc. Et si elle dit non ?", "Lucas"], ["S", "Alors, tu lui envoies ton refus par écrit, avant la fin du délai d'un mois. Garde une copie, pis une preuve que tu l'as envoyé. Le reste, c'est son problème.", "Stéphane"], ["P", "Merci, Stéphane. Au Brésil, je pense que j'aurais juste payé sans poser de questions.", "Lucas"], ["S", "Ben ici, pose des questions ! Les locataires ont plus de droits que tu penses.", "Stéphane"]], "words": 371, "kind": "story", "scene": "The rent increase. Lucas gets a notice of rent increase and asks his neighbour Stéphane what to do.", "F": "Rights, deadlines, weighing options", "V": "un avis de modification du bail (a notice of change to the lease); une hausse (an increase); renouveler (to renew); s'adresser au Tribunal (to apply to the tribunal); un taux de référence (a reference rate); le délai (the time limit); un malaise (awkwardness, tension); correct (Québec) (fine, decent)", "t": [[1.99, 4.37], [4.58, 9.41], [10.06, 11.95], [12.17, 15.67], [15.89, 19.58], [19.8, 22.54], [23.18, 26.28], [26.5, 29.16], [29.38, 31.25], [31.46, 33.36], [34.01, 37.37], [37.58, 40.7], [40.92, 45.0], [45.65, 48.74], [49.39, 51.5], [51.72, 55.13], [55.34, 58.82], [59.04, 66.46], [67.1, 70.44], [71.09, 77.33], [77.54, 84.55], [84.77, 91.15], [91.8, 93.67], [93.89, 96.48], [97.13, 100.18], [100.39, 104.71], [104.93, 107.5], [108.14, 110.78], [111.0, 114.26], [114.48, 117.14], [117.79, 119.66], [119.88, 123.34], [123.55, 126.98], [127.2, 133.25], [133.46, 137.28], [137.93, 140.83], [141.05, 142.97], [143.62, 148.75], [148.97, 152.78], [153.0, 155.81], [156.46, 158.88], [159.1, 163.61], [164.26, 167.09], [167.3, 170.69]], "R": []}, {"num": 68, "title": "L'entrevue comportementale", "lines": [["P", "Merci d'être venue, madame Souza. Comme je vous l'ai dit au téléphone, aujourd'hui, je vais surtout vous poser des questions sur des situations que vous avez vécues. Ça va ?", "Mme Lévesque"], ["S", "Oui, très bien.", "Camila"], ["P", "Alors, commençons. Parlez-moi d'une fois où vous avez dû gérer une situation urgente avec un patient.", "Mme Lévesque"], ["S", "D'accord. Pendant mon stage, l'hiver passé, je m'occupais d'un patient âgé qui avait été opéré la veille. En prenant ses signes vitaux, j'ai remarqué que sa pression était très basse et qu'il était confus.", "Camila"], ["P", "Qu'est-ce que vous avez fait ?", "Mme Lévesque"], ["S", "J'ai d'abord vérifié s'il saignait au niveau de sa plaie. Il n'y avait pas de saignement visible, mais son pouls était rapide. J'ai immédiatement appelé l'infirmière responsable, et pendant qu'elle contactait le médecin, j'ai surélevé ses jambes et je suis restée avec lui pour le rassurer.", "Camila"], ["P", "Et le résultat ?", "Mme Lévesque"], ["S", "Le médecin est arrivé en quelques minutes. Le patient avait une hémorragie interne. Il a été réopéré le soir même, et il s'en est bien sorti. Après, l'équipe m'a dit que j'avais bien réagi, parce que j'avais transmis les informations de façon claire et rapide.", "Camila"], ["P", "Merci. Maintenant, parlez-moi d'un conflit avec un collègue. Comment l'avez-vous réglé ?", "Mme Lévesque"], ["S", "Au CHSLD, une collègue me reprochait de prendre trop de temps avec les résidents, ce qui retardait les autres tâches. Au début, j'étais blessée. Mais j'ai compris qu'elle avait raison sur un point : on était souvent en retard à la fin du quart.", "Camila"], ["P", "Et qu'avez-vous fait ?", "Mme Lévesque"], ["S", "Je lui ai proposé qu'on prenne cinq minutes au début de chaque quart pour planifier ensemble. Comme ça, je savais quand je pouvais prendre plus de temps avec un résident, et quand je devais aller plus vite. Après quelques semaines, on travaillait beaucoup mieux ensemble.", "Camila"], ["P", "Très bien. Dernière question : qu'est-ce que vous aimeriez améliorer chez vous, professionnellement ?", "Mme Lévesque"], ["S", "Honnêtement, ma rapidité à l'écrit en français. Je rédige mes notes au dossier correctement, mais ça me prend plus de temps qu'à mes collègues. Je suis un cours de rédaction en ligne, et je vois déjà une différence.", "Camila"], ["P", "J'apprécie votre franchise. Vous aurez des nouvelles de notre part d'ici la fin de la semaine.", "Mme Lévesque"]], "words": 349, "kind": "story", "scene": "The behavioural interview. Now licensed as a nurse, Camila interviews for a position at a Montréal hospital.", "F": "Telling a story in the past, the STAR method", "V": "vécu (lived through, experienced); gérer (to handle); la pression (blood pressure); saigner, un saignement (to bleed, bleeding); surélever (to raise); s'en sortir (to pull through); reprocher (to criticize, to blame); rédiger (to write (a document)); la franchise (honesty)", "t": [[1.99, 5.23], [5.45, 12.48], [12.7, 14.57], [15.22, 17.09], [17.74, 20.11], [20.33, 25.32], [25.97, 27.84], [28.06, 33.1], [33.31, 37.97], [38.62, 40.7], [41.35, 44.38], [44.59, 48.05], [48.26, 55.63], [56.28, 58.15], [58.8, 61.32], [61.54, 64.08], [64.3, 67.68], [67.9, 73.9], [74.54, 76.42], [76.63, 80.4], [80.62, 82.85], [83.5, 89.47], [89.69, 91.56], [91.78, 96.17], [96.82, 98.74], [99.38, 103.9], [104.11, 109.39], [109.61, 112.9], [113.54, 115.42], [115.63, 121.08], [121.73, 124.68], [124.9, 129.24], [129.46, 133.25], [133.9, 136.44], [136.66, 140.71]], "R": []}, {"num": 69, "title": "La négociation salariale", "lines": [["P", "Bonjour, madame Souza. J'ai le plaisir de vous confirmer que l'équipe a retenu votre candidature. Félicitations !", "M. Gendron"], ["S", "Merci beaucoup ! Je suis vraiment contente.", "Camila"], ["P", "Je vais vous présenter l'offre. C'est un poste d'infirmière à temps complet, sur l'unité de médecine, de jour, avec une fin de semaine sur deux. Comme vous le savez peut-être, dans le réseau public, les salaires sont fixés par la convention collective. Chaque infirmière est placée à un échelon, selon son expérience.", "M. Gendron"], ["S", "Oui, j'ai lu la convention collective. À quel échelon est-ce que vous me placez ?", "Camila"], ["P", "Pour l'instant, à l'échelon trois. Ça tient compte de votre expérience au Québec, au CHSLD, et de votre stage.", "M. Gendron"], ["S", "Je comprends. Mais j'ai aussi travaillé six ans comme infirmière à São Paulo, dans une unité de gériatrie. Est-ce que cette expérience peut être reconnue ?", "Camila"], ["P", "C'est possible, mais il faut la documenter. Si vous nous fournissez des attestations d'emploi de vos anciens employeurs, avec les dates et le nombre d'heures, on peut les analyser.", "M. Gendron"], ["S", "J'ai déjà des lettres de l'hôpital, traduites en français par un traducteur agréé. Je peux vous les envoyer dès aujourd'hui.", "Camila"], ["P", "Parfait. Si elles sont complètes, vous pourriez être placée beaucoup plus haut, peut-être à l'échelon huit ou neuf. La différence de salaire est importante.", "M. Gendron"], ["S", "Merci. J'ai une autre question. Le poste est de jour, mais il y a parfois des quarts de soir obligatoires, n'est-ce pas ?", "Camila"], ["P", "Oui, environ un quart de soir par mois, selon les besoins de l'unité. Vous recevez alors une prime de soir.", "M. Gendron"], ["S", "D'accord. Et pour la formation continue ? J'aimerais me spécialiser en soins palliatifs plus tard.", "Camila"], ["P", "L'établissement offre un budget de formation, et les soins palliatifs sont une priorité chez nous. Vous pourrez en parler avec votre gestionnaire après la période de probation.", "M. Gendron"], ["S", "Très bien. Alors, je vous envoie mes attestations aujourd'hui, et j'attends votre confirmation de l'échelon avant de signer, si ça vous convient.", "Camila"], ["P", "Tout à fait. C'est une demande raisonnable. Je vous recontacte dès que l'analyse est terminée.", "M. Gendron"]], "words": 325, "kind": "story", "scene": "Negotiating salary. The hospital offers Camila the job, and she discusses the offer with human resources.", "F": "Persuading politely, conditions, numbers", "V": "retenir une candidature (to select an applicant); le réseau public (the public system); la convention collective (the collective agreement); un échelon (a pay step); tenir compte de (to take into account); une attestation d'emploi (an employment letter); un traducteur agréé (a certified translator); une prime (a bonus, a premium); la formation continue (continuing education)", "t": [[1.99, 5.09], [5.3, 10.82], [11.04, 13.1], [13.75, 15.62], [15.84, 17.71], [18.36, 20.9], [21.12, 29.3], [29.52, 37.08], [37.3, 42.58], [43.22, 45.82], [46.03, 48.24], [48.89, 51.89], [52.1, 58.85], [59.5, 61.37], [61.58, 66.22], [66.43, 68.88], [69.53, 73.18], [73.39, 82.18], [82.82, 87.19], [87.41, 89.66], [90.31, 92.18], [92.4, 99.84], [100.06, 103.61], [104.26, 104.93], [105.14, 107.02], [107.23, 111.65], [112.3, 117.94], [118.15, 121.49], [122.14, 124.01], [124.22, 126.24], [126.46, 129.55], [130.2, 136.94], [137.16, 142.32], [142.97, 144.84], [145.06, 151.7], [152.35, 154.22], [154.44, 157.18], [157.39, 161.3]], "R": []}, {"num": 70, "title": "Les codes du bureau", "lines": [["P", "Élodie, je peux te poser une question un peu bizarre ? Quand t'es arrivée de France, est-ce que t'as eu un choc culturel au travail ?", "Lucas"], ["S", "Oh là là, oui ! On pense que, parce qu'on parle la même langue, ce sera facile. Mais pas du tout.", "Élodie"], ["P", "Qu'est-ce qui t'a surprise le plus ?", "Lucas"], ["S", "Le tutoiement, d'abord. En France, je vouvoyais mon patron pendant des années. Ici, le premier jour, le directeur m'a dit : « Tu peux me tutoyer, hein ». J'étais très mal à l'aise. J'avais l'impression de manquer de respect.", "Élodie"], ["P", "Moi, c'est le contraire. Au Brésil, on est très chaleureux, on se touche le bras, on se fait la bise. Ici, je trouve les gens gentils, mais il y a plus de distance physique.", "Lucas"], ["S", "C'est vrai. Et autre chose : la façon de critiquer. En France, on peut être assez direct en réunion. On dit : « Je ne suis pas d'accord », et ce n'est pas grave. Ici, si tu es trop direct, les gens peuvent le prendre mal. On préfère dire : « C'est une bonne idée, mais on pourrait peut-être ».", "Élodie"], ["P", "Ah, je l'ai remarqué ! François dit toujours « c'est intéressant » quand il n'aime pas une idée.", "Lucas"], ["S", "Exactement ! Il faut apprendre à lire entre les lignes. Et les horaires aussi. Ici, les réunions commencent à l'heure pile, et à cinq heures, tout le monde part. Au début, je restais jusqu'à sept heures pour montrer que j'étais motivée. Mon patron m'a demandé si j'avais trop de travail !", "Élodie"], ["P", "Ça, c'est bien, non ? L'équilibre entre le travail et la vie personnelle.", "Lucas"], ["S", "C'est très bien. Mais il m'a fallu un an pour arrêter de me sentir coupable. Et toi, qu'est-ce que tu trouves le plus difficile ?", "Élodie"], ["P", "Les petites conversations. Le lundi matin, tout le monde parle de hockey, de la météo, du chalet. Je ne sais jamais quoi dire.", "Lucas"], ["S", "Le truc, c'est de poser des questions. Les Québécois adorent parler de leur fin de semaine. Et si tu ne sais pas quoi dire, parle de la météo. Ça marche toujours.", "Élodie"], ["P", "« Il fait frette, hein » ?", "Lucas"], ["S", "Voilà ! Tu es presque Québécois, maintenant.", "Élodie"]], "words": 337, "kind": "story", "scene": "The unwritten rules. At lunch, Élodie tells Lucas about her own culture shock when she arrived from France.", "F": "Workplace culture, nuance, comparing", "V": "un choc culturel (culture shock); vouvoyer, tutoyer (to say vous, to say tu); mal à l'aise (uncomfortable); se faire la bise (to kiss on the cheek); le prendre mal (to take it badly); lire entre les lignes (to read between the lines); à l'heure pile (right on time); se sentir coupable (to feel guilty)", "t": [[1.99, 5.69], [5.9, 10.34], [10.99, 13.06], [13.27, 17.86], [18.07, 19.94], [20.59, 23.06], [23.71, 26.3], [26.52, 30.43], [30.65, 36.26], [36.48, 38.81], [39.02, 41.88], [42.53, 44.98], [45.19, 50.42], [50.64, 55.46], [56.11, 57.98], [58.2, 61.7], [61.92, 65.62], [65.83, 69.89], [70.1, 74.54], [74.76, 79.27], [79.92, 82.2], [82.42, 86.93], [87.58, 89.45], [89.66, 92.52], [92.74, 94.85], [95.06, 100.68], [100.9, 105.58], [105.79, 109.3], [109.94, 112.56], [112.78, 116.26], [116.9, 118.78], [118.99, 122.93], [123.14, 126.55], [127.2, 129.48], [129.7, 134.62], [134.83, 137.23], [137.88, 140.98], [141.19, 144.72], [144.94, 148.46], [148.68, 150.82], [151.46, 153.53], [154.18, 156.05], [156.26, 159.36]], "R": []}, {"num": 71, "title": "Les priorités du projet", "lines": [["P", "Merci d'être venus aussi vite. Je viens de raccrocher avec le client. Ils ont un salon commercial à Toronto dans trois semaines, et ils veulent présenter l'application là-bas. Autrement dit, la date de livraison passe du quinze mai au vingt avril.", "Marc"], ["S", "Trois semaines plus tôt ? C'est impossible de tout livrer d'ici là.", "Élodie"], ["P", "Je suis d'accord. C'est pour ça que j'ai besoin de vous. On ne va pas tout livrer. On doit choisir ce qui est essentiel pour la démonstration, et reporter le reste.", "Marc"], ["S", "Pour une démonstration, ce qui compte, c'est ce que les gens voient. La connexion, le tableau de bord et les notifications. Le module de rapports, personne ne va le regarder dans un salon.", "Lucas"], ["S", "Je suis d'accord avec Lucas. Mais attention : si on reporte les rapports, il faut le dire clairement au client, par écrit. Sinon, en mai, ils vont penser que c'était inclus.", "Élodie"], ["P", "Bon point. Élodie, tu pourrais rédiger un courriel qui explique ce qui sera prêt le vingt avril, et ce qui sera livré en mai ?", "Marc"], ["S", "Oui, je l'envoie avant la fin de la journée. Mais il y a un autre risque. Si on accélère, on va avoir moins de temps pour les tests. Et une démo qui plante devant des clients, c'est pire qu'une démo incomplète.", "Élodie"], ["S", "On pourrait geler le code une semaine avant le salon. Pas de nouvelles fonctionnalités après le treize avril, seulement des corrections. Comme ça, on garde une semaine complète pour tester.", "Lucas"], ["P", "J'aime cette idée. Ça veut dire que les notifications doivent être terminées d'ici le treize. Lucas, c'est réaliste ?", "Marc"], ["S", "C'est serré, mais c'est faisable, à condition que François puisse m'aider sur la partie serveur. Et il faudrait que je mette de côté la formation sur la sécurité, pour l'instant.", "Lucas"], ["P", "D'accord. Je vais parler à François, et on reporte ta formation à juin. Je sais que tu y tenais, désolé.", "Marc"], ["S", "Pas de problème. Le projet passe en premier.", "Lucas"], ["P", "Merci, tous les deux. Je vais rappeler le client pour lui présenter notre plan. Si quelque chose bloque, vous me le dites tout de suite. Pas à la dernière minute.", "Marc"]], "words": 347, "kind": "story", "scene": "Project priorities. Marc calls an urgent meeting: the client has moved up a deadline.", "F": "Reasons and consequences, changing plans", "V": "raccrocher (to hang up); un salon commercial (a trade show); autrement dit (in other words); la livraison (the delivery); reporter (to postpone); planter (to crash (computer)); geler le code (to freeze the code); serré (tight); tenir à quelque chose (to care about something)", "t": [[1.99, 5.3], [5.52, 8.69], [8.9, 15.96], [16.18, 21.86], [22.51, 24.6], [24.82, 27.79], [28.44, 30.55], [30.77, 33.58], [33.79, 36.07], [36.29, 42.22], [42.86, 46.94], [47.16, 51.17], [51.38, 55.61], [56.26, 58.78], [58.99, 65.04], [65.26, 69.14], [69.79, 71.66], [71.88, 79.22], [79.87, 83.18], [83.4, 85.85], [86.06, 90.17], [90.38, 95.26], [95.9, 99.14], [99.36, 104.11], [104.33, 107.9], [108.55, 110.64], [110.86, 116.23], [116.45, 118.97], [119.62, 125.28], [125.5, 130.3], [130.94, 132.82], [133.03, 137.88], [138.1, 141.29], [141.94, 143.81], [144.02, 146.3], [146.95, 149.59], [149.81, 153.84], [154.06, 158.47], [158.69, 161.28]], "R": []}, {"num": 72, "title": "Le désaccord", "lines": [["P", "Lucas, j'ai regardé ton code pour les notifications. C'est bien fait, mais t'as écrit des tests pour chaque fonction. Honnêtement, on n'a pas le temps pour ça. Il reste neuf jours.", "François"], ["S", "Je comprends ta préoccupation, mais je vois les choses autrement. Les notifications, c'est la partie la plus fragile. Si on enlève les tests, on risque d'avoir des bogues pendant la démo.", "Lucas"], ["P", "Ouin, mais si on manque la date, il y aura pas de démo du tout. Moi, je propose qu'on termine les fonctionnalités d'abord, pis qu'on écrive les tests après le salon.", "François"], ["S", "Je vois ton point. Mais d'expérience, après le salon, on ne les écrira jamais. Il y aura toujours une autre urgence.", "Lucas"], ["P", "C'est vrai que ça arrive souvent. Mais t'admettras que tester chaque petite fonction, c'est un peu exagéré pour une démo.", "François"], ["S", "T'as peut-être raison sur ce point. Je suis peut-être un peu perfectionniste. Qu'est-ce que tu dirais d'un compromis ?", "Lucas"], ["P", "Vas-y, je t'écoute.", "François"], ["S", "On écrit des tests seulement pour les trois scénarios qu'on va montrer au salon : la réception d'une notification, l'ouverture, pis la suppression. Pour le reste, on note dans une liste ce qui manque, et on s'en occupe en mai.", "Lucas"], ["P", "Hum. Trois scénarios, ça me paraît raisonnable. Ça prendrait combien de temps ?", "François"], ["S", "Une journée, peut-être une journée et demie. Pas plus.", "Lucas"], ["P", "OK, ça me va. Mais on se met une limite : si ça prend plus de deux jours, on arrête et on passe aux fonctionnalités.", "François"], ["S", "Marché conclu. Et merci de m'avoir dit directement ce que tu pensais. Je préfère ça.", "Lucas"], ["P", "Moi aussi. Pis t'sais, je trouve que t'as raison pour les tests, en général. C'est juste le timing qui est mauvais.", "François"], ["S", "On présente notre plan à Marc ensemble, cet après-midi ?", "Lucas"], ["P", "Parfait. Comme ça, il verra qu'on est d'accord, pis il va être content.", "François"]], "words": 297, "kind": "story", "scene": "The disagreement. Lucas and François disagree about how to finish a feature before the deadline.", "F": "Disagreeing politely, reaching a compromise", "V": "la préoccupation (the concern); voir les choses autrement (to see things differently); ouin (yeah (informal Québec)); manquer la date (to miss the deadline); exagéré (excessive); un compromis (a compromise); la suppression (deletion); t'sais (you know (informal))", "t": [[1.99, 6.05], [6.26, 10.2], [10.42, 13.46], [13.68, 15.96], [16.61, 20.71], [20.93, 24.5], [24.72, 29.14], [29.78, 33.98], [34.2, 40.39], [41.04, 42.91], [43.13, 47.47], [47.69, 50.47], [51.12, 53.66], [53.88, 59.45], [60.1, 62.71], [62.93, 65.74], [65.95, 68.45], [69.1, 71.52], [72.17, 80.4], [80.62, 85.34], [85.99, 87.86], [88.08, 91.44], [91.66, 94.08], [94.73, 97.97], [98.18, 100.06], [100.7, 102.94], [103.15, 109.25], [109.9, 111.77], [111.98, 115.54], [115.75, 117.62], [118.27, 120.14], [120.36, 124.8], [125.02, 127.92], [128.57, 132.36], [133.01, 134.88], [135.1, 139.49]], "R": []}, {"num": 73, "title": "La demande de promotion", "lines": [["P", "Merci d'avoir pris le temps de me rencontrer, Marc. Je voulais te parler de mon avenir dans l'équipe.", "Lucas"], ["S", "Avec plaisir. Je t'écoute.", "Marc"], ["P", "Ça fait maintenant deux ans que je travaille ici. Je pense que je suis prêt à prendre plus de responsabilités. J'aimerais être considéré pour le poste de développeur principal.", "Lucas"], ["S", "C'est une demande sérieuse. Qu'est-ce qui te fait dire que tu es prêt ?", "Marc"], ["P", "J'ai préparé quelques exemples. D'abord, le salon de Toronto. J'ai proposé de geler le code une semaine avant, et la démo s'est déroulée sans aucun bogue. Le client a signé un nouveau contrat de deux ans après le salon.", "Lucas"], ["S", "C'est vrai que ta proposition a fait une grosse différence.", "Marc"], ["P", "Ensuite, depuis six mois, je forme les deux nouveaux stagiaires. Ils sont maintenant autonomes, et l'un d'eux va être embauché en septembre. Et j'ai présenté nos travaux directement au client quatre fois, en français.", "Lucas"], ["S", "Tout ça, c'est vrai, et je l'apprécie. Je vais être honnête avec toi : le poste de développeur principal demande aussi de gérer des conflits et de dire non au client. Est-ce que tu te sens à l'aise avec ça ?", "Marc"], ["P", "C'est la partie où j'ai le plus à apprendre, je le reconnais. Mais avec François, pendant le projet, on a eu un désaccord, et on a trouvé un compromis ensemble. Je pense que je progresse.", "Lucas"], ["S", "Je l'ai vu, oui. Bon. Le poste ne sera officiellement ouvert qu'en janvier, avec le nouveau budget. D'ici là, voici ce que je te propose : tu diriges le prochain projet, du début à la fin, avec mon soutien. Si ça se passe bien, je recommande ta promotion à la direction.", "Marc"], ["P", "C'est très juste. Merci. Et, si le poste est confirmé en janvier, est-ce qu'on pourra discuter du salaire à ce moment-là ?", "Lucas"], ["S", "Bien sûr. Le poste vient avec une augmentation et une révision de ton titre. On en parlera en détail en janvier.", "Marc"], ["P", "Parfait. Est-ce que tu pourrais confirmer tout ça par courriel, pour qu'on ait une trace de notre entente ?", "Lucas"], ["S", "Bonne idée, je te l'envoie aujourd'hui. Et Lucas, bravo d'être venu me voir. C'est exactement l'attitude d'un développeur principal.", "Marc"]], "words": 350, "kind": "story", "scene": "Asking for a promotion. After the successful trade show, Lucas asks Marc for a promotion.", "F": "Making a case, results, arguing politely", "V": "l'avenir (the future); développeur principal (lead developer); se dérouler (to go, to unfold); un stagiaire (an intern); autonome (independent); le reconnaître (to admit it); diriger (to lead); le soutien (support); une trace (a record)", "t": [[1.99, 5.86], [6.07, 9.22], [9.86, 11.95], [12.17, 14.06], [14.71, 17.95], [18.17, 22.1], [22.32, 26.57], [27.22, 29.9], [30.12, 32.88], [33.53, 36.14], [36.36, 39.24], [39.46, 44.93], [45.14, 49.44], [50.09, 54.58], [55.22, 59.64], [59.86, 64.63], [64.85, 69.6], [70.25, 73.82], [74.04, 82.85], [83.06, 85.85], [86.5, 90.36], [90.58, 96.74], [96.96, 99.29], [99.94, 102.22], [102.43, 104.3], [104.52, 109.94], [110.16, 118.78], [118.99, 124.06], [124.7, 126.58], [126.79, 128.66], [128.88, 134.42], [135.07, 137.04], [137.26, 142.2], [142.42, 145.8], [146.45, 148.32], [148.54, 153.6], [154.25, 157.85], [158.06, 161.98], [162.19, 166.51]], "R": []}, {"num": 74, "title": "L'évaluation annuelle", "lines": [["P", "Bonjour, Camila. Ça fait déjà un an que tu es avec nous. Le temps passe vite, hein ? Avant de commencer, comment tu te sens dans l'équipe ?", "Mme Lévesque"], ["S", "Très bien. Au début, j'étais stressée, surtout avec les notes au dossier en français. Mais maintenant, je me sens vraiment à ma place.", "Camila"], ["P", "Ça paraît. Je vais commencer par les points forts. Les patients parlent de toi constamment. Ta patience avec les personnes âgées, surtout celles qui sont confuses, est remarquable. Et deux familles ont envoyé des lettres pour te remercier.", "Mme Lévesque"], ["S", "Oh, je ne le savais pas. Ça me touche beaucoup.", "Camila"], ["P", "Tes collègues aussi apprécient ton calme dans les situations urgentes. Maintenant, je veux te parler d'un point à améliorer.", "Mme Lévesque"], ["S", "Oui, bien sûr.", "Camila"], ["P", "Tu as de la difficulté à déléguer. Quand tu es responsable de l'équipe de soir, tu fais souvent toi-même des tâches que tu pourrais confier aux préposés. Résultat : tu finis tard, et tes notes sont rédigées à la dernière minute.", "Mme Lévesque"], ["S", "C'est vrai. Je pense que c'est parce que j'ai été préposée moi-même, au CHSLD. J'ai l'impression de les déranger quand je leur demande quelque chose.", "Camila"], ["P", "Je comprends, et c'est tout à ton honneur. Mais déléguer, ce n'est pas déranger. C'est leur faire confiance. Et ton rôle d'infirmière, c'est aussi de coordonner.", "Mme Lévesque"], ["S", "Vous avez raison. Qu'est-ce que vous me suggérez ?", "Camila"], ["P", "Au début de chaque quart, prends deux minutes avec les préposés pour répartir les tâches. Et la semaine prochaine, je vais t'inscrire à une formation sur le leadership clinique.", "Mme Lévesque"], ["S", "Ça me semble très utile. J'ai aussi une question. L'an dernier, j'ai parlé à M. Gendron des soins palliatifs. Est-ce que c'est encore possible ?", "Camila"], ["P", "Oui. Un poste va s'ouvrir dans l'unité de soins palliatifs au printemps. Si tu travailles sur la délégation d'ici là, je serais heureuse de te recommander.", "Mme Lévesque"], ["S", "Merci beaucoup. Je vais vraiment y travailler.", "Camila"]], "words": 304, "kind": "story", "scene": "The annual review. After her first year at the hospital, Camila meets her manager for her annual review.", "F": "Receiving criticism, setting goals", "V": "se sentir à sa place (to feel you belong); Ça paraît. (It shows.); les points forts (strengths); Ça me touche. (That means a lot to me.); déléguer, confier (to delegate, to hand over); C'est tout à ton honneur. (It's to your credit.); répartir (to divide up); le leadership clinique (clinical leadership)", "t": [[1.99, 4.39], [4.61, 7.58], [7.8, 10.06], [10.27, 14.06], [14.71, 16.58], [16.8, 20.83], [21.05, 23.98], [24.62, 26.5], [26.71, 29.52], [29.74, 32.64], [32.86, 38.45], [38.66, 42.38], [43.03, 44.9], [45.12, 46.99], [47.64, 51.89], [52.1, 55.82], [56.47, 58.34], [58.99, 61.85], [62.06, 68.57], [68.78, 73.94], [74.59, 76.46], [76.68, 80.52], [80.74, 84.05], [84.7, 87.89], [88.1, 91.13], [91.34, 93.7], [93.91, 97.82], [98.47, 100.34], [100.56, 102.43], [103.08, 108.5], [108.72, 113.95], [114.6, 116.52], [116.74, 118.61], [118.82, 121.2], [121.42, 123.46], [123.67, 125.54], [126.19, 128.06], [128.28, 132.43], [132.65, 138.05], [138.7, 140.57], [140.78, 142.68]], "R": []}, {"num": 75, "title": "Le 5 à 7 de réseautage", "lines": [["P", "Bonsoir. Je peux me joindre à vous ? Je ne connais personne ici, et vous avez l'air d'être la seule personne qui ne regarde pas son téléphone.", "Lucas"], ["S", "Ha ! Bien sûr. Je me suis promis de parler à au moins trois personnes ce soir. Je m'appelle Valérie.", "Valérie"], ["P", "Enchanté, Valérie. Moi, c'est Lucas. Qu'est-ce qui vous amène à ce 5 à 7 ?", "Lucas"], ["S", "On peut se tutoyer, si tu veux. J'ai fondé une petite entreprise il y a deux ans. On fait une application pour aider les cliniques à gérer leurs rendez-vous. Je cherche des contacts dans le domaine de la santé. Et toi ?", "Valérie"], ["P", "Je suis développeur. Je travaille pour une firme de services informatiques. Je suis ici surtout pour élargir mon réseau. Je suis arrivé du Brésil il y a deux ans, alors je connais encore peu de gens dans le milieu.", "Lucas"], ["S", "Deux ans seulement ? Ton français est vraiment bon. Et c'est quoi, ta spécialité ?", "Valérie"], ["P", "Je fais surtout des applications mobiles. Mais en ce moment, je m'intéresse beaucoup à la sécurité informatique. Je suis une formation là-dessus.", "Lucas"], ["S", "Ah, c'est intéressant. Dans le domaine de la santé, la sécurité des données, c'est un gros enjeu. On a eu beaucoup de questions de nos clients là-dessus.", "Valérie"], ["P", "J'imagine. Les données médicales sont très sensibles. Comment vous gérez ça, en ce moment ?", "Lucas"], ["S", "Avec beaucoup de stress, honnêtement ! On est seulement cinq dans l'équipe. Personne n'est vraiment spécialiste.", "Valérie"], ["P", "Si jamais tu as besoin d'un avis ou d'un coup de main, ça me ferait plaisir d'en parler. Sans engagement.", "Lucas"], ["S", "Vraiment ? Ce serait génial. Est-ce qu'on pourrait se prendre un café la semaine prochaine ?", "Valérie"], ["P", "Avec plaisir. Tu es sur LinkedIn ? Je peux t'envoyer une invitation.", "Lucas"], ["S", "Oui. Valérie Dion, avec un D. Et ma deuxième personne de la soirée, ce sera qui, à ton avis ?", "Valérie"], ["P", "Je vais te présenter mon collègue François, là-bas. Il connaît tout le monde.", "Lucas"]], "words": 307, "kind": "story", "scene": "The networking 5 à 7. At an after-work networking event, Lucas starts a conversation with an entrepreneur.", "F": "Starting a conversation, talking about your work", "V": "un 5 à 7 (an after-work gathering (Québec)); se joindre à (to join); fonder une entreprise (to start a company); élargir son réseau (to grow your network); le milieu (the field, the industry); un enjeu (an issue, a stake); un coup de main (a hand, help); sans engagement (no strings attached)", "t": [[1.99, 3.86], [4.08, 6.14], [6.36, 12.05], [12.7, 14.57], [14.78, 16.66], [16.87, 21.02], [21.24, 23.35], [24.0, 26.47], [26.69, 28.82], [29.04, 31.8], [32.45, 35.35], [35.57, 38.95], [39.17, 43.39], [43.61, 47.11], [47.33, 49.2], [49.85, 51.94], [52.15, 55.51], [55.73, 59.02], [59.23, 64.78], [65.42, 67.3], [67.51, 69.89], [70.1, 72.94], [73.58, 76.58], [76.8, 81.38], [81.6, 84.14], [84.79, 87.22], [87.43, 92.45], [92.66, 96.12], [96.77, 98.64], [98.86, 101.95], [102.17, 105.02], [105.67, 108.7], [108.91, 111.48], [111.7, 114.48], [115.13, 120.38], [120.6, 122.47], [123.12, 124.99], [125.21, 127.22], [127.44, 130.97], [131.62, 133.49], [133.7, 135.67], [135.89, 138.48], [139.13, 141.0], [141.22, 143.95], [144.17, 148.61], [149.26, 152.83], [153.05, 155.11]], "R": []}, {"num": 76, "title": "Le café avec une mentore", "lines": [["P", "Alors, Lucas, ça fait six mois qu'on se rencontre. Comment ça avance, ta réflexion sur ta carrière ?", "Isabelle"], ["S", "Beaucoup mieux. Grâce à vos conseils, j'ai demandé une promotion, et mon patron m'a confié la direction d'un projet. Mais j'ai une nouvelle question.", "Lucas"], ["P", "Je t'écoute.", "Isabelle"], ["S", "J'ai rencontré une entrepreneure à un 5 à 7. Elle a une jeune entreprise dans la santé, et elle cherche quelqu'un en sécurité informatique. Je l'aide un peu, bénévolement. Mais je me demande si je devrais quitter mon emploi pour une jeune entreprise.", "Lucas"], ["P", "C'est une grosse décision. Avant de répondre, il faut que tu te poses quelques questions. Qu'est-ce qui t'attire, dans cette entreprise ?", "Isabelle"], ["S", "Le projet a du sens. Et la sécurité, c'est ce qui me passionne en ce moment. Dans mon emploi actuel, je fais surtout des applications mobiles.", "Lucas"], ["P", "Et qu'est-ce qui te fait peur ?", "Isabelle"], ["S", "La stabilité. Je suis encore nouveau au Canada. J'ai une bonne assurance collective, un salaire stable. Dans une jeune entreprise, rien n'est garanti.", "Lucas"], ["P", "C'est une crainte légitime. Mon conseil : il ne faut pas que tu prennes une décision tout de suite. Il vaudrait mieux que tu continues à les aider quelques mois, pour voir si la relation fonctionne vraiment.", "Isabelle"], ["S", "Ça me semble sage.", "Lucas"], ["P", "Et pendant ce temps, je te suggère que tu termines ta formation et que tu obtiennes une certification reconnue en sécurité. Comme ça, que tu restes ou que tu partes, tu seras gagnant.", "Isabelle"], ["S", "Je n'avais pas pensé à ça. Et si l'entreprise m'offre un poste ?", "Lucas"], ["P", "Alors, il faudra que tu négocies bien. Demande à voir leur plan de financement. Une jeune entreprise solide doit avoir assez d'argent pour fonctionner au moins un an. Et vérifie s'ils offrent des assurances.", "Isabelle"], ["S", "Merci, Isabelle. Ce programme de mentorat a vraiment changé mon expérience au Québec.", "Lucas"], ["P", "Ça me fait plaisir. Et un jour, j'espère que tu deviendras mentor à ton tour.", "Isabelle"]], "words": 309, "kind": "story", "
